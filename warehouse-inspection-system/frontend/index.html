<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域感智能 - 仓库巡检系统</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --primary: #3b82f6;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --radius: 8px; --shadow: 0 4px 24px rgba(0,0,0,.3);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: var(--primary); text-decoration: none; }

        /* ── Login ── */
        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow); }
        .login-box h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
        .login-box .sub { text-align: center; color: var(--muted); margin-bottom: 28px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
        .form-group input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
        .form-group input:focus { border-color: var(--primary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; transition: all .2s; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; }
        .btn-primary:hover { opacity: .9; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); }
        .err-msg { background: rgba(239,68,68,.15); color: var(--danger); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }

        /* ── Main Layout ── */
        #app-screen { display: none; }
        .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .app-header h2 { font-size: 16px; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .header-right .role-badge { background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 11px; }
        .header-right .user-name { font-size: 13px; color: var(--muted); }

        /* ── Tabs ── */
        .tab-nav { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; }
        .tab-nav button { padding: 12px 20px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13px; cursor: pointer; transition: all .2s; }
        .tab-nav button:hover { color: var(--text); }
        .tab-nav button.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ── Content ── */
        .tab-content { padding: 24px; display: none; }
        .tab-content.active { display: block; }

        /* ── Stats ── */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .stat-card .value.green { color: var(--success); }
        .stat-card .value.blue { color: var(--primary); }
        .stat-card .value.yellow { color: var(--warning); }
        .stat-card .value.red { color: var(--danger); }

        /* ── Table ── */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .panel-header h3 { font-size: 14px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; background: rgba(255,255,255,.02); }
        tr:hover { background: rgba(255,255,255,.03); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge-success { background: rgba(34,197,94,.2); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,.2); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,.2); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,.2); color: var(--primary); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

        /* ── Modal ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 16px; font-size: 16px; }
        .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

        /* ── Toast ── */
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: var(--radius); color: #fff; font-size: 13px; z-index: 200; animation: slideIn .3s ease; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .tab-nav { overflow-x: auto; }
        }
    </style>
</head>
<body>

<!-- ═══════════════════ 登录界面 ═══════════════════ -->
<div id="login-screen">
    <div class="login-box">
        <h1>域感智能</h1>
        <p class="sub">仓库巡检管理系统</p>
        <div class="err-msg" id="login-err"></div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="admin123" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">登 录</button>
        </form>
    </div>
</div>

<!-- ═══════════════════ 主界面 ═══════════════════ -->
<div id="app-screen">
    <header class="app-header">
        <h2>域感智能 - 仓库巡检系统</h2>
        <div class="header-right">
            <span class="role-badge" id="user-role"></span>
            <span class="user-name" id="user-name"></span>
            <button class="btn btn-sm btn-outline" onclick="logout()">退出</button>
        </div>
    </header>

    <nav class="tab-nav">
        <button class="active" onclick="switchTab('dashboard')">实时看板</button>
        <button onclick="switchTab('drones')">无人机管理</button>
        <button onclick="switchTab('tasks')">任务管理</button>
        <button onclick="switchTab('records')">巡检记录</button>
    </nav>

    <!-- ── 实时看板 ── -->
    <div class="tab-content active" id="tab-dashboard">
        <div class="stats-grid" id="dashboard-stats"></div>
        <div class="panel">
            <div class="panel-header"><h3>最近活动</h3></div>
            <div id="recent-activity" style="padding:16px;font-size:13px;color:var(--muted);">加载中...</div>
        </div>
    </div>

    <!-- ── 无人机管理 ── -->
    <div class="tab-content" id="tab-drones">
        <div class="panel">
            <div class="panel-header">
                <h3>无人机列表</h3>
                <button class="btn btn-sm btn-primary" onclick="openDroneModal()">+ 注册无人机</button>
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead><tr><th>编号</th><th>名称</th><th>型号</th><th>状态</th><th>电量</th><th>最后位置</th><th>最后上线</th><th>操作</th></tr></thead>
                    <tbody id="drones-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ── 任务管理 ── -->
    <div class="tab-content" id="tab-tasks">
        <div class="panel">
            <div class="panel-header">
                <h3>巡检任务</h3>
                <button class="btn btn-sm btn-primary" onclick="openTaskModal()">+ 创建任务</button>
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead><tr><th>任务编号</th><th>无人机</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                    <tbody id="tasks-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ── 巡检记录 ── -->
    <div class="tab-content" id="tab-records">
        <div class="panel">
            <div class="panel-header"><h3>巡检记录</h3></div>
            <div style="overflow-x:auto">
                <table>
                    <thead><tr><th>记录编号</th><th>无人机ID</th><th>状态</th><th>RFID标签</th><th>二维码</th><th>巡检时间</th></tr></thead>
                    <tbody id="records-table"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ── 无人机Modal ── -->
<div class="modal-overlay" id="drone-modal">
    <div class="modal">
        <h3 id="drone-modal-title">注册无人机</h3>
        <form id="drone-form" onsubmit="saveDrone(event)">
            <div class="form-group"><label>无人机编号</label><input type="text" id="drone-code" required></div>
            <div class="form-group"><label>名称</label><input type="text" id="drone-name" required></div>
            <div class="form-group"><label>型号</label><input type="text" id="drone-model" value="DJI-M300" required></div>
            <div class="form-group"><label>状态</label>
                <select id="drone-status" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);">
                    <option value="offline">离线</option><option value="online">在线</option><option value="flying">飞行中</option><option value="maintenance">维护中</option>
                </select>
            </div>
            <div class="form-group"><label>电量 (%)</label><input type="number" id="drone-battery" value="100" min="0" max="100"></div>
            <div class="actions">
                <button type="button" class="btn btn-outline" onclick="closeDroneModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- ── 任务Modal ── -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h3>创建巡检任务</h3>
        <form id="task-form" onsubmit="saveTask(event)">
            <div class="form-group"><label>任务名称</label><input type="text" id="task-name" required></div>
            <div class="form-group"><label>无人机</label>
                <select id="task-drone" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);"></select>
            </div>
            <div class="form-group"><label>任务描述</label><input type="text" id="task-desc"></div>
            <div class="actions">
                <button type="button" class="btn btn-outline" onclick="closeTaskModal()">取消</button>
                <button type="submit" class="btn btn-primary">创建</button>
            </div>
        </form>
    </div>
</div>

<script>
// ═══════════════════ 全局配置 ═══════════════════
const API_BASE = 'http://localhost:8001/api/v1';
const DB_API = 'http://localhost:8000/api';
let AUTH_TOKEN = localStorage.getItem('yg_token');
let AUTH_USER = null;

// ═══════════════════ 工具函数 ═══════════════════
function toast(msg, type='success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

async function api(url, options={}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (AUTH_TOKEN) headers['Authorization'] = `Bearer ${AUTH_TOKEN}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('未授权'); }
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || err.message || '请求失败');
    }
    return res.json();
}

function formatTime(ts) {
    if (!ts) return '-';
    return new Date(ts).toLocaleString('zh-CN', { hour12: false });
}

function statusBadge(status) {
    const map = {
        online: 'success', flying: 'info', offline: 'danger', maintenance: 'warning',
        active: 'success', completed: 'success', pending: 'warning', cancelled: 'danger'
    };
    const cls = map[status] || 'info';
    return `<span class="badge badge-${cls}">${status}</span>`;
}

// ═══════════════════ 登录 ═══════════════════
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-err');
    btn.disabled = true; btn.textContent = '登录中...'; errEl.style.display = 'none';

    try {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error('用户名或密码错误');
        const data = await res.json();
        AUTH_TOKEN = data.data?.access_token || data.access_token;
        AUTH_USER = data.data?.user || data.user || { username, role: 'admin' };
        localStorage.setItem('yg_token', AUTH_TOKEN);
        localStorage.setItem('yg_user', JSON.stringify(AUTH_USER));
        showApp();
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false; btn.textContent = '登 录';
    }
}

function logout() {
    AUTH_TOKEN = null; AUTH_USER = null;
    localStorage.removeItem('yg_token');
    localStorage.removeItem('yg_user');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-err').style.display = 'none';
    document.getElementById('login-password').value = '';
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-name').textContent = AUTH_USER?.username || '';
    document.getElementById('user-role').textContent = AUTH_USER?.role || 'user';
    switchTab('dashboard');
}

// ═══════════════════ Tab切换 ═══════════════════
function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-nav button').forEach(el => el.classList.remove('active'));
    const tab = document.getElementById('tab-' + name);
    if (tab) tab.classList.add('active');
    const btns = document.querySelectorAll('.tab-nav button');
    const target = [...btns].find(b => b.textContent.includes(getTabLabel(name)));
    if (target) target.classList.add('active');

    if (name === 'dashboard') loadDashboard();
    else if (name === 'drones') loadDrones();
    else if (name === 'tasks') loadTasks();
    else if (name === 'records') loadRecords();
}

function getTabLabel(name) {
    const map = { dashboard: '看板', drones: '无人机', tasks: '任务', records: '记录' };
    return map[name] || name;
}

// ═══════════════════ 实时看板 ═══════════════════
async function loadDashboard() {
    try {
        const [drones, tasks, records] = await Promise.allSettled([
            api(`${API_BASE}/drones/`).catch(() => []),
            api(`${API_BASE}/tasks/`).catch(() => []),
            api(`${API_BASE}/inspection/records/`).catch(() => [])
        ]);
        const d = drones.value || [];
        const t = tasks.value || [];
        const r = records.value || [];
        const online = d.filter(dr => dr.status === 'online' || dr.status === 'flying').length;

        document.getElementById('dashboard-stats').innerHTML = `
            <div class="stat-card"><div class="label">无人机总数</div><div class="value blue">${d.length}</div></div>
            <div class="stat-card"><div class="label">在线无人机</div><div class="value green">${online}</div></div>
            <div class="stat-card"><div class="label">巡检任务</div><div class="value yellow">${t.length}</div></div>
            <div class="stat-card"><div class="label">巡检记录</div><div class="value">${r.length}</div></div>
        `;
        document.getElementById('recent-activity').innerHTML = r.length > 0
            ? r.slice(0, 5).map(rec => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">[${rec.record_code || 'N/A'}] 状态: ${statusBadge(rec.status)} - ${formatTime(rec.inspection_time)}</div>`).join('')
            : '<div class="empty-state">暂无巡检记录</div>';
    } catch (e) {
        document.getElementById('dashboard-stats').innerHTML = '<div class="stat-card"><div class="label">错误</div><div class="value red">!</div></div>';
    }
}

// ═══════════════════ 无人机管理 ═══════════════════
async function loadDrones() {
    try {
        const drones = await api(`${API_BASE}/drones/`).catch(() => []);
        const tbody = document.getElementById('drones-table');
        if (!drones.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无无人机，请点击"注册无人机"</td></tr>';
            return;
        }
        tbody.innerHTML = drones.map(d => `
            <tr>
                <td>${d.drone_code}</td>
                <td>${d.drone_name}</td>
                <td>${d.model || '-'}</td>
                <td>${statusBadge(d.status)}</td>
                <td>${d.battery_level != null ? d.battery_level + '%' : '-'}</td>
                <td>${d.last_position_x != null ? `(${d.last_position_x?.toFixed(1)}, ${d.last_position_y?.toFixed(1)}, ${d.last_position_z?.toFixed(1)})` : '-'}</td>
                <td>${formatTime(d.last_seen)}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="editDrone(${d.id})">编辑</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDrone(${d.id})">删除</button>
                </td>
            </tr>
        `).join('');
    } catch (e) {
        document.getElementById('drones-table').innerHTML = `<tr><td colspan="8" class="empty-state">加载失败: ${e.message}</td></tr>`;
    }
}

function openDroneModal(drone) {
    document.getElementById('drone-modal').classList.add('show');
    document.getElementById('drone-modal-title').textContent = drone ? '编辑无人机' : '注册无人机';
    document.getElementById('drone-code').value = drone?.drone_code || '';
    document.getElementById('drone-name').value = drone?.drone_name || '';
    document.getElementById('drone-model').value = drone?.model || 'DJI-M300';
    document.getElementById('drone-status').value = drone?.status || 'offline';
    document.getElementById('drone-battery').value = drone?.battery_level ?? 100;
    document.getElementById('drone-form').dataset.editId = drone?.id || '';
}

function closeDroneModal() {
    document.getElementById('drone-modal').classList.remove('show');
}

async function saveDrone(e) {
    e.preventDefault();
    const editId = document.getElementById('drone-form').dataset.editId;
    const body = {
        drone_code: document.getElementById('drone-code').value,
        drone_name: document.getElementById('drone-name').value,
        model: document.getElementById('drone-model').value,
        status: document.getElementById('drone-status').value,
        battery_level: parseFloat(document.getElementById('drone-battery').value) || 100,
    };
    try {
        const url = editId ? `${API_BASE}/drones/${editId}` : `${API_BASE}/drones/`;
        const method = editId ? 'PATCH' : 'POST';
        await api(url, { method, body: JSON.stringify(body) });
        closeDroneModal();
        toast(editId ? '更新成功' : '注册成功');
        loadDrones();
    } catch (err) { toast(err.message, 'error'); }
}

async function editDrone(id) {
    try {
        const drone = await api(`${API_BASE}/drones/${id}`);
        openDroneModal(drone);
    } catch (err) { toast(err.message, 'error'); }
}

async function deleteDrone(id) {
    if (!confirm('确认删除该无人机？')) return;
    try {
        await api(`${API_BASE}/drones/${id}`, { method: 'DELETE' });
        toast('删除成功');
        loadDrones();
    } catch (err) { toast(err.message, 'error'); }
}

// ═══════════════════ 任务管理 ═══════════════════
async function loadTasks() {
    try {
        const tasks = await api(`${API_BASE}/tasks/`).catch(() => []);
        const tbody = document.getElementById('tasks-table');
        if (!tasks.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无任务，请点击"创建任务"</td></tr>';
            return;
        }
        tbody.innerHTML = tasks.map(t => `
            <tr>
                <td>${t.task_code || t.id}</td>
                <td>${t.drone_id || '-'}</td>
                <td>${statusBadge(t.status)}</td>
                <td>${formatTime(t.created_at)}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="viewTask(${t.id})">查看</button>
                </td>
            </tr>
        `).join('');
    } catch (e) {
        document.getElementById('tasks-table').innerHTML = `<tr><td colspan="5" class="empty-state">加载失败: ${e.message}</td></tr>`;
    }
}

async function openTaskModal() {
    document.getElementById('task-modal').classList.add('show');
    try {
        const drones = await api(`${API_BASE}/drones/`).catch(() => []);
        const sel = document.getElementById('task-drone');
        sel.innerHTML = drones.map(d => `<option value="${d.id}">${d.drone_code} - ${d.drone_name}</option>`).join('');
    } catch (e) {}
}

function closeTaskModal() {
    document.getElementById('task-modal').classList.remove('show');
}

async function saveTask(e) {
    e.preventDefault();
    const body = {
        task_name: document.getElementById('task-name').value,
        drone_id: parseInt(document.getElementById('task-drone').value),
        description: document.getElementById('task-desc').value,
    };
    try {
        await api(`${API_BASE}/tasks/`, { method: 'POST', body: JSON.stringify(body) });
        closeTaskModal();
        toast('任务创建成功');
        loadTasks();
    } catch (err) { toast(err.message, 'error'); }
}

async function viewTask(id) {
    try {
        const task = await api(`${API_BASE}/tasks/${id}`);
        toast(`任务: ${task.task_code || task.id} - ${task.status}`, 'success');
    } catch (err) { toast(err.message, 'error'); }
}

// ═══════════════════ 巡检记录 ═══════════════════
async function loadRecords() {
    try {
        const records = await api(`${API_BASE}/inspection/records/`).catch(() => []);
        const tbody = document.getElementById('records-table');
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无巡检记录</td></tr>';
            return;
        }
        tbody.innerHTML = records.map(r => `
            <tr>
                <td>${r.record_code || r.id}</td>
                <td>${r.drone_id || '-'}</td>
                <td>${statusBadge(r.status)}</td>
                <td>${r.detected_rfid_tags || r.rfid_data || '-'}</td>
                <td>${r.detected_qr_codes || r.qr_code_data || '-'}</td>
                <td>${formatTime(r.inspection_time)}</td>
            </tr>
        `).join('');
    } catch (e) {
        document.getElementById('records-table').innerHTML = `<tr><td colspan="6" class="empty-state">加载失败: ${e.message}</td></tr>`;
    }
}

// ═══════════════════ 初始化 ═══════════════════
(function init() {
    if (AUTH_TOKEN) {
        try {
            AUTH_USER = JSON.parse(localStorage.getItem('yg_user'));
            showApp();
        } catch (e) { logout(); }
    }
    // 自动刷新看板
    if (AUTH_TOKEN) {
        setInterval(() => {
            const active = document.querySelector('.tab-content.active');
            if (active?.id === 'tab-dashboard') loadDashboard();
        }, 15000);
    }
})();
</script>
</body>
