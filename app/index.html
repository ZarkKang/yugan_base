<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域感智能 — 系统选择</title>
    <style>
        :root {
            --bg: #0a0f18; --surface: #111827; --surface2: #1a2332;
            --border: #1e2d3d; --text: #e2e8f0; --text2: #b0bec5; --muted: #5f7d94;
            --blue: #3b82f6; --purple: #8b5cf6;
            --radius: 10px;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 20% 30%, rgba(59,130,246,.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 60%, rgba(139,92,246,.06) 0%, transparent 50%),
                        var(--bg);
        }
        /* 顶部导航栏 */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; z-index: 100; backdrop-filter: blur(8px);
        }
        .navbar-brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 18px; font-weight: 700; color: var(--text);
        }
        .navbar-brand .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; font-weight: 700;
        }
        .navbar-time {
            font-size: 13px; color: var(--text2);
            font-family: var(--mono); display: flex; align-items: center; gap: 8px;
        }
        .navbar-time .pulse {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--success); animation: pulse 2s ease-in-out infinite;
        }
        .container { text-align: center; max-width: 640px; padding: 100px 24px 24px; }
        .brand { margin-bottom: 48px; }
        .brand h1 { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
        .brand .sub { display: block; color: var(--muted); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }
        .user-info { 
            background: var(--surface2); padding: 12px 20px; border-radius: 6px; 
            font-size: 13px; color: var(--text2); margin-bottom: 24px;
        }
        .user-info span { color: var(--blue); font-weight: 500; }
        .logout-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
            margin-left: 12px; transition: all .2s;
        }
        .logout-btn:hover { border-color: var(--red); color: var(--red); }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 32px 24px; cursor: pointer;
            transition: all .2s; text-align: left; position: relative; overflow: hidden;
            text-decoration: none; color: var(--text); display: block;
        }
        .card:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        .card.card-purple:hover { border-color: var(--purple); }
        .card .card-icon { font-size: 28px; margin-bottom: 16px; }
        .card .card-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .card .card-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }
        .card .card-path { display: inline-block; margin-top: 16px; font-size: 11px; color: var(--muted); font-family: monospace; background: var(--surface2); padding: 4px 10px; border-radius: 4px; }
        .card .card-accent {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }
        .card.card-purple .card-accent {
            background: linear-gradient(90deg, var(--purple), var(--blue));
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(59,130,246,.05), rgba(139,92,246,.05));
            opacity: 0; transition: opacity .2s; pointer-events: none;
        }
        .card:hover::before { opacity: 1; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        .footer { margin-top: 48px; font-size: 11px; color: var(--muted); }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="logo-icon">域</div>
            <span>域感智能</span>
        </div>
        <div class="navbar-time">
            <span class="pulse"></span>
            <span id="nav-time">--</span>
        </div>
    </nav>

    <div class="container">
        <div class="brand">
            <h1>域感智能</h1>
            <span class="sub">Yugan Intelligence Platform</span>
        </div>
        
        <div class="user-info" id="userInfo">
            当前用户：<span id="currentUsername">-</span>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
        
        <div class="cards">
            <a href="#" class="card card-purple" id="droneCard">
                <div class="card-accent"></div>
                <div class="card-icon">✈</div>
                <div class="card-title">无人机数据管理系统</div>
                <div class="card-desc">管理无人机图传视频、图片、RFID数据和多SKU管理</div>
                <span class="card-path">前端 3000</span>
            </a>
            <a href="#" class="card" id="warehouseCard">
                <div class="card-accent"></div>
                <div class="card-icon">◈</div>
                <div class="card-title">仓库巡检系统</div>
                <div class="card-desc">基于无人机与基站的高效化仓库巡检联合系统</div>
                <span class="card-path">前端 3000</span>
            </a>
        </div>
        <div class="footer">&copy; 2026 域感智能 · 仓库巡检与无人机数据管理平台</div>
    </div>

    <script>
        // 从 URL 参数获取 token
        function getTokenFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }
        
        // 从 URL 参数获取用户信息
        function getUserFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const userStr = urlParams.get('user');
            if (userStr) {
                try {
                    return JSON.parse(decodeURIComponent(userStr));
                } catch (e) {
                    console.error('Failed to parse user info from URL');
                    return null;
                }
            }
            return null;
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getTokenFromUrl();
            
            if (!token) {
                // 未登录，跳转到登录页
                window.location.href = 'login.html';
                return null;
            }
            
            const user = getUserFromUrl();
            return { token, user };
        }
        
        // 显示用户信息
        function displayUserInfo(authInfo) {
            if (authInfo && authInfo.user) {
                document.getElementById('currentUsername').textContent = authInfo.user.username || 'admin';
            } else {
                document.getElementById('currentUsername').textContent = 'admin';
            }
        }
        
        // 获取带 token 的 URL
        function getUrlWithToken(baseUrl) {
            const token = getTokenFromUrl();
            const user = getUserFromUrl();
            const userData = user ? `&user=${encodeURIComponent(JSON.stringify(user))}` : '';
            return `${baseUrl}?token=${encodeURIComponent(token)}${userData}`;
        }
        
        // 退出登录：清除 token 并跳转到登录页
        function logout() {
            window.location.href = 'login.html';
        }
        
        // 初始化页面
        function init() {
            // 检查认证状态
            const authInfo = checkAuth();
            if (!authInfo) return; // checkAuth 会跳转到登录页
            
            // 显示用户信息
            displayUserInfo(authInfo);
            
            // 动态检测访问方式，设置正确的路径（带 token）
            const isHttp = window.location.protocol.startsWith('http');
            const droneBase = isHttp ? '/drone/drone-db-prototype/frontend/src/index.html' : '../drone/drone-db-prototype/frontend/src/index.html';
            const warehouseBase = isHttp ? '/station/warehouse-inspection-system/frontend/index.html' : '../station/warehouse-inspection-system/frontend/index.html';
            
            document.getElementById('droneCard').href = getUrlWithToken(droneBase);
            document.getElementById('warehouseCard').href = getUrlWithToken(warehouseBase);
        }
        
        // 页面加载时初始化
        init();

        // 更新实时时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateStr = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            document.getElementById('nav-time').textContent = `${dateStr} ${timeStr}`;
        }

        // 立即更新并设置定时器
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
