<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域感智能</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0c10 0%, #12151c 50%, #1a1e28 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #f0f4f8;
            overflow-x: hidden;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(30, 35, 48, 0.3);
            border-bottom: 1px solid rgba(45, 55, 72, 0.3);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .toolbar-title {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #f0f4f8, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .toolbar-subtitle {
            font-size: 12px;
            color: #4a5568;
            font-family: 'JetBrains Mono', monospace;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(45, 55, 72, 0.8);
            background: rgba(30, 35, 48, 0.8);
            color: #8b95a5;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        .toolbar-btn.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.4);
            color: #00d4ff;
        }

        /* 内容区 */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .project-card {
            background: rgba(30, 35, 48, 0.8);
            border: 1px solid rgba(45, 55, 72, 0.8);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-color), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 20px var(--glow-color);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-card.cyan {
            --accent-color: #00d4ff;
            --glow-color: rgba(0, 212, 255, 0.2);
        }

        .project-card.purple {
            --accent-color: #a855f7;
            --glow-color: rgba(168, 85, 247, 0.2);
        }

        .project-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }

        .project-icon {
            font-size: 40px;
        }

        .project-info {
            flex: 1;
        }

        .project-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent-color);
        }

        .project-desc {
            font-size: 13px;
            color: #8b95a5;
            line-height: 1.4;
        }

        .project-arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: all 0.3s;
            color: var(--accent-color);
        }

        .project-card:hover .project-arrow {
            opacity: 1;
            right: 16px;
        }

        /* 连接状态 */
        .connection-status {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(45, 55, 72, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a5568;
        }

        .status-indicator.connected {
            background: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        .status-indicator.disconnected {
            background: #ff3d5a;
        }

        .status-indicator.checking {
            background: #faad14;
            animation: pulse 1s infinite;
        }

        .status-text {
            color: #8b95a5;
        }

        .status-url {
            color: #4a5568;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            margin-left: auto;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            width: 320px;
            background: rgba(30, 35, 48, 0.98);
            border: 1px solid rgba(45, 55, 72, 0.8);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            animation: slideIn 0.2s ease;
        }

        .settings-panel.visible {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(45, 55, 72, 0.5);
        }

        .settings-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f4f8;
        }

        .settings-close {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: #8b95a5;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        .settings-close:hover {
            background: rgba(255, 61, 90, 0.2);
            color: #ff3d5a;
        }

        .settings-section {
            margin-bottom: 16px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 12px;
            color: #8b95a5;
            margin-bottom: 8px;
            display: block;
        }

        .settings-btn {
            width: 100%;
            padding: 10px 16px;
            background: rgba(45, 55, 72, 0.8);
            border: 1px solid rgba(45, 55, 72, 1);
            border-radius: 8px;
            color: #f0f4f8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .settings-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        .settings-btn.danger {
            background: rgba(255, 61, 90, 0.1);
            border-color: rgba(255, 61, 90, 0.3);
            color: #ff3d5a;
        }

        .settings-btn.danger:hover {
            background: rgba(255, 61, 90, 0.2);
        }

        .settings-info {
            font-size: 11px;
            color: #4a5568;
            text-align: center;
            margin-top: 16px;
        }

        /* 警告提示 */
        .warning-banner {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .warning-banner.visible {
            display: flex;
        }

        .warning-icon {
            font-size: 20px;
        }

        .warning-text {
            flex: 1;
            font-size: 13px;
            color: #ff6b35;
        }

        .warning-text strong {
            display: block;
            margin-bottom: 2px;
        }

        /* 版本信息 */
        .version-info {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #4a5568;
            font-family: 'JetBrains Mono', monospace;
            border-top: 1px solid rgba(45, 55, 72, 0.3);
        }

        /* 调试信息 */
        .debug-info {
            font-size: 11px;
            color: #faad14;
            padding: 10px;
            background: rgba(250, 173, 20, 0.1);
            border-radius: 8px;
            margin-top: 10px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 自定义确认弹窗 */
        .custom-confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .custom-confirm-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .custom-confirm-box {
            background: #1e2330;
            border: 1px solid rgba(45, 55, 72, 0.8);
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 1px rgba(0, 212, 255, 0.2);
            transform: scale(0.92) translateY(12px);
            transition: all 0.25s ease;
        }

        .custom-confirm-overlay.active .custom-confirm-box {
            transform: scale(1) translateY(0);
        }

        .custom-confirm-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .custom-confirm-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f4f8;
            margin-bottom: 8px;
        }

        .custom-confirm-msg {
            font-size: 13px;
            color: #8b95a5;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .custom-confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .custom-confirm-btn {
            padding: 9px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .custom-confirm-btn-cancel {
            background: rgba(45, 55, 72, 0.8);
            color: #8b95a5;
            border: 1px solid rgba(45, 55, 72, 1);
        }

        .custom-confirm-btn-cancel:hover {
            background: rgba(45, 55, 72, 1);
            color: #f0f4f8;
        }

        .custom-confirm-btn-ok {
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            color: #fff;
        }

        .custom-confirm-btn-ok:hover {
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.35);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-logo">🏢</div>
            <div class="toolbar-title">域感智能</div>
            <div class="toolbar-subtitle">DESKTOP v1.0.0</div>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn" onclick="toggleSettings()" id="settingsBtn" title="设置">
                ⚙️
            </button>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="content-area">
        <!-- 警告提示 -->
        <div class="warning-banner" id="warningBanner">
            <div class="warning-icon">⚠️</div>
            <div class="warning-text">
                <strong>后端服务未连接</strong>
                <span id="warningMessage">正在自动检测服务...</span>
            </div>
        </div>

        <!-- 调试信息 -->
        <div class="debug-info" id="debugInfo" style="display: none;"></div>

        <!-- 项目卡片 -->
        <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <!-- 版本信息 -->
    <div class="version-info">
        Electron v<span id="electronVersion">--</span> | Node.js v<span id="nodeVersion">--</span>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <span class="settings-title">设置</span>
            <button class="settings-close" onclick="toggleSettings()">✕</button>
        </div>

        <div class="settings-section">
            <label class="settings-label">服务连接</label>
            <button class="settings-btn" onclick="detectServices()">
                🔍 重新检测后端服务
            </button>
        </div>

        <div class="settings-section">
            <label class="settings-label">系统</label>
            <button class="settings-btn" onclick="showAbout()">
                ℹ️ 关于
            </button>
            <button class="settings-btn danger" onclick="quitApp()" style="margin-top: 8px;">
                ⏻ 退出应用
            </button>
        </div>

        <div class="settings-info">
            按 Alt 键显示菜单栏
        </div>
    </div>

    <!-- 自定义确认弹窗 -->
    <div class="custom-confirm-overlay" id="customConfirmOverlay">
        <div class="custom-confirm-box">
            <div class="custom-confirm-icon" id="confirmIcon">⚠️</div>
            <div class="custom-confirm-title" id="confirmTitle">提示</div>
            <div class="custom-confirm-msg" id="confirmMsg">确认操作？</div>
            <div class="custom-confirm-actions">
                <button class="custom-confirm-btn custom-confirm-btn-cancel" id="confirmCancelBtn">取消</button>
                <button class="custom-confirm-btn custom-confirm-btn-ok" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>

    <script>
        let projectConnections = {};
        let settingsVisible = false;
        let autoReconnectTimer = null;
        const AUTO_RECONNECT_INTERVAL = 10000; // 10秒重试一次

        // 调试日志
        function log(message) {
            console.log('[Launcher]', message);
            const debugInfo = document.getElementById('debugInfo');
            if (debugInfo) {
                debugInfo.style.display = 'block';
                debugInfo.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            }
        }

        // 设置面板
        function toggleSettings() {
            settingsVisible = !settingsVisible;
            const panel = document.getElementById('settingsPanel');
            const btn = document.getElementById('settingsBtn');

            if (settingsVisible) {
                panel.classList.add('visible');
                btn.classList.add('active');
            } else {
                panel.classList.remove('visible');
                btn.classList.remove('active');
            }
        }

        // 点击外部关闭设置面板
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('settingsPanel');
            const btn = document.getElementById('settingsBtn');

            if (settingsVisible && !panel.contains(e.target) && !btn.contains(e.target)) {
                toggleSettings();
            }
        });

        // 加载项目列表
        async function loadProjects() {
            try {
                log('开始加载项目列表...');
                const projects = await window.electronAPI.getProjects();
                log('获取到项目: ' + JSON.stringify(projects));
                
                const grid = document.getElementById('projectsGrid');
                if (!grid) {
                    log('错误: projectsGrid 元素不存在');
                    return;
                }

                grid.innerHTML = projects.map((project, index) => `
                    <div class="project-card ${index === 0 ? 'cyan' : 'purple'}" onclick="selectProject('${project.id}')">
                        <div class="project-header">
                            <div class="project-icon">${project.icon}</div>
                            <div class="project-info">
                                <div class="project-name">${project.name}</div>
                                <div class="project-desc">${project.description}</div>
                            </div>
                        </div>
                        <div class="connection-status" id="status-${project.id}">
                            <div class="status-indicator checking"></div>
                            <span class="status-text">检测中...</span>
                        </div>
                        <div class="project-arrow">→</div>
                    </div>
                `).join('');

                log('项目卡片已渲染');
            } catch (error) {
                log('加载项目失败: ' + error.message + '\n' + error.stack);
                console.error('加载项目失败:', error);
            }
        }

        // 更新连接状态
        function updateConnectionStatus(projectId, status) {
            const statusEl = document.getElementById(`status-${projectId}`);
            if (!statusEl) return;

            const indicator = statusEl.querySelector('.status-indicator');
            const text = statusEl.querySelector('.status-text');

            if (status && status.connected) {
                indicator.className = 'status-indicator connected';
                text.textContent = '已连接';
                let urlEl = statusEl.querySelector('.status-url');
                if (!urlEl) {
                    urlEl = document.createElement('span');
                    urlEl.className = 'status-url';
                    statusEl.appendChild(urlEl);
                }
                urlEl.textContent = status.url;
            } else {
                indicator.className = 'status-indicator disconnected';
                text.textContent = '未连接';
                const urlEl = statusEl.querySelector('.status-url');
                if (urlEl) urlEl.remove();
            }
        }

        // 检测服务
        async function detectServices() {
            try {
                log('开始检测后端服务...');
                const results = await window.electronAPI.detectBackends();
                log('检测结果: ' + JSON.stringify(results));

                for (const [projectId, result] of Object.entries(results)) {
                    if (result) {
                        projectConnections[projectId] = {
                            connected: true,
                            url: result.baseUrl
                        };
                    } else {
                        projectConnections[projectId] = {
                            connected: false,
                            url: null
                        };
                    }
                    updateConnectionStatus(projectId, projectConnections[projectId]);
                }

                const anyConnected = Object.values(projectConnections).some(c => c && c.connected);
                const warningBanner = document.getElementById('warningBanner');
                const warningMessage = document.getElementById('warningMessage');

                if (!anyConnected) {
                    warningBanner.classList.add('visible');
                    warningMessage.textContent = '请确保后端服务已启动，端口 8000/8001 或 8080';
                    startAutoReconnect();
                } else {
                    warningBanner.classList.remove('visible');
                    stopAutoReconnect();
                }
            } catch (error) {
                log('检测失败: ' + error.message);
                console.error('检测失败:', error);
            }
        }

        // 自动重连（当有服务未连接时定期重试）
        function startAutoReconnect() {
            if (autoReconnectTimer) return;
            log('启动自动重连机制...');
            autoReconnectTimer = setInterval(() => {
                const anyDisconnected = Object.values(projectConnections).some(c => !c || !c.connected);
                if (anyDisconnected) {
                    log('自动重连检测中...');
                    detectServices();
                } else {
                    stopAutoReconnect();
                }
            }, AUTO_RECONNECT_INTERVAL);
        }

        function stopAutoReconnect() {
            if (autoReconnectTimer) {
                clearInterval(autoReconnectTimer);
                autoReconnectTimer = null;
                log('自动重连已停止（所有服务已连接）');
            }
        }

        // 自定义确认弹窗（替代原生 window.confirm）
        function customConfirm(title, msg, icon = '⚠️') {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customConfirmOverlay');
                const iconEl = document.getElementById('confirmIcon');
                const titleEl = document.getElementById('confirmTitle');
                const msgEl = document.getElementById('confirmMsg');
                const okBtn = document.getElementById('confirmOkBtn');
                const cancelBtn = document.getElementById('confirmCancelBtn');

                iconEl.textContent = icon;
                titleEl.textContent = title;
                msgEl.textContent = msg;

                overlay.classList.add('active');

                function cleanup() {
                    overlay.classList.remove('active');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                }

                function onOk() {
                    cleanup();
                    resolve(true);
                }

                function onCancel() {
                    cleanup();
                    resolve(false);
                }

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);

                // 点击遮罩层关闭
                overlay.addEventListener('click', function handler(e) {
                    if (e.target === overlay) {
                        overlay.removeEventListener('click', handler);
                        cleanup();
                        resolve(false);
                    }
                });
            });
        }

        // 选择项目
        async function selectProject(projectId) {
            log('选择项目: ' + projectId);
            const status = projectConnections[projectId];
            if (!status || !status.connected) {
                const confirmLoad = await customConfirm(
                    '后端服务未连接',
                    '系统可能无法正常工作，是否继续进入？',
                    '⚠️'
                );
                if (!confirmLoad) return;
            }

            try {
                await window.electronAPI.loadProject(projectId);
            } catch (error) {
                log('加载项目失败: ' + error.message);
                console.error('加载项目失败:', error);
            }
        }

        // 显示关于
        function showAbout() {
            alert('域感智能桌面应用程序\n版本: 1.0.0\n\n整合无人机数据库系统和仓库巡检系统');
        }

        // 退出应用
        async function quitApp() {
            const confirm = await customConfirm('退出应用', '确定要退出域感智能吗？', '⏻');
            if (confirm) {
                await window.electronAPI.quitApp();
            }
        }

        // 显示版本信息
        function showVersionInfo() {
            if (window.electronAPI && window.electronAPI.versions) {
                document.getElementById('electronVersion').textContent = window.electronAPI.versions.electron;
                document.getElementById('nodeVersion').textContent = window.electronAPI.versions.node;
                log('版本信息已更新');
            } else {
                log('window.electronAPI 或 versions 不存在');
            }
        }

        // 监听连接状态更新
        function setupConnectionListener() {
            if (window.electronAPI && window.electronAPI.onConnectionStatus) {
                window.electronAPI.onConnectionStatus((status) => {
                    log('收到连接状态更新: ' + JSON.stringify(status));
                    for (const [projectId, connStatus] of Object.entries(status)) {
                        const keyMap = {
                            'droneDb': 'drone-db',
                            'warehouseInspection': 'warehouse-inspection'
                        };
                        const mappedKey = keyMap[projectId] || projectId;

                        if (mappedKey === 'drone-db' || mappedKey === 'warehouse-inspection') {
                            projectConnections[mappedKey] = {
                                connected: connStatus.connected,
                                url: connStatus.url
                            };
                            updateConnectionStatus(mappedKey, projectConnections[mappedKey]);
                        }
                    }

                    const anyConnected = Object.values(projectConnections).some(c => c && c.connected);
                    const warningBanner = document.getElementById('warningBanner');
                    if (!anyConnected && warningBanner) {
                        warningBanner.classList.add('visible');
                        startAutoReconnect();
                    } else if (warningBanner) {
                        warningBanner.classList.remove('visible');
                        stopAutoReconnect();
                    }
                });
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM 已加载');
            
            if (window.electronAPI) {
                log('window.electronAPI 存在');
            } else {
                log('错误: window.electronAPI 不存在！');
            }

            loadProjects();
            showVersionInfo();
            setupConnectionListener();
            
            setTimeout(() => {
                log('延迟执行服务检测...');
                detectServices();
            }, 500);
        });
    </script>
</body>
</html>
