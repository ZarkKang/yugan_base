<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域感智能 — 仓库巡检系统</title>
    <style>
        :root {
            --bg: #0a0f18; --surface: #111827; --surface2: #1a2332;
            --border: #1e2d3d; --border2: #243447;
            --text: #e2e8f0; --text2: #b0bec5; --muted: #5f7d94;
            --blue: #3b82f6; --purple: #8b5cf6;
            --primary: linear-gradient(135deg, var(--blue), var(--purple));
            --primary-solid: #3b82f6;
            --primary2: #2563eb;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --radius: 6px; --radius-lg: 10px;
            --sidebar-w: 220px;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 14px; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
        }
        a { color: var(--primary); text-decoration: none; }

        /* ── Login Screen ── */
        #login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
            background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(16,185,129,.06) 0%, transparent 60%),
                        var(--bg);
        }
        .login-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 44px 40px; width: 100%;
            max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,.4);
        }
        .login-panel .brand { text-align: center; margin-bottom: 32px; }
        .login-panel .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
        .login-panel .brand span { display: block; color: var(--primary); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
        .field input, .field select {
            width: 100%; padding: 10px 12px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-size: 14px; font-family: var(--font); outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        .field select { cursor: pointer; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 9px 16px; border: none; border-radius: var(--radius);
            font-size: 13px; font-family: var(--font); font-weight: 500;
            cursor: pointer; transition: all .15s; white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff; border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            opacity: .95;
        }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: .85; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-outline:hover { border-color: var(--primary); color: var(--text); }
        .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
        .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.04); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-block { width: 100%; }
        .login-err { background: rgba(239,68,68,.12); color: var(--danger); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; display: none; }

        /* ── App Layout ── */
        #app-screen { display: none; height: 100vh; }
        .app-shell { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w); min-width: var(--sidebar-w);
            background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow-y: auto;
            position: relative; z-index: 10;
        }
        .sidebar-brand {
            padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-brand .logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff; font-weight: 700; flex-shrink: 0;
        }
        .sidebar-brand .name { font-size: 14px; font-weight: 600; }
        .sidebar-brand .ver { font-size: 10px; color: var(--muted); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav .nav-section {
            font-size: 10px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 1.5px; padding: 12px 12px 8px; font-weight: 600;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: var(--radius);
            font-size: 13px; color: var(--text2); cursor: pointer;
            transition: all .12s; margin-bottom: 2px; position: relative;
        }
        .nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(139,92,246,.12));
            color: var(--primary-solid); font-weight: 500;
        }
        .nav-item .icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
        .nav-item .dot.green { background: var(--success); }
        .nav-item .dot.yellow { background: var(--warning); }
        .nav-item .dot.red { background: var(--danger); }
        .sidebar-footer {
            padding: 12px 16px; border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-footer .avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #fff; font-weight: 600; flex-shrink: 0;
        }
        .sidebar-footer .info { font-size: 12px; line-height: 1.4; }
        .sidebar-footer .info .role { color: var(--muted); font-size: 10px; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .topbar {
            height: 48px; min-height: 48px; background: var(--surface);
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between; padding: 0 24px;
        }
        .topbar .page-title { font-size: 15px; font-weight: 600; }
        .topbar .actions { display: flex; gap: 8px; align-items: center; }
        .topbar .live-indicator { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .topbar .live-indicator .pulse {
            width: 6px; height: 6px; border-radius: 50%; background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        .btn-back {
            background: linear-gradient(135deg, rgba(59,130,246,.15), rgba(139,92,246,.15));
            color: var(--primary-solid);
            border: 1px solid rgba(59,130,246,.25);
            padding: 6px 12px; border-radius: var(--radius); font-size: 12px; cursor: pointer;
            transition: all .15s; font-family: var(--font); display: flex; align-items: center; gap: 4px;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(59,130,246,.25));
        }
        /* 系统切换下拉菜单 */
        .system-switch {
            position: relative; display: inline-block;
        }
        .system-switch-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text2); padding: 6px 12px; border-radius: var(--radius);
            font-size: 12px; cursor: pointer; transition: all .15s;
            font-family: var(--font); display: flex; align-items: center; gap: 6px;
        }
        .system-switch-btn:hover {
            border-color: var(--primary-solid); color: var(--text);
        }
        .system-switch-btn .arrow { font-size: 10px; }
        .system-dropdown {
            display: none; position: absolute; top: 100%; right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); min-width: 180px;
            box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 50;
            margin-top: 4px; overflow: hidden;
        }
        .system-dropdown.show { display: block; }
        .system-dropdown-item {
            padding: 10px 14px; font-size: 13px; color: var(--text2);
            cursor: pointer; transition: all .12s;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .system-dropdown-item:last-child { border-bottom: none; }
        .system-dropdown-item:hover {
            background: rgba(255,255,255,.04); color: var(--text);
        }
        .system-dropdown-item.active {
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(139,92,246,.12));
            color: var(--primary-solid);
        }
        .system-dropdown-item .icon { font-size: 16px; width: 20px; }

        .content { flex: 1; overflow-y: auto; padding: 24px; }
        .page { display: none; }
        .page.active { display: block; }

        /* ── Stats Row ── */
        .stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px 18px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .stat-item .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .stat-item .stat-value { font-size: 26px; font-weight: 700; font-family: var(--mono); }
        .stat-item .stat-sub { font-size: 11px; color: var(--text2); }
        .stat-item .stat-value.c-blue { color: var(--primary); }
        .stat-item .stat-value.c-green { color: var(--success); }
        .stat-item .stat-value.c-yellow { color: var(--warning); }
        .stat-item .stat-value.c-red { color: var(--danger); }

        /* ── Panel / Table ── */
        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
        }
        .panel-header {
            padding: 12px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px; font-weight: 600;
        }
        .panel-header .count { font-size: 11px; color: var(--muted); font-weight: 400; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border2); }
        th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; background: rgba(0,0,0,.15); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,.02); }
        .badge {
            display: inline-block; padding: 3px 8px; border-radius: 10px;
            font-size: 10.5px; font-weight: 500; letter-spacing: .3px;
        }
        .badge-success { background: rgba(16,185,129,.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,.15); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,.15); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,.15); color: var(--primary); }
        .badge-muted { background: rgba(100,116,139,.15); color: var(--muted); }
        .empty-row td { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; }
        .row-actions { display: flex; gap: 4px; }
        .mono { font-family: var(--mono); font-size: 11px; }
        .truncate { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Progress bar */
        .progress-bar {
            height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px;
        }
        .progress-bar .fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
            z-index: 100; align-items: center; justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px; width: 90%; max-width: 520px;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.5);
            animation: modalIn .2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal h3 { margin-bottom: 20px; font-size: 16px; font-weight: 600; }
        .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .modal-wide { max-width: 680px; }

        /* ── Toast ── */
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 10px 18px; border-radius: var(--radius); color: #fff; font-size: 13px;
            font-family: var(--font); animation: toastIn .25s ease; max-width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,.3);
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes toastIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── Image Grid ── */
        .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .img-card {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color .15s;
        }
        .img-card:hover { border-color: var(--primary); }
        .img-card .thumb {
            width: 100%; height: 140px; object-fit: cover; display: block;
            background: var(--bg);
        }
        .img-card .meta { padding: 8px 10px; font-size: 11px; }
        .img-card .meta .status-row { display: flex; justify-content: space-between; align-items: center; }
        .img-card .meta .sku { font-family: var(--mono); font-size: 11px; color: var(--primary); }

        /* ── Live Feed ── */
        .live-feed { max-height: 300px; overflow-y: auto; }
        .live-feed .item {
            padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--border2);
            display: flex; align-items: center; gap: 8px;
        }
        .live-feed .item .time { color: var(--muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }

        /* ── Gateway log ── */
        .log-line { padding: 6px 12px; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid var(--border2); color: var(--text2); }
        .log-line .ts { color: var(--muted); margin-right: 8px; }

        /* ── Two Column ── */
        .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .col2 { grid-template-columns: 1fr; } }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar { width: 56px; min-width: 56px; }
            .sidebar-brand .name, .sidebar-brand .ver,
            .nav-item span:not(.icon), .nav-section,
            .sidebar-footer .info { display: none; }
            .nav-item { justify-content: center; padding: 10px; }
            .stat-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<!-- ═══════════════════ APP ═══════════════════ -->
<!-- 开发模式：跳过登录验证，直接进入系统 -->
<div id="app-screen">
<div class="app-shell">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo">域</div>
        <div><div class="name">域感智能</div><div class="ver">巡检系统 v1.0</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-section">概览</div>
        <div class="nav-item active" data-page="dashboard"><span class="icon">◈</span> 实时看板</div>
        <div class="nav-section">资源管理</div>
        <div class="nav-item" data-page="drones"><span class="icon">✈</span> 无人机</div>
        <div class="nav-item" data-page="tasks"><span class="icon">☰</span> 巡检任务</div>
        <div class="nav-item" data-page="records"><span class="icon">▤</span> 巡检记录</div>
        <div class="nav-item" data-page="inbound"><span class="icon">⊟</span> 入库管理</div>
<div class="nav-item" data-page="shelves"><span class="icon">▦</span> 货架管理</div>
        <div class="nav-item" data-page="skus"><span class="icon">◎</span> SKU管理</div>
        <div class="nav-section">数据</div>
        <div class="nav-item" data-page="images"><span class="icon">▣</span> 图像管理</div>
        <div class="nav-item" data-page="videos"><span class="icon">▶</span> 视频管理</div>
        <div class="nav-item" data-page="gateway"><span class="icon">⇋</span> 数据网关</div>
        <div class="nav-section">系统</div>
        <div class="nav-item" data-page="system"><span class="icon">⚙</span> 系统状态</div>
        <div class="nav-item" data-page="drone_integration"><span class="icon">◉</span> 无人机整合</div>
        <div class="nav-item" data-page="rfid_dashboard"><span class="icon">▦</span> RFID看板</div>
        <div class="nav-item" data-page="rfid_settings"><span class="icon">⊞</span> RFID设置</div>
    </nav>
    <div class="sidebar-footer">
        <div class="avatar" id="sb-avatar">A</div>
        <div class="info">
            <div id="sb-name">admin</div>
            <div class="role" id="sb-role">管理员</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" style="margin-left:auto;" title="退出登录">↩</button>
    </div>
</aside>

<!-- Main Content -->
<div class="main">
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="btn-back" onclick="goToSystemSelection()" title="返回系统选择">← 返回</button>
            <div class="page-title" id="page-title">实时看板</div>
        </div>
        <div style="background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(139,92,246,.15));border:1px solid rgba(59,130,246,.3);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--text2);margin:0 12px;">
            功能已迁移至 <a href="javascript:void(0)" onclick="goToDroneDB()" style="color:var(--blue);font-weight:600;text-decoration:underline;">基站数据库</a>，本页面仅作备用
        </div>
        <div class="actions">
            <!-- 系统切换下拉菜单 -->
            <div class="system-switch">
                <button class="system-switch-btn" onclick="toggleSystemDropdown()">
                    <span>仓库系统</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="system-dropdown" id="system-dropdown">
                    <div class="system-dropdown-item" onclick="switchToDrone()">
                        <span class="icon">✈</span>
                        <span>基站数据库</span>
                    </div>
                    <div class="system-dropdown-item active">
                        <span class="icon">◈</span>
                        <span>仓库巡检系统</span>
                    </div>
                    <div class="system-dropdown-item" onclick="goToSystemSelection()">
                        <span class="icon">≡</span>
                        <span>系统选择页</span>
                    </div>
                </div>
            </div>
            <div class="live-indicator"><span class="pulse"></span><span id="live-time">--</span></div>
        </div>
    </div>
    <div class="content" id="content-area">
        <!-- Pages rendered dynamically -->
    </div>
</div>

</div>
</div>

<!-- ═══════════════════ MODALS ═══════════════════ -->
<div class="modal-overlay" id="modal-drone"><div class="modal"><h3 id="modal-drone-title">注册无人机</h3><form id="form-drone" onsubmit="saveDrone(event)"><input type="hidden" id="fd-id"><div class="field"><label>无人机编号</label><input type="text" id="fd-code" required></div><div class="field"><label>名称</label><input type="text" id="fd-name" required></div><div class="field"><label>型号</label><input type="text" id="fd-model" value="DJI-M300"></div><div class="field"><label>状态</label><select id="fd-status"><option value="offline">离线</option><option value="online">在线</option><option value="flying">飞行中</option><option value="maintenance">维护中</option></select></div><div class="field"><label>电量 (%)</label><input type="number" id="fd-battery" value="100" min="0" max="100"></div><div class="actions"><button type="button" class="btn btn-outline" onclick="closeModal('modal-drone')">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></div></div>

<div class="modal-overlay" id="modal-task"><div class="modal"><h3>创建巡检任务</h3><form id="form-task" onsubmit="saveTask(event)"><div class="field"><label>任务编号</label><input type="text" id="ft-code" required></div><div class="field"><label>任务名称</label><input type="text" id="ft-name" required></div><div class="field"><label>任务类型</label><select id="ft-type"><option value="routine">常规巡检</option><option value="emergency">紧急巡检</option><option value="custom">自定义</option></select></div><div class="field"><label>指派无人机</label><select id="ft-drone"></select></div><div class="field"><label>飞行高度 (m)</label><input type="number" id="ft-altitude" value="5.0" step="0.1"></div><div class="field"><label>飞行速度 (m/s)</label><input type="number" id="ft-speed" value="2.0" step="0.1"></div><div class="actions"><button type="button" class="btn btn-outline" onclick="closeModal('modal-task')">取消</button><button type="submit" class="btn btn-primary">创建</button></div></form></div></div>

<div class="modal-overlay" id="modal-shelf"><div class="modal"><h3 id="modal-shelf-title">注册货架</h3><form id="form-shelf" onsubmit="saveShelf(event)"><input type="hidden" id="fs-id"><div class="field"><label>货架编号</label><input type="text" id="fs-code" required></div><div class="field"><label>货架名称</label><input type="text" id="fs-name"></div><div class="field"><label>区域</label><input type="text" id="fs-zone"></div><div class="field"><label>位置 X</label><input type="number" id="fs-x" step="0.1"></div><div class="field"><label>位置 Y</label><input type="number" id="fs-y" step="0.1"></div><div class="field"><label>位置 Z</label><input type="number" id="fs-z" step="0.1"></div><div class="actions"><button type="button" class="btn btn-outline" onclick="closeModal('modal-shelf')">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></div></div>

<div class="modal-overlay" id="modal-image"><div class="modal modal-wide"><h3>图像详情</h3><div id="image-detail-content"></div><div class="actions"><button type="button" class="btn btn-outline" onclick="closeModal('modal-image')">关闭</button></div></div></div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════ CONFIG ═══════════════════
const API = `http://${window.location.hostname}:8001/api/v1`;

// 从 URL 参数获取 token
function getUnifiedToken() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('token');
}

// 从 URL 参数获取用户信息
function getUserFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const userStr = urlParams.get('user');
    if (userStr) {
        try {
            return JSON.parse(decodeURIComponent(userStr));
        } catch (e) {
            console.error('Failed to parse user info from URL');
        }
    }
    return null;
}

// 获取统一认证 token 和用户信息
let TOKEN = getUnifiedToken() || '';
let USER = getUserFromUrl() || { username: 'admin', role: 'admin', full_name: '管理员' };

// ═══════════════════ UTILS ═══════════════════
function toast(msg, type='success') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

async function api(url, opts={}) {
    const h = { 'Content-Type':'application/json', ...opts.headers };
    if (TOKEN) h['Authorization'] = `Bearer ${TOKEN}`;
    const res = await fetch(url, { ...opts, headers: h });
    if (res.status === 401) {
        // Token 失效或缺失，跳转登录页
        console.warn('[api] 401 未授权，跳转登录页');
        redirectToLogin();
        throw new Error('未授权，正在跳转登录页');
    }
    if (!res.ok) {
        const e = await res.json().catch(()=>({message:res.statusText}));
        const msg = e.message || e.detail || `请求失败 (${res.status})`;
        throw new Error(msg);
    }
    return res.json();
}

// 跳转到统一登录页（带回调地址）
function redirectToLogin() {
    const currentUrl = window.location.href;
    window.location.href = `/app/login.html?redirect=${encodeURIComponent(currentUrl)}`;
}

function fmtTime(ts) { if (!ts) return '-'; return new Date(ts).toLocaleString('zh-CN',{hour12:false}); }
function fmtShort(ts) { if (!ts) return '-'; return new Date(ts).toLocaleTimeString('zh-CN',{hour12:false}); }

function badge(s, map) {
    const m = map || { online:'success', flying:'info', offline:'muted', maintenance:'warning',
        running:'info', finished:'success', cancelled:'muted', created:'warning',
        completed:'success', pending:'warning', abnormal:'danger', in_progress:'info',
        processing:'info', processed:'success', failed:'danger',
        normal:'success', misplaced:'warning', missing:'danger', extra:'danger', duplicate:'warning' };
    const c = m[s] || 'muted';
    return `<span class="badge badge-${c}">${s}</span>`;
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function openModal(id) { document.getElementById(id).classList.add('show'); }

// ═══════════════════ LOGIN ═══════════════════
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('l-btn'), err = document.getElementById('login-err');
    btn.disabled = true; btn.textContent = '登录中...'; err.style.display = 'none';
    try {
        const u = document.getElementById('l-user').value, p = document.getElementById('l-pass').value;
        const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p}) });
        if (!res.ok) throw new Error('用户名或密码错误');
        const data = await res.json();
        TOKEN = data.data?.access_token || data.access_token;
        USER = data.data?.user || data.user || { username: u, role: 'admin', full_name: u };
        // 开发模式：跳转到系统选择页（不带token）
        const isHttp = window.location.protocol.startsWith('http');
        window.location.href = isHttp ? '/app/index.html' : '../../app/index.html';
    } catch(ex) { err.textContent = ex.message; err.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = '登 录'; }
}

function logout() {
    goToSystemSelection();
}

function goToSystemSelection() {
    // 返回系统选择页（动态路径）
    const isHttp = window.location.protocol.startsWith('http');
    window.location.href = isHttp ? '/app/index.html' : '../../app/index.html';
}

// 跳转到整合后的基站数据库前端（携带 token）
function goToDroneDB() {
    const isHttp = window.location.protocol.startsWith('http');
    const base = isHttp ? '/drone/' : '../../../../drone/drone-db-prototype/frontend/src/index.html';
    const url = TOKEN ? `${base}?token=${encodeURIComponent(TOKEN)}` : base;
    window.open(url, '_blank');
}

// 系统切换下拉菜单控制
function toggleSystemDropdown() {
    const dropdown = document.getElementById('system-dropdown');
    dropdown.classList.toggle('show');
}

function switchToDrone() {
    // 切换到无人机数据系统（动态路径）
    const isHttp = window.location.protocol.startsWith('http');
    window.location.href = isHttp ? '/drone/drone-db-prototype/frontend/src/index.html' : '../../drone/drone-db-prototype/frontend/src/index.html';
}

// 点击其他区域关闭下拉菜单
document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('system-dropdown');
    const switchBtn = e.target.closest('.system-switch');
    if (!switchBtn && dropdown && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
    }
});

function showApp() {
    document.getElementById('app-screen').style.display='block';
    document.getElementById('sb-name').textContent = USER?.full_name || USER?.username || '';
    document.getElementById('sb-role').textContent = USER?.role || '用户';
    document.getElementById('sb-avatar').textContent = (USER?.full_name || USER?.username || 'A')[0].toUpperCase();
    // 从 hash 恢复页面状态，支持刷新
    initFromHash();
    setInterval(() => { document.getElementById('live-time').textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false}); }, 1000);
    // Auto-refresh dashboard
    setInterval(() => { if (currentPage === 'dashboard') loadDashboard(); }, 15000);
}

// ═══════════════════ NAVIGATION ═══════════════════
let currentPage = '';
const pageTitles = {
    dashboard:'实时看板', drones:'无人机管理', tasks:'巡检任务', records:'巡检记录', inbound:'入库管理',
    shelves:'货架管理', skus:'SKU管理', images:'图像管理', videos:'视频管理',
    gateway:'数据网关', system:'系统状态', rfid_settings:'RFID设置', drone_integration:'无人机整合',
    rfid_dashboard:'RFID看板'
};

function navigate(name) {
    // 切换页面时清理无人机轮询 timer (避免离开后仍发请求)
    if (window._dronePollTimer && name !== 'drones') {
        clearInterval(window._dronePollTimer);
        window._dronePollTimer = null;
    }
    // 切换页面时清理 RFID 看板轮询 timer
    if (window._rfidDashTimer && name !== 'rfid_dashboard') {
        clearInterval(window._rfidDashTimer);
        window._rfidDashTimer = null;
    }
    currentPage = name;
    // 更新 URL hash 以支持刷新恢复
    window.location.hash = name;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const nav = document.querySelector(`.nav-item[data-page="${name}"]`);
    if (nav) nav.classList.add('active');
    document.getElementById('page-title').textContent = pageTitles[name] || name;
    const content = document.getElementById('content-area');
    if (window[`render_${name}`]) { window[`render_${name}`](content); }
    else { content.innerHTML = `<div class="panel"><div class="empty-row"><td>页面开发中...</td></div></div>`; }
}

// 从 hash 恢复页面状态
function initFromHash() {
    const hash = window.location.hash.slice(1) || 'dashboard';
    if (pageTitles[hash]) {
        navigate(hash);
    } else {
        navigate('dashboard');
    }
}

// 监听 hash 变化
window.addEventListener('hashchange', () => {
    const hash = window.location.hash.slice(1);
    if (hash && pageTitles[hash]) navigate(hash);
});

document.getElementById('sidebar-nav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item) navigate(item.dataset.page);
});

// ═══════════════════ PAGE: DASHBOARD ═══════════════════
async function render_dashboard(el) {
    el.innerHTML = `
        <div class="stat-row" id="dash-stats"><div class="stat-item"><div class="stat-label">加载中...</div></div></div>
        <div class="col2">
            <div class="panel"><div class="panel-header"><span>任务进度</span></div><div id="dash-tasks" style="padding:12px;font-size:13px;color:var(--muted);">加载中...</div></div>
            <div class="panel"><div class="panel-header"><span>实时数据流</span></div><div class="live-feed" id="dash-live" style="font-size:13px;color:var(--muted);">加载中...</div></div>
        </div>`;
    await loadDashboard();
}

async function loadDashboard() {
    try {
        const [ov, tasks, live] = await Promise.allSettled([
            api(`${API}/dashboard/overview`).catch(()=>null),
            api(`${API}/dashboard/tasks`).catch(()=>null),
            api(`${API}/dashboard/live`).catch(()=>null)
        ]);
        const o = ov.value?.data || {};
        const td = o.drones||{}, tk = o.tasks||{}, today = o.today||{}, inv = o.inventory||{};
        document.getElementById('dash-stats').innerHTML = `
            <div class="stat-item"><div class="stat-label">无人机</div><div class="stat-value c-blue">${td.total||0}</div><div class="stat-sub">在线 ${td.online||0}</div></div>
            <div class="stat-item"><div class="stat-label">活跃任务</div><div class="stat-value c-green">${tk.active||0}</div><div class="stat-sub">总计 ${tk.total||0}</div></div>
            <div class="stat-item"><div class="stat-label">今日图像</div><div class="stat-value c-yellow">${today.images||0}</div><div class="stat-sub">识别率 ${today.recognition_rate||0}%</div></div>
            <div class="stat-item"><div class="stat-label">库存异常</div><div class="stat-value c-red">${inv.abnormal_items||0}</div><div class="stat-sub">需关注</div></div>
            <div class="stat-item"><div class="stat-label">今日识别</div><div class="stat-value c-blue">${today.recognized||0}</div><div class="stat-sub">库存条目 ${today.items||0}</div></div>`;

        const tItems = tasks.value?.data?.items || [];
        document.getElementById('dash-tasks').innerHTML = tItems.length ? tItems.map(t => `
            <div style="padding:8px 0;border-bottom:1px solid var(--border2);">
                <div style="display:flex;justify-content:space-between;">
                    <span style="font-weight:500;">${t.task_name}</span>
                    <span class="mono" style="font-size:10px;">${t.drone_name||'未分配'}</span>
                </div>
                <div class="progress-bar"><div class="fill" style="width:${t.progress_percent||0}%"></div></div>
                <div style="font-size:10px;color:var(--muted);margin-top:2px;">${badge(t.status)} 航点 ${t.waypoints?.scanned||0}/${t.waypoints?.total||0}</div>
            </div>`).join('') : '<div style="padding:12px;text-align:center;color:var(--muted);">暂无运行中的任务</div>';

        const liveItems = live.value?.data?.recent_recognitions || [];
        document.getElementById('dash-live').innerHTML = liveItems.length ? liveItems.map(r => `
            <div class="item"><span class="time">${fmtShort(r.created_at)}</span><span>${r.qr_data||'识别中...'}</span>${badge(r.inventory_status||r.status)}</div>`).join('') : '<div style="padding:12px;text-align:center;color:var(--muted);">暂无实时数据</div>';
    } catch(e) { /* silent */ }
}

// ═══════════════════ PAGE: DRONES ═══════════════════
async function render_drones(el) {
    el.innerHTML = `
        <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--text2);">
            此页面功能已整合至 <a href="javascript:void(0)" onclick="goToDroneDB()" style="color:var(--blue);font-weight:600;">基站数据库 → 无人机管理</a>，本页面仅作备用
        </div>
        <div class="panel">
            <div class="panel-header">
                <span>无人机列表</span>
                <span class="count" id="drone-count"></span>
                <span style="font-size:11px;color:var(--muted);margin-left:8px;">实时状态</span>
                <span style="margin-left:auto;display:flex;gap:6px;align-items:center;">
                    <label style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer;">
                        <input type="checkbox" id="drone-auto-refresh" checked style="margin:0;"> 自动刷新(10s)
                    </label>
                    <button class="btn btn-primary btn-sm" onclick="loadDrones()">刷新</button>
                    <button class="btn btn-primary btn-sm" onclick="openDroneModal()">+ 注册</button>
                </span>
            </div>
            <div class="stat-row" id="drone-stat-row" style="padding:8px 16px;">
                <div class="stat-item"><div class="stat-label">总数</div><div class="stat-value" id="drone-stat-total">-</div></div>
                <div class="stat-item"><div class="stat-label">在线</div><div class="stat-value c-green" id="drone-stat-online">-</div></div>
                <div class="stat-item"><div class="stat-label">离线</div><div class="stat-value c-red" id="drone-stat-offline">-</div></div>
                <div class="stat-item"><div class="stat-label">飞行/维护</div><div class="stat-value c-blue" id="drone-stat-busy">-</div></div>
            </div>
            <div style="overflow-x:auto"><table><thead><tr><th>编号</th><th>名称</th><th>型号</th><th>实时状态</th><th>电量</th><th>最后位置</th><th>最后心跳</th><th>操作</th></tr></thead><tbody id="drone-tbody"></tbody></table></div>
        </div>`;
    await loadDrones();
    // 启动 10s 轮询
    if (window._dronePollTimer) clearInterval(window._dronePollTimer);
    window._dronePollTimer = setInterval(() => {
        const cb = document.getElementById('drone-auto-refresh');
        if (cb && cb.checked) loadDrones();
    }, 10000);
}

// 计算实时在线状态 (基于 last_seen)
function computeDroneOnlineStatus(d) {
    if (!d.last_seen) return { online: false, label: '离线', color: 'var(--muted)', relTime: '-' };
    const now = Date.now();
    const seen = new Date(d.last_seen + 'Z').getTime(); // 后端 UTC -> 本地
    const diff = (now - seen) / 1000;
    if (diff < 30) return { online: true, label: '在线', color: 'var(--success)', relTime: `${Math.floor(diff)}秒前` };
    if (diff < 60) return { online: false, label: '离线', color: 'var(--danger)', relTime: `${Math.floor(diff)}秒前` };
    if (diff < 3600) return { online: false, label: '离线', color: 'var(--danger)', relTime: `${Math.floor(diff/60)}分钟前` };
    return { online: false, label: '离线', color: 'var(--muted)', relTime: `${Math.floor(diff/3600)}小时前` };
}

async function loadDrones() {
    try {
        const data = await api(`${API}/drones/`);
        const drones = Array.isArray(data) ? data : (data.data||data.items||[]);
        // 统计
        let online=0, offline=0, busy=0;
        drones.forEach(d => {
            const st = (d.status||'').toLowerCase();
            const o = computeDroneOnlineStatus(d);
            if (o.online) online++;
            else if (st==='flying' || st==='maintenance') busy++;
            else offline++;
        });
        const setStat = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        setStat('drone-count', `${drones.length} 台`);
        setStat('drone-stat-total', drones.length);
        setStat('drone-stat-online', online);
        setStat('drone-stat-offline', offline);
        setStat('drone-stat-busy', busy);
        document.getElementById('drone-tbody').innerHTML = drones.length ? drones.map(d => {
            const o = computeDroneOnlineStatus(d);
            const st = (d.status||'').toLowerCase();
            // 实时状态点: 在线绿/离线灰/飞行蓝/维护黄
            let dotColor = o.color, dotLabel = o.label;
            if (st==='flying') { dotColor = 'var(--blue)'; dotLabel = '飞行中'; }
            else if (st==='maintenance') { dotColor = '#f59e0b'; dotLabel = '维护中'; }
            else if (st==='retired') { dotColor = 'var(--muted)'; dotLabel = '已退役'; }
            return `
            <tr>
                <td class="mono">${d.drone_code}</td>
                <td>${d.drone_name||'-'}</td>
                <td>${d.model||'-'}</td>
                <td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;${o.online?'animation:pulse 2s infinite;':''}"></span>${dotLabel}</span></td>
                <td>${d.battery_level!=null?d.battery_level+'%':'-'}</td>
                <td class="mono" style="font-size:11px;">${d.last_position_x!=null?`(${d.last_position_x?.toFixed(1)},${d.last_position_y?.toFixed(1)},${d.last_position_z?.toFixed(1)})`:'-'}</td>
                <td class="mono" style="font-size:11px;color:var(--muted);">${o.relTime}</td>
                <td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="editDrone(${d.id})">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteDrone(${d.id})">删除</button></div></td>
            </tr>`;
        }).join('') : '<tr class="empty-row"><td colspan="8">暂无无人机，请点击"注册"</td></tr>';
    } catch(e) { document.getElementById('drone-tbody').innerHTML = `<tr class="empty-row"><td colspan="8">加载失败: ${e.message}</td></tr>`; }
}

function openDroneModal(d) {
    document.getElementById('modal-drone-title').textContent = d ? '编辑无人机' : '注册无人机';
    document.getElementById('fd-id').value = d?.id || '';
    document.getElementById('fd-code').value = d?.drone_code || '';
    document.getElementById('fd-name').value = d?.drone_name || '';
    document.getElementById('fd-model').value = d?.model || 'DJI-M300';
    document.getElementById('fd-status').value = d?.status || 'offline';
    document.getElementById('fd-battery').value = d?.battery_level ?? 100;
    openModal('modal-drone');
}

async function saveDrone(e) {
    e.preventDefault();
    const id = document.getElementById('fd-id').value;
    const body = {
        drone_code: document.getElementById('fd-code').value,
        drone_name: document.getElementById('fd-name').value,
        model: document.getElementById('fd-model').value,
        status: document.getElementById('fd-status').value,
        battery_level: parseFloat(document.getElementById('fd-battery').value)||100,
    };
    try {
        await api(id ? `${API}/drones/${id}` : `${API}/drones/`, { method: id?'PATCH':'POST', body:JSON.stringify(body) });
        closeModal('modal-drone'); toast(id?'更新成功':'注册成功'); loadDrones();
    } catch(ex) { toast(ex.message,'error'); }
}

async function editDrone(id) { try { const d = await api(`${API}/drones/${id}`); openDroneModal(d); } catch(ex) { toast(ex.message,'error'); } }
async function deleteDrone(id) { if (!confirm('确认删除该无人机？')) return; try { await api(`${API}/drones/${id}`,{method:'DELETE'}); toast('删除成功'); loadDrones(); } catch(ex) { toast(ex.message,'error'); } }

// ═══════════════════ PAGE: TASKS ═══════════════════
async function render_tasks(el) {
    el.innerHTML = `
        <div class="panel"><div class="panel-header"><span>巡检任务列表</span> <span class="count" id="task-count"></span><button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ 创建</button></div>
        <div style="overflow-x:auto"><table><thead><tr><th>任务编号</th><th>名称</th><th>类型</th><th>无人机</th><th>状态</th><th>航点</th><th>图像</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="task-tbody"></tbody></table></div></div>`;
    await loadTasks();
}

async function loadTasks() {
    const tbody = document.getElementById('task-tbody');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="9">加载中...</td></tr>';
    try {
        const data = await api(`${API}/inspection/tasks`);
        const tasks = data?.data?.items || data?.items || [];
        document.getElementById('task-count').textContent = `${data?.data?.total||tasks.length} 个`;
        tbody.innerHTML = tasks.length ? tasks.map(t => `
            <tr>
                <td class="mono">${t.task_code}</td><td>${t.task_name}</td><td>${t.task_type||'-'}</td>
                <td>${t.drone_code||'未分配'}</td><td>${badge(t.status)}</td>
                <td>${t.scanned_waypoints||0}/${t.total_waypoints||0}</td>
                <td>${t.total_images||0}</td>
                <td>${fmtTime(t.created_at)}</td>
                <td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="viewTaskDetail('${t.task_code}')">详情</button></div></td>
            </tr>`).join('') : '<tr class="empty-row"><td colspan="9">暂无任务</td></tr>';
    } catch(e) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="9" style="color:var(--danger)">加载失败: ${e.message} <button class="btn btn-outline btn-sm" onclick="loadTasks()" style="margin-left:8px">重试</button></td></tr>`;
        console.error('加载巡检任务列表失败:', e);
    }
}

async function openTaskModal() {
    document.getElementById('form-task').reset();
    try {
        const drones = await api(`${API}/drones/`);
        const list = Array.isArray(drones) ? drones : (drones.data||[]);
        document.getElementById('ft-drone').innerHTML = '<option value="">不分配</option>' + list.map(d => `<option value="${d.id}">${d.drone_code} - ${d.drone_name}</option>`).join('');
    } catch(e) {}
    openModal('modal-task');
}

async function saveTask(e) {
    e.preventDefault();
    const body = {
        task_code: document.getElementById('ft-code').value,
        task_name: document.getElementById('ft-name').value,
        task_type: document.getElementById('ft-type').value,
        drone_id: parseInt(document.getElementById('ft-drone').value) || null,
        altitude: parseFloat(document.getElementById('ft-altitude').value)||5.0,
        speed: parseFloat(document.getElementById('ft-speed').value)||2.0,
    };
    try {
        await api(`${API}/inspection/tasks`, { method:'POST', body:JSON.stringify(body) });
        closeModal('modal-task'); toast('任务创建成功'); loadTasks();

}

// RFID 绑定相关
function openRFIDBind(skuId, skuName) {
    document.getElementById('bind-sku-id').value = skuId;
    document.getElementById('bind-sku-name').value = skuName;
    document.getElementById('bind-result').innerHTML = '';
    document.getElementById('rfid-bind-modal').style.display = 'flex';
}

function closeBindModal() {
    document.getElementById('rfid-bind-modal').style.display = 'none';
}

async function doRFIDBind() {
    const skuId = parseInt(document.getElementById('bind-sku-id').value);
    const shelfId = parseInt(document.getElementById('bind-shelf-id').value) || 1;
    const quantity = parseInt(document.getElementById('bind-quantity').value) || 1;
    const resultDiv = document.getElementById('bind-result');

    resultDiv.innerHTML = '<span style="color:var(--accent)">正在扫描RFID标签，请将标签靠近读卡器...</span>';
    try {
        const data = await api(`${API}/rfid/bind`, {
            method: 'POST',
            body: JSON.stringify({ sku_id: skuId, shelf_id: shelfId, quantity: quantity })
        });
        if (data.success) {
            resultDiv.innerHTML = `<span style="color:var(--green)">绑定成功! EPC=${data.data.epc} - ${data.data.goods_name}</span>`;
            toast('RFID绑定成功');
            setTimeout(closeBindModal, 2000);
        } else {
            resultDiv.innerHTML = `<span style="color:var(--red)">${data.message}</span>`;
        }
    } catch(e) {
        resultDiv.innerHTML = `<span style="color:var(--red)">绑定失败: ${e.message}</span>`;
    }
}

async function loadImages() {
    try {
        // Try to get images from latest task
        const tasks = await api(`${API}/inspection/tasks`).catch(()=>({data:{items:[]}}));
        const taskItems = tasks?.data?.items || [];
        let allImages = [];
        for (const t of taskItems.slice(0,3)) {
            try {
                const imgs = await api(`${API}/images/task/${t.task_code}`);
                if (imgs?.data?.items) allImages = allImages.concat(imgs.data.items.map(i=>({...i, task_code:t.task_code})));
            } catch(e) {}
        }
        document.getElementById('img-count').textContent = `${allImages.length} 张`;
        document.getElementById('img-grid').innerHTML = allImages.length ? allImages.map(img => `
            <div class="img-card" onclick="viewImageDetail('${img.image_id}')">
                <img class="thumb" src="${API}/images/${img.image_id}/file?token=${TOKEN}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22140%22><rect fill=%22%231a2332%22 width=%22200%22 height=%22140%22/><text fill=%22%235f7d94%22 x=%22100%22 y=%2275%22 text-anchor=%22middle%22 font-size=%2212%22>无预览</text></svg>'">
                <div class="meta"><div class="status-row">${badge(img.status)} ${badge(img.inventory_status||'normal')}</div><div class="sku">${img.qr_data||'未识别'}</div></div>
            </div>`).join('') : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:24px;">暂无图像（执行巡检任务后上传）</div>';
    } catch(e) { document.getElementById('img-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:24px;">加载失败: ${e.message}</div>`; }
}

    try {

        document.getElementById('image-detail-content').innerHTML = `

async function uploadImage() {
    const file = document.getElementById('img-upload-file').files[0];
    if (!file) { toast('请选择文件', 'error'); return; }
    const form = new FormData();
    form.append('image', file);
    form.append('drone_code', document.getElementById('img-upload-drone').value);
    form.append('task_code', document.getElementById('img-upload-task').value);
    try {
        const res = await fetch(`${API}/images/upload`, { method:'POST', headers:{}, body:form });
        if (!res.ok) { const e = await res.json().catch(()=>({message:res.statusText})); throw new Error(e.message||e.detail||'上传失败'); }
        toast('图像上传成功'); loadImages();
    } catch(ex) { toast(ex.message,'error'); }
}

async function loadVideos() {
    try {
        const tasks = await api(`${API}/inspection/tasks`).catch(()=>({data:{items:[]}}));
        const taskItems = tasks?.data?.items || [];
        let allVideos = [];
        for (const t of taskItems.slice(0,3)) {
            try {
                const vids = await api(`${API}/videos/task/${t.task_code}`);
                if (vids?.data?.items) allVideos = allVideos.concat(vids.data.items.map(i=>({...i, task_code:t.task_code})));
            } catch(e) {}
        }
        document.getElementById('vid-count').textContent = `${allVideos.length} 个`;
        document.getElementById('vid-grid').innerHTML = allVideos.length ? allVideos.map(v => `
            <div class="img-card" style="cursor:default;">
                <div style="height:140px;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:32px;">▶</div>
                <div class="meta"><div class="status-row"><span>${v.file_name}</span></div><div style="font-size:10px;color:var(--muted);">${(v.file_size/1024/1024).toFixed(1)}MB</div>
                <div style="display:flex;gap:4px;margin-top:4px;"><a href="${API}/videos/${v.video_id}/file?token=${TOKEN}" target="_blank" class="btn btn-outline btn-sm" style="flex:1;text-align:center;">下载</a><button class="btn btn-danger btn-sm" onclick="deleteVideo('${v.video_id}')">删除</button></div></div>
            </div>`).join('') : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:24px;">暂无视频（执行巡检任务后上传）</div>';
    } catch(e) { document.getElementById('vid-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:24px;">加载失败: ${e.message}</div>`; }
}

async function uploadVideo() {
    const file = document.getElementById('vid-upload-file').files[0];
    if (!file) { toast('请选择文件', 'error'); return; }
    const form = new FormData();
    form.append('video', file);
    form.append('drone_code', document.getElementById('vid-upload-drone').value);
    form.append('task_code', document.getElementById('vid-upload-task').value);
    try {
        const res = await fetch(`${API}/videos/upload`, { method:'POST', headers:{}, body:form });
        if (!res.ok) { const e = await res.json().catch(()=>({message:res.statusText})); throw new Error(e.message||e.detail||'上传失败'); }
        toast('视频上传成功'); loadVideos();
    } catch(ex) { toast(ex.message,'error'); }
}

async function deleteVideo(id) {
    if (!confirm('确认删除该视频？')) return;
    try { await api(`${API}/videos/${id}`,{method:'DELETE'}); toast('删除成功'); loadVideos(); } catch(ex) { toast(ex.message,'error'); }
}

async function render_system(el) {
    el.innerHTML = `
        <div class="stat-row" id="sys-stats"><div class="stat-item"><div class="stat-label">加载中...</div></div></div>
        <div class="panel"><div class="panel-header"><span>模块状态</span> <button class="btn btn-outline btn-sm" onclick="reconnectSystem()">重新检测</button></div>

    await loadSystem();

async function loadSystem() {
    try {
        const [status, health] = await Promise.allSettled([
            api(`${API}/system/status`).catch(()=>null),
            api(`${API}/health`).catch(()=>null)
        ]);
        const modules = status.value?.data?.modules || {};
        const h = health.value || {};
        document.getElementById('sys-stats').innerHTML = `
            <div class="stat-item"><div class="stat-label">系统就绪</div><div class="stat-value ${status.value?.data?.ready?'c-green':'c-red'}">${status.value?.data?.ready?'是':'否'}</div></div>
            <div class="stat-item"><div class="stat-label">数据库</div><div class="stat-value ${h.database==='connected'?'c-green':'c-red'}">${h.database||'-'}</div></div>
            <div class="stat-item"><div class="stat-label">Redis</div><div class="stat-value ${h.redis==='connected'?'c-green':'c-red'}">${h.redis||'-'}</div></div>
            <div class="stat-item"><div class="stat-label">整体状态</div><div class="stat-value c-green">${h.status||'-'}</div></div>`;

        const modEntries = Object.entries(modules);
        document.getElementById('sys-modules').innerHTML = modEntries.length ? modEntries.map(([k,v]) => `
            <tr><td>${k}</td><td>${badge(v.connected ? 'connected' : 'disconnected', {connected:'success',disconnected:'danger'})}</td>
            <td>${v.response_time_ms||'-'}ms</td><td>${fmtTime(v.last_check_time)}</td></tr>`).join('') : '<tr class="empty-row"><td colspan="4">暂无模块数据</td></tr>';
    } catch(e) { document.getElementById('sys-modules').innerHTML = `<tr class="empty-row"><td colspan="4">加载失败: ${e.message}</td></tr>`; }
}

async function reconnectSystem() {
    try { await api(`${API}/system/reconnect`,{method:'POST'}); toast('已重新检测'); loadSystem(); } catch(ex) { toast(ex.message,'error'); }
}

let _rfidDashTimer = null;
let _rfidDashLastTs = 0;        // 增量轮询游标（read_time Unix 秒）
let _rfidDashEvents = [];       // 本地缓存的事件列表（最新在顶）

            </label>
            <span style="font-size:12px;color:var(--muted);" id="rfd-time"></span>
        </div>

        <div class="panel">
            <div class="panel-header">

async function rfidDashRefresh() {
    await Promise.all([rfidDashLoadStats(), rfidDashLoadHistory(true)]);
}

async function rfidDashPoll() {
    // 增量轮询：仅拉取 since=_rfidDashLastTs 的新事件
    await rfidDashLoadStats();
    await rfidDashLoadHistory(false);
}

async function rfidDashLoadStats() {
    try {
        const r = await api(`${API}/rfid/scan/stats`);
        const d = r.data || {};
        const connected = d.connected;
        const scanning = d.scanning;
        document.getElementById('rfd-connected').textContent = connected ? '已连接' : '未连接';
        document.getElementById('rfd-connected').className = 'stat-value ' + (connected ? 'c-green' : 'c-red');
        document.getElementById('rfd-mode').textContent = scanning ? '自动扫描中' : (connected ? '已就绪' : '未连接');
        document.getElementById('rfd-mode').className = 'stat-value ' + (scanning ? 'c-green' : '');
        document.getElementById('rfd-total').textContent = d.total_events || 0;
        document.getElementById('rfd-unique').textContent = d.unique_tags || 0;
        document.getElementById('rfd-latest').textContent = d.latest_event_time
            ? new Date(d.latest_event_time * 1000).toLocaleTimeString('zh-CN', {hour12:false})
            : '-';
        // 控制按钮可见性
        document.getElementById('rfd-btn-start').style.display = scanning ? 'none' : '';
        document.getElementById('rfd-btn-stop').style.display = scanning ? '' : 'none';
        // 分类统计
        const bd = document.getElementById('rfd-breakdown');
        bd.innerHTML = `
            <div style="padding:10px;background:var(--bg);border-radius:6px;"><div style="font-size:11px;color:var(--muted);">自动扫描</div><div style="font-size:18px;color:var(--success);font-weight:600;">${d.auto_count||0}</div></div>
            <div style="padding:10px;background:var(--bg);border-radius:6px;"><div style="font-size:11px;color:var(--muted);">单次扫描</div><div style="font-size:18px;color:var(--primary);font-weight:600;">${d.single_count||0}</div></div>
            <div style="padding:10px;background:var(--bg);border-radius:6px;"><div style="font-size:11px;color:var(--muted);">手动触发</div><div style="font-size:18px;color:var(--warning);font-weight:600;">${d.manual_count||0}</div></div>
            <div style="padding:10px;background:var(--bg);border-radius:6px;"><div style="font-size:11px;color:var(--muted);">总事件数</div><div style="font-size:18px;font-weight:600;">${d.total_events||0}</div></div>
            <div style="padding:10px;background:var(--bg);border-radius:6px;"><div style="font-size:11px;color:var(--muted);">唯一标签</div><div style="font-size:18px;color:var(--success);font-weight:600;">${d.unique_tags||0}</div></div>`;
    } catch (e) { /* ignore */ }
}

async function rfidDashLoadHistory(full) {
    try {
        const url = `${API}/rfid/scan/history?limit=${full ? 200 : 100}&since=${full ? 0 : _rfidDashLastTs}`;
        const r = await api(url);
        const events = r.data?.events || [];
        if (events.length === 0 && !full) return;
        if (full) {
            _rfidDashEvents = events;
        } else {
            // 增量合并：events 已是最新在顶，倒序追加到本地缓存顶部
            for (const e of events) {
                _rfidDashEvents.unshift(e);
            }
            // 限制本地缓存上限
            if (_rfidDashEvents.length > 500) _rfidDashEvents.length = 500;
        }
        // 更新增量游标（取本地最新事件的 read_time）
        if (_rfidDashEvents.length > 0) {
            _rfidDashLastTs = _rfidDashEvents[0].read_time || 0;
        }
        rfidDashRenderTable();
    } catch (e) { /* ignore */ }
}

function rfidDashRenderTable() {
    const tbody = document.getElementById('rfd-tbody');
    const countEl = document.getElementById('rfd-count');
    if (!tbody) return;
    countEl.textContent = `${_rfidDashEvents.length} 条`;
    if (_rfidDashEvents.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无扫描事件</td></tr>';
        return;
    }
    const modeMap = { auto: '<span class="badge badge-success">自动</span>', single: '<span class="badge badge-info">单次</span>', manual: '<span class="badge badge-warning">手动</span>' };
    tbody.innerHTML = _rfidDashEvents.map(e => `
        <tr>
            <td style="font-size:12px;">${e.read_time_iso ? new Date(e.read_time_iso).toLocaleString('zh-CN', {hour12:false}) : '-'}</td>
            <td class="mono" style="font-size:12px;">${e.tag_id || '-'}</td>
            <td style="font-size:12px;color:${e.rssi != null && e.rssi > -60 ? 'var(--success)' : (e.rssi != null && e.rssi > -75 ? 'var(--warning)' : 'var(--danger)')};">${e.rssi != null ? e.rssi + ' dBm' : '-'}</td>
            <td class="mono" style="font-size:11px;">${e.pc != null ? '0x' + e.pc.toString(16).toUpperCase().padStart(4,'0') : '-'}</td>
            <td class="mono" style="font-size:11px;">${e.crc != null ? '0x' + e.crc.toString(16).toUpperCase().padStart(4,'0') : '-'}</td>
            <td>${modeMap[e.mode] || e.mode || '-'}</td>
        </tr>`).join('');
    // 自动滚动到顶部（最新事件在顶）
    const autoScroll = document.getElementById('rfd-autoscroll');
    if (autoScroll && autoScroll.checked) {
        document.getElementById('rfd-table-wrap').scrollTop = 0;
    }
}

async function rfidDashSingle() {
    const btn = document.getElementById('rfd-btn-single');
    btn.disabled = true; btn.textContent = '扫描中...';
    try {
        const r = await api(`${API}/rfid/read`, { method: 'POST' });
        if (r.success && r.data) {
            toast(`读取成功: EPC=${r.data.tag_id}, RSSI=${r.data.rssi} dBm`);
        } else {
            toast(r.message || '未扫描到标签', 'warn');
        }
        await rfidDashRefresh();
    } catch (ex) {
        toast(ex.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = '单次扫描';
    }
}

async function rfidDashAuto(enable) {
    try {
        const r = await api(`${API}/rfid/scan/auto`, { method: 'POST', body: JSON.stringify({ enable }) });
        toast(r.message);
        await rfidDashLoadStats();
    } catch (ex) {
        toast(ex.message, 'error');
    }
}

async function rfidDashClearHistory() {
    if (!confirm('确认清空扫描历史？此操作不影响已扫描标签缓存。')) return;
    try {
        const r = await api(`${API}/rfid/scan/clear-history`, { method: 'POST' });
        toast(r.message);
        _rfidDashEvents = [];
        _rfidDashLastTs = 0;
        rfidDashRenderTable();
        await rfidDashLoadStats();
    } catch (ex) {
        toast(ex.message, 'error');
    }
}

async function rfidRefreshStatus() {
    try {
        const res = await api(`${API}/rfid/status`);
        const d = res.data;
        const connected = d.connected;
        document.getElementById('rfs-connected').textContent = connected ? '已连接' : '未连接';
        document.getElementById('rfs-connected').className = 'stat-value ' + (connected ? 'c-green' : 'c-red');
        document.getElementById('rfs-port').textContent = d.port || '-';
        document.getElementById('rfs-power').textContent = (d.power_dbm ? d.power_dbm + ' dBm' : '-');
        document.getElementById('rfs-scanning').textContent = d.scanning ? '运行中' : '已停止';
        document.getElementById('rfs-scanning').className = 'stat-value ' + (d.scanning ? 'c-green' : '');
        // 更新连接/断开按钮状态
        document.getElementById('rfs-btn-connect').style.display = connected ? 'none' : '';
        document.getElementById('rfs-btn-disconnect').style.display = connected ? '' : 'none';
        if (connected && d.port) {
            const sel = document.getElementById('rfs-port-select');
            // 如果当前端口不在列表中，添加进去
            if (![...sel.options].some(o => o.value === d.port)) {
                const opt = document.createElement('option');
                opt.value = d.port; opt.textContent = d.port; opt.selected = true;
                sel.appendChild(opt);
            } else {
                sel.value = d.port;
            }
        }
    } catch(e) { /* ignore */ }
}

async function rfidScanPorts() {
    try {
        const res = await api(`${API}/rfid/ports`);
        const ports = res.data?.ports || [];
        const sel = document.getElementById('rfs-port-select');
        const current = sel.value;
        sel.innerHTML = '';
        if (ports.length === 0) {
            sel.innerHTML = '<option value="">未检测到串口</option>';
            toast('未检测到可用串口，请检查硬件连接', 'warn');
        } else {
            ports.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.textContent = p;
                sel.appendChild(opt);
            });
            // 恢复之前选中的端口
            if (ports.includes(current)) sel.value = current;
            else sel.value = ports[0];
            toast(`发现 ${ports.length} 个串口: ${ports.join(', ')}`);
        }
    } catch(ex) { toast(ex.message, 'error'); }
}

async function rfidConnect() {
    const port = document.getElementById('rfs-port-select').value;
    if (!port) { toast('请先扫描并选择串口', 'warn'); return; }
    const baudrate = parseInt(document.getElementById('rfs-baudrate').value);
    try {
        const r = await api(`${API}/rfid/connect`, {method:'POST', body:JSON.stringify({port, baudrate})});
        toast(r.success ? 'RFID 已连接' : (r.message || '连接失败'));
        setTimeout(rfidRefreshStatus, 500);
    } catch(ex) { toast(ex.message, 'error'); }
}

async function rfidDisconnect() {
    try {
        const r = await api(`${API}/rfid/disconnect`, {method:'POST'});
        toast(r.message);
        rfidRefreshStatus();
    } catch(ex) { toast(ex.message, 'error'); }
}

                <div class="panel-header"><span>当前库存</span> <button class="btn btn-ghost btn-sm" onclick="inboundLoadInventory()">刷新</button></div>
                <div style="overflow-x:auto"><table><thead><tr><th>EPC</th><th>货物</th><th>数量</th><th>最近读取</th></tr></thead><tbody id="ib-inventory"></tbody></table></div>
            </div>
        </div>`;
    inboundLoadStatus();
    inboundLoadRecords();
    inboundLoadInventory();
}

async function inboundLoadStatus() {
    try {
        const r = await api(`${API}/inbound/status`);
        const d = r.data;
        const running = d.running;
        document.getElementById('ib-running').textContent = running ? '扫描中...' : '已停止';
        document.getElementById('ib-running').className = 'stat-value ' + (running ? 'c-green' : 'c-red');
        document.getElementById('ib-scanned').textContent = d.tags_scanned || 0;
        document.getElementById('ib-created').textContent = d.records_created || 0;
        document.getElementById('ib-errors').textContent = d.errors || 0;
        document.getElementById('ib-btn-start').style.display = running ? 'none' : '';
        document.getElementById('ib-btn-stop').style.display = running ? '' : 'none';
        if (running) {
            document.getElementById('ib-time').textContent = '开始于: ' + (d.started_at ? new Date(d.started_at).toLocaleTimeString() : '-');
            if (!inboundAutoRefresh) inboundAutoRefresh = setInterval(inboundAutoRefreshAll, 2000);
        } else {
            document.getElementById('ib-time').textContent = '';
            if (inboundAutoRefresh) { clearInterval(inboundAutoRefresh); inboundAutoRefresh = null; }
        }
    } catch(e) { /* ignore */ }
}

async function inboundAutoRefreshAll() {
    await inboundLoadStatus();
    inboundLoadRecords();
    inboundLoadInventory();
}

async function inboundStart() {
    try { const r = await api(`${API}/inbound/start`, {method:'POST'}); toast(r.message); inboundLoadStatus(); } catch(ex) { toast(ex.message,'error'); }
}

async function inboundStop() {
    try { const r = await api(`${API}/inbound/stop`, {method:'POST'}); toast(r.message); inboundLoadStatus(); } catch(ex) { toast(ex.message,'error'); }
}

async function inboundLoadRecords() {
    try {
        const r = await api(`${API}/inbound/records`);
        const records = r.data?.records || [];
        document.getElementById('ib-records').innerHTML = records.length === 0
            ? '<tr class="empty-row"><td colspan="5">暂无入库记录</td></tr>'
            : records.map(rr => `
                <tr>
                    <td style="font-size:12px;">${rr.created_at ? new Date(rr.created_at).toLocaleTimeString() : '-'}</td>
                    <td style="font-family:monospace;font-size:12px;">${rr.epc}</td>
                    <td>${rr.goods_name || '未注册'}</td>
                    <td>${rr.rssi != null ? rr.rssi + ' dBm' : '-'}</td>
                    <td>${badge(rr.status === 'success' ? '成功' : '失败', {success:'success', failed:'danger'})}</td>
                </tr>`).join('');
    } catch(e) { /* ignore */ }
}

async function inboundLoadInventory() {
    try {
        const r = await api(`${API}/inbound/inventory`);
        const items = r.data?.items || [];
        document.getElementById('ib-inventory').innerHTML = items.length === 0
            ? '<tr class="empty-row"><td colspan="4">暂无库存数据</td></tr>'
            : items.map(inv => `
                <tr>
                    <td style="font-family:monospace;font-size:12px;">${inv.epc || '-'}</td>
                    <td>${inv.goods_name || '未知'}</td>
                    <td>${inv.quantity}</td>
                    <td style="font-size:12px;">${inv.last_read_at ? new Date(inv.last_read_at).toLocaleTimeString() : '-'}</td>
                </tr>`).join('');
    } catch(e) { /* ignore */ }
}

const DI = {}; // drone integration state
let diStep = 1;

function diSetStep(n) {
    diStep = n;
    document.querySelectorAll('.di-step').forEach(el => el.classList.toggle('active', el.dataset.step == n));
    document.querySelectorAll('.di-panel').forEach(el => el.style.display = el.dataset.step == n ? 'block' : 'none');
    if (n === 6) { diLoadTasks(); diRefreshTaskList(); diLoadShelves(); }
    if (n === 7) { diLoadMonitor(); diLoadLogs(); }
}

// 加载货架列表渲染到任务配置多选框
async function diLoadShelves() {
    const box = document.getElementById('di-task-shelves-box');
    if (!box) return;
    try {
        const data = await api(`${API}/shelves/`);
        const shelves = Array.isArray(data) ? data : (data.data || []);
        if (!shelves.length) {
            box.innerHTML = '<span style="color:var(--muted);font-size:11px;">暂无货架, 请先在"货架管理"中添加</span>';
            return;
        }
        box.innerHTML = shelves.map(s => `
            <label style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">
                <input type="checkbox" class="di-task-shelf-cb" value="${s.shelf_code}" onchange="diUpdateShelvesCount()" style="margin:0;">
                <span class="mono">${s.shelf_code}</span>
                <span style="color:var(--muted);">${s.shelf_name||''}</span>
            </label>
        `).join('');
        diUpdateShelvesCount();
    } catch (e) {
        box.innerHTML = `<span style="color:var(--danger);font-size:11px;">加载失败: ${e.message}</span>`;
    }
}

function diToggleAllShelves(all) {
    document.querySelectorAll('.di-task-shelf-cb').forEach(cb => cb.checked = all);
    diUpdateShelvesCount();
}

function diUpdateShelvesCount() {
    const n = document.querySelectorAll('.di-task-shelf-cb:checked').length;
    const el = document.getElementById('di-task-shelves-count');
    if (el) el.textContent = `已选 ${n} 个`;
}

function diGetSelectedShelves() {
    return Array.from(document.querySelectorAll('.di-task-shelf-cb:checked')).map(cb => cb.value);
}

function diNext() { if (diStep < 7) diSetStep(diStep + 1); }
function diPrev() { if (diStep > 1) diSetStep(diStep - 1); }

// ── Step 1: 网络连接验证 ──
async function diVerifyNetwork() {
    const btn = document.getElementById('di-btn-net');
    btn.disabled = true; btn.textContent = '验证中...';
    const result = document.getElementById('di-net-result');
    result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">正在检测网络连通性...</div>';
    try {
        const src = document.getElementById('di-src-ip').value;
        const dst = document.getElementById('di-dst-ip').value;
        const ports = document.getElementById('di-ports').value;
        const r = await api(`${API}/drone-integration/network/verify?drone_ip=${dst}&base_station_ip=${src}${ports?'&ports='+ports:''}`, {method:'POST'});
        const d = r.data;
        const portRows = (d.open_ports||[]).map(p => `<tr><td>${p.port}</td><td>${p.service||'-'}</td><td>${badge(p.is_open?'开放':'关闭',{open:'success',closed:'danger'})}</td><td>${p.response_ms!=null?p.response_ms.toFixed(1)+'ms':'-'}</td></tr>`).join('');
        result.innerHTML = `
            <div class="stat-row">
                <div class="stat-item"><div class="stat-label">Ping</div><div class="stat-value ${d.ping?.success?'c-green':'c-red'}">${d.ping?.success?'可达':'不可达'}</div></div>
                <div class="stat-item"><div class="stat-label">响应时间</div><div class="stat-value">${d.ping?.response_time_ms!=null?d.ping.response_time_ms.toFixed(1)+'ms':'-'}</div></div>
                <div class="stat-item"><div class="stat-label">丢包率</div><div class="stat-value ${d.packet_loss_percent===0?'c-green':d.packet_loss_percent<50?'c-yellow':'c-red'}">${d.packet_loss_percent}%</div></div>
                <div class="stat-item"><div class="stat-label">稳定性</div><div class="stat-value c-${d.stability==='stable'?'green':d.stability==='unstable'?'yellow':'red'}">${d.stability==='stable'?'稳定':d.stability==='unstable'?'不稳定':'差'}</div></div>
            </div>

        }

async function diRefreshTaskList() {
    try {
        const r = await api(`${API}/drone-integration/tasks`);
        const tasks = r.data?.tasks||[];
        document.getElementById('di-task-list').innerHTML = tasks.length ? tasks.map(t => {
            const shelves = Array.isArray(t.target_shelves) ? t.target_shelves : [];
            const shelvesView = shelves.length
                ? `<span class="mono" style="font-size:11px;">${shelves.length}个: ${shelves.slice(0,2).join(', ')}${shelves.length>2?'...':''}</span>`
                : '<span style="color:var(--muted);font-size:11px;">全部</span>';
            return `
            <tr>
                <td>${t.task_name}</td><td>${t.task_type==='both'?'视频+RFID':t.task_type==='video_capture'?'视频采集':'RFID读取'}</td>
                <td>${shelvesView}</td>
                <td><span class="badge badge-info">${t.schedule_type}</span> ${t.schedule_value}</td>
                <td>${badge(t.enabled?'启用':'禁用',{enabled:'success',disabled:'muted'})}</td>
                <td>${t.last_run_at?fmtTime(t.last_run_at):'-'}</td>
                <td>${t.run_count||0}</td>
                <td><div class="row-actions">
                    <button class="btn btn-outline btn-sm" onclick="diRunTask(${t.id})">执行</button>
                    <button class="btn btn-outline btn-sm" onclick="diToggleTask(${t.id},${!t.enabled})">${t.enabled?'禁用':'启用'}</button>
                    <button class="btn btn-danger btn-sm" onclick="diDeleteTask(${t.id})">删除</button>
                </div></td>
            </tr>`;
        }).join('') : '<tr class="empty-row"><td colspan="8">暂无自动化任务</td></tr>';
    } catch(e) { document.getElementById('di-task-list').innerHTML = `<tr class="empty-row"><td colspan="8">加载失败: ${e.message}</td></tr>`; }
}

async function diRunTask(id) {
    try { const r = await api(`${API}/drone-integration/tasks/${id}/run`, {method:'POST'}); toast(r.message); diRefreshTaskList(); } catch(ex) { toast(ex.message,'error'); }
}
async function diToggleTask(id, enable) {
    try { const r = await api(`${API}/drone-integration/tasks/${id}?enabled=${enable}`, {method:'PUT'}); toast(r.message); diRefreshTaskList(); } catch(ex) { toast(ex.message,'error'); }
}
async function diDeleteTask(id) {
    if (!confirm('确认删除该任务？')) return;
    try { await api(`${API}/drone-integration/tasks/${id}`, {method:'DELETE'}); toast('任务已删除'); diRefreshTaskList(); } catch(ex) { toast(ex.message,'error'); }
}

                <td class="truncate" style="max-width:200px;" title="${l.payload_summary||''}">${l.payload_summary||'-'}</td>
                <td>${badge(l.status)}</td>
            </tr>`).join('') : '<tr class="empty-row"><td colspan="5">暂无通信日志</td></tr>';
    } catch(e) { /* ignore */ }
}

// ═══════════════════ INIT ═══════════════════
// 认证检查：无 token 时跳转登录页
if (!TOKEN) {
    redirectToLogin();
} else {
    showApp();
}
</script>
</body>
</html>
