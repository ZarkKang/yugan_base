<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域感智能 — 无人机数据管理系统</title>
    <style>
        :root {
            --bg: #0a0f18; --surface: #111827; --surface2: #1a2332;
            --border: #1e2d3d; --border2: #243447;
            --text: #e2e8f0; --text2: #b0bec5; --muted: #5f7d94;
            --primary: #8b5cf6; --primary2: #7c3aed;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --radius: 6px; --radius-lg: 10px;
            --sidebar-w: 220px;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 14px; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
        }
        a { color: var(--primary); text-decoration: none; }

        /* ── Login Screen ── */
        #login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
            background: radial-gradient(ellipse at 30% 20%, rgba(139,92,246,.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(16,185,129,.06) 0%, transparent 60%),
                        var(--bg);
        }
        .login-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 44px 40px; width: 100%;
            max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,.4);
        }
        .login-panel .brand { text-align: center; margin-bottom: 32px; }
        .login-panel .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
        .login-panel .brand span { display: block; color: var(--primary); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
        .field input, .field select {
            width: 100%; padding: 10px 12px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-size: 14px; font-family: var(--font); outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 9px 16px; border: none; border-radius: var(--radius);
            font-size: 13px; font-family: var(--font); font-weight: 500;
            cursor: pointer; transition: all .15s; white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary2); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: .85; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-outline:hover { border-color: var(--primary); color: var(--text); }
        .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
        .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.04); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-block { width: 100%; }
        .login-err { background: rgba(239,68,68,.12); color: var(--danger); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; display: none; }

        /* ── App Layout ── */
        #app-screen { display: none; height: 100vh; }
        .app-shell { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w); min-width: var(--sidebar-w);
            background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow-y: auto;
            position: relative; z-index: 10;
        }
        .sidebar-brand {
            padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-brand .logo {
            width: 32px; height: 32px; background: var(--primary);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff; font-weight: 700; flex-shrink: 0;
        }
        .sidebar-brand .name { font-size: 14px; font-weight: 600; }
        .sidebar-brand .ver { font-size: 10px; color: var(--muted); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav .nav-section {
            font-size: 10px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 1.5px; padding: 12px 12px 8px; font-weight: 600;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: var(--radius);
            font-size: 13px; color: var(--text2); cursor: pointer;
            transition: all .12s; margin-bottom: 2px; position: relative;
        }
        .nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
        .nav-item.active { background: rgba(139,92,246,.12); color: var(--primary); font-weight: 500; }
        .nav-item .icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .sidebar-footer {
            padding: 12px 16px; border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-footer .avatar {
            width: 28px; height: 28px; border-radius: 50%; background: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #fff; font-weight: 600; flex-shrink: 0;
        }
        .sidebar-footer .info { font-size: 12px; line-height: 1.4; }
        .sidebar-footer .info .role { color: var(--muted); font-size: 10px; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .topbar {
            height: 48px; min-height: 48px; background: var(--surface);
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between; padding: 0 24px;
        }
        .topbar .page-title { font-size: 15px; font-weight: 600; }
        .topbar .actions { display: flex; gap: 8px; align-items: center; }
        .topbar .live-indicator { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .topbar .live-indicator .pulse {
            width: 6px; height: 6px; border-radius: 50%; background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        .btn-back {
            background: rgba(139,92,246,.15); color: var(--primary); border: 1px solid rgba(139,92,246,.25);
            padding: 6px 12px; border-radius: var(--radius); font-size: 12px; cursor: pointer;
            transition: all .15s; font-family: var(--font); display: flex; align-items: center; gap: 4px;
        }
        .btn-back:hover { background: rgba(139,92,246,.25); }

        .content { flex: 1; overflow-y: auto; padding: 24px; }
        .page { display: none; }
        .page.active { display: block; }

        /* ── Stats Row ── */
        .stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px 18px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .stat-item .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .stat-item .stat-value { font-size: 26px; font-weight: 700; font-family: var(--mono); }
        .stat-item .stat-sub { font-size: 11px; color: var(--text2); }
        .stat-item .stat-value.c-purple { color: var(--primary); }
        .stat-item .stat-value.c-green { color: var(--success); }
        .stat-item .stat-value.c-yellow { color: var(--warning); }
        .stat-item .stat-value.c-red { color: var(--danger); }

        /* ── Panel / Table ── */
        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
        }
        .panel-header {
            padding: 12px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px; font-weight: 600;
        }
        .panel-header .count { font-size: 11px; color: var(--muted); font-weight: 400; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border2); }
        th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; background: rgba(0,0,0,.15); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,.02); }
        .badge {
            display: inline-block; padding: 3px 8px; border-radius: 10px;
            font-size: 10.5px; font-weight: 500; letter-spacing: .3px;
        }
        .badge-success { background: rgba(16,185,129,.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,.15); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,.15); color: var(--danger); }
        .badge-info { background: rgba(139,92,246,.15); color: var(--primary); }
        .badge-muted { background: rgba(100,116,139,.15); color: var(--muted); }
        .empty-row td { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; }
        .row-actions { display: flex; gap: 4px; }
        .mono { font-family: var(--mono); font-size: 11px; }
        .truncate { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
            z-index: 100; align-items: center; justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px; width: 90%; max-width: 520px;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.5);
            animation: modalIn .2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal h3 { margin-bottom: 20px; font-size: 16px; font-weight: 600; }
        .modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* ── Toast ── */
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 10px 18px; border-radius: var(--radius); color: #fff; font-size: 13px;
            font-family: var(--font); animation: toastIn .25s ease; max-width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,.3);
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes toastIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar { width: 56px; min-width: 56px; }
            .sidebar-brand .name, .sidebar-brand .ver,
            .nav-item span:not(.icon), .nav-section,
            .sidebar-footer .info { display: none; }
            .nav-item { justify-content: center; padding: 10px; }
            .stat-row { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ═══════════════════ LOGIN ═══════════════════ -->
<div id="login-screen" style="display:none;">
    <div class="login-panel">
        <div class="brand">
            <h1>域感智能</h1>
            <span>Drone Data Management System</span>
        </div>
        <div class="login-err" id="login-err"></div>
        <form onsubmit="handleLogin(event)">
            <div class="field"><label>用户名</label><input type="text" id="l-user" placeholder="admin" required autofocus></div>
            <div class="field"><label>密码</label><input type="password" id="l-pass" placeholder="admin123" required></div>
            <button type="submit" class="btn btn-primary btn-block" id="l-btn">登 录</button>
        </form>
        <p style="text-align:center;margin-top:16px;color:var(--muted);font-size:11px;">
            默认账号: admin / admin123
        </p>
    </div>
</div>

<!-- ═══════════════════ APP ═══════════════════ -->
<div id="app-screen">
<div class="app-shell">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo">域</div>
        <div><div class="name">域感智能</div><div class="ver">无人机数据系统 v2.0</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-section">概览</div>
        <div class="nav-item active" data-page="dashboard"><span class="icon">◈</span> 数据概览</div>
        <div class="nav-section">数据管理</div>
        <div class="nav-item" data-page="skus"><span class="icon">◎</span> SKU管理</div>
        <div class="nav-item" data-page="drones"><span class="icon">✈</span> 无人机</div>
        <div class="nav-item" data-page="videos"><span class="icon">▶</span> 视频数据</div>
        <div class="nav-item" data-page="images"><span class="icon">▣</span> 图片数据</div>
        <div class="nav-item" data-page="rfid"><span class="icon">⊞</span> RFID数据</div>
    </nav>
    <div class="sidebar-footer">
        <div class="avatar" id="sb-avatar">A</div>
        <div class="info">
            <div id="sb-name">admin</div>
            <div class="role" id="sb-role">管理员</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" style="margin-left:auto;" title="退出登录">↩</button>
    </div>
</aside>

<!-- Main Content -->
<div class="main">
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="btn-back" onclick="goToSystemSelection()" title="返回系统选择">← 返回</button>
            <div class="page-title" id="page-title">数据概览</div>
        </div>
        <div class="actions">
            <div class="live-indicator"><span class="pulse"></span><span id="live-time">--</span></div>
        </div>
    </div>
    <div class="content" id="content-area">
        <!-- Pages rendered dynamically -->
    </div>
</div>

</div>
</div>

<!-- ═══════════════════ MODALS ═══════════════════ -->
<div class="modal-overlay" id="modal-sku"><div class="modal"><h3 id="modal-sku-title">新增SKU</h3><form id="form-sku" onsubmit="saveSku(event)"><input type="hidden" id="fs-id"><div class="field"><label>SKU编码</label><input type="text" id="fs-code" required></div><div class="field"><label>名称</label><input type="text" id="fs-name" required></div><div class="form-row"><div class="field"><label>分类</label><input type="text" id="fs-category"></div><div class="field"><label>单位</label><input type="text" id="fs-unit" value="个"></div></div><div class="btn-row"><button type="button" class="btn btn-outline" onclick="closeModal('modal-sku')">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></div></div>

<div class="modal-overlay" id="modal-drone"><div class="modal"><h3>新增无人机</h3><form id="form-drone" onsubmit="saveDrone(event)"><div class="form-row"><div class="field"><label>无人机编号</label><input type="text" id="fd-code" required></div><div class="field"><label>名称</label><input type="text" id="fd-name" required></div></div><div class="form-row"><div class="field"><label>型号</label><input type="text" id="fd-model"></div><div class="field"><label>制造商</label><input type="text" id="fd-manufacturer"></div></div><div class="form-row"><div class="field"><label>纬度</label><input type="number" step="any" id="fd-lat"></div><div class="field"><label>经度</label><input type="number" step="any" id="fd-lng"></div></div><div class="btn-row"><button type="button" class="btn btn-outline" onclick="closeModal('modal-drone')">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></div></div>

<div class="modal-overlay" id="modal-rfid"><div class="modal"><h3>新增RFID</h3><form id="form-rfid" onsubmit="saveRfid(event)"><div class="field"><label>RFID标签ID</label><input type="text" id="fr-tag" required></div><div class="field"><label>类型</label><input type="text" id="fr-type"></div><div class="form-row"><div class="field"><label>纬度</label><input type="number" step="any" id="fr-lat"></div><div class="field"><label>经度</label><input type="number" step="any" id="fr-lng"></div></div><div class="form-row"><div class="field"><label>无人机ID</label><input type="number" id="fr-drone"></div><div class="field"><label>信号强度</label><input type="number" step="any" id="fr-signal"></div></div><div class="btn-row"><button type="button" class="btn btn-outline" onclick="closeModal('modal-rfid')">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form></div></div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════ CONFIG ═══════════════════
const API = 'http://localhost:8000/api';
// 优先从 localStorage 恢复 token，否则用默认账号自动登录
let TOKEN = localStorage.getItem('drone_token') || '';
let USER = JSON.parse(localStorage.getItem('drone_user') || 'null') || { username: '', role: '' };

// ═══════════════════ UTILS ═══════════════════
function toast(msg, type='success') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

async function api(url, opts={}) {
    const h = { ...opts.headers };
    if (TOKEN) h['Authorization'] = `Bearer ${TOKEN}`;
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        h['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, { ...opts, headers: h });
    if (res.status === 401) { throw new Error('请求未授权'); }
    if (!res.ok) {
        const e = await res.json().catch(()=>({message:res.statusText}));
        throw new Error(e.message || e.detail || '请求失败');
    }
    return res.json();
}

function fmtTime(ts) { if (!ts) return '-'; return new Date(ts).toLocaleString('zh-CN',{hour12:false}); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function openModal(id) { document.getElementById(id).classList.add('show'); }

function goToSystemSelection() {
    if (window.location.protocol === 'file:') {
        window.location.href = '../../../index.html';
    } else {
        window.location.href = '/select';
    }
}

function badge(s, map) {
    const m = map || { idle:'success', flying:'info', maintenance:'warning', offline:'muted',
        active:'success', inactive:'muted' };
    const c = m[s] || 'muted';
    return `<span class="badge badge-${c}">${s}</span>`;
}

// ═══════════════════ LOGIN ═══════════════════
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('l-btn'), err = document.getElementById('login-err');
    btn.disabled = true; btn.textContent = '登录中...'; err.style.display = 'none';
    try {
        const u = document.getElementById('l-user').value;
        const p = document.getElementById('l-pass').value;
        const formData = new URLSearchParams();
        formData.append('username', u);
        formData.append('password', p);
        const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        });
        if (!res.ok) {
            const msg = await res.json().catch(()=>({detail:'用户名或密码错误'}));
            throw new Error(msg.detail || '用户名或密码错误');
        }
        const data = await res.json();
        TOKEN = data.access_token;
        localStorage.setItem('drone_token', TOKEN);
        // 获取用户信息
        try {
            const me = await api(`${API}/auth/me`);
            USER = me;
        } catch(e) { USER = { username: u, role: 'admin' }; }
        localStorage.setItem('drone_user', JSON.stringify(USER));
        showApp();
    } catch(ex) { err.textContent = ex.message; err.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = '登 录'; }
}

function logout() {
    goToSystemSelection();
}

function showApp() {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    document.getElementById('sb-name').textContent = USER?.username || 'admin';
    document.getElementById('sb-role').textContent = USER?.role || '管理员';
    document.getElementById('sb-avatar').textContent = (USER?.username || 'A')[0].toUpperCase();
    navigate('dashboard');
    setInterval(() => { document.getElementById('live-time').textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false}); }, 1000);
}

// ═══════════════════ NAVIGATION ═══════════════════
let currentPage = '';
const pageTitles = { dashboard:'数据概览', skus:'SKU管理', drones:'无人机管理', videos:'视频数据', images:'图片数据', rfid:'RFID数据' };

function navigate(name) {
    currentPage = name;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const nav = document.querySelector(`.nav-item[data-page="${name}"]`);
    if (nav) nav.classList.add('active');
    document.getElementById('page-title').textContent = pageTitles[name] || name;
    const content = document.getElementById('content-area');
    window[`render_${name}`](content);
}

document.getElementById('sidebar-nav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item) navigate(item.dataset.page);
});

// ═══════════════════ PAGE: DASHBOARD ═══════════════════
async function render_dashboard(el) {
    el.innerHTML = `<div class="stat-row" id="dash-stats"><div class="stat-item"><div class="stat-label">加载中...</div></div></div>`;
    await loadDashboard();
}

async function loadDashboard() {
    try {
        const [drones, skus, videos, images, rfids] = await Promise.allSettled([
            api(`${API}/drones/`).catch(()=>[]),
            api(`${API}/skus/`).catch(()=>[]),
            api(`${API}/videos/`).catch(()=>[]),
            api(`${API}/images/`).catch(()=>[]),
            api(`${API}/rfid/`).catch(()=>[])
        ]);
        const d = Array.isArray(drones.value)?drones.value.length:0;
        const s = Array.isArray(skus.value)?skus.value.length:0;
        const v = Array.isArray(videos.value)?videos.value.length:0;
        const i = Array.isArray(images.value)?images.value.length:0;
        const r = Array.isArray(rfids.value)?rfids.value.length:0;

        document.getElementById('dash-stats').innerHTML = `
            <div class="stat-item"><div class="stat-label">无人机</div><div class="stat-value c-purple">${d}</div><div class="stat-sub">台</div></div>
            <div class="stat-item"><div class="stat-label">SKU</div><div class="stat-value c-green">${s}</div><div class="stat-sub">个</div></div>
            <div class="stat-item"><div class="stat-label">视频</div><div class="stat-value c-yellow">${v}</div><div class="stat-sub">个</div></div>
            <div class="stat-item"><div class="stat-label">图片</div><div class="stat-value c-purple">${i}</div><div class="stat-sub">张</div></div>
            <div class="stat-item"><div class="stat-label">RFID</div><div class="stat-value c-red">${r}</div><div class="stat-sub">条</div></div>`;
    } catch(e) {}
}

// ═══════════════════ PAGE: SKUS ═══════════════════
async function render_skus(el) {
    el.innerHTML = `<div class="panel"><div class="panel-header"><span>SKU列表</span><span class="count" id="sku-count"></span><button class="btn btn-primary btn-sm" onclick="openSkuModal()">+ 新增</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th>SKU编码</th><th>名称</th><th>分类</th><th>单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="sku-tbody"></tbody></table></div></div>`;
    await loadSkus();
}

async function loadSkus() {
    try {
        const data = await api(`${API}/skus/`);
        const skus = Array.isArray(data) ? data : (data.items || []);
        document.getElementById('sku-count').textContent = `${skus.length} 个`;
        document.getElementById('sku-tbody').innerHTML = skus.length ? skus.map(s => `
            <tr><td class="mono">${s.sku_code}</td><td>${s.name}</td><td>${s.category||'-'}</td><td>${s.unit||'-'}</td>
            <td>${badge(s.is_active?'active':'inactive')}</td>
            <td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="editSku(${s.id})">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteSku(${s.id})">删除</button></div></td></tr>`).join('') : '<tr class="empty-row"><td colspan="6">暂无SKU数据</td></tr>';
    } catch(e) { document.getElementById('sku-tbody').innerHTML = `<tr class="empty-row"><td colspan="6">加载失败: ${e.message}</td></tr>`; }
}

function openSkuModal(s) {
    document.getElementById('modal-sku-title').textContent = s ? '编辑SKU' : '新增SKU';
    document.getElementById('fs-id').value = s?.id || '';
    document.getElementById('fs-code').value = s?.sku_code || '';
    document.getElementById('fs-name').value = s?.name || '';
    document.getElementById('fs-category').value = s?.category || '';
    document.getElementById('fs-unit').value = s?.unit || '个';
    openModal('modal-sku');
}

async function saveSku(e) {
    e.preventDefault();
    const id = document.getElementById('fs-id').value;
    const body = { sku_code:document.getElementById('fs-code').value, name:document.getElementById('fs-name').value, category:document.getElementById('fs-category').value, unit:document.getElementById('fs-unit').value };
    try {
        await api(id ? `${API}/skus/${id}` : `${API}/skus/`, { method: id?'PUT':'POST', body:JSON.stringify(body) });
        closeModal('modal-sku'); toast(id?'更新成功':'创建成功'); loadSkus();
    } catch(ex) { toast(ex.message,'error'); }
}

async function editSku(id) { try { const data = await api(`${API}/skus/${id}`); openSkuModal(data); } catch(ex) { toast(ex.message,'error'); } }
async function deleteSku(id) { if (!confirm('确认删除？')) return; try { await api(`${API}/skus/${id}`,{method:'DELETE'}); toast('删除成功'); loadSkus(); } catch(ex) { toast(ex.message,'error'); } }

// ═══════════════════ PAGE: VIDEOS ═══════════════════
async function render_videos(el) {
    el.innerHTML = `<div class="panel"><div class="panel-header"><span>视频列表</span><span class="count" id="video-count"></span></div>
    <div style="padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:end;">
        <div class="field" style="flex:1;min-width:140px;"><label>选择文件</label><input type="file" id="video-file" accept="video/*" style="padding:8px;"></div>
        <div class="field" style="width:120px;"><label>无人机ID</label><input type="number" id="video-drone"></div>
        <button class="btn btn-primary btn-sm" onclick="uploadVideo()" style="margin-bottom:16px;">上传</button>

    <div style="overflow-x:auto"><table><thead><tr><th>文件名</th><th>大小</th><th>无人机ID</th><th>位置</th><th>时间</th><th>操作</th></tr></thead><tbody id="video-tbody"></tbody></table></div></div>`;
    await loadVideos();
}

async function loadVideos() {
    try {
        const data = await api(`${API}/videos/`);
        const videos = Array.isArray(data) ? data : (data.items || []);
        document.getElementById('video-count').textContent = `${videos.length} 个`;
        document.getElementById('video-tbody').innerHTML = videos.length ? videos.map(v => `
            <tr><td>${v.file_name}</td><td>${(v.file_size/1024/1024).toFixed(2)} MB</td><td>${v.drone_id||'-'}</td>
            <td class="mono" style="font-size:10px;">${v.latitude&&v.longitude?`${v.latitude.toFixed(4)},${v.longitude.toFixed(4)}`:'-'}</td>

    } catch(e) { document.getElementById('video-tbody').innerHTML = `<tr class="empty-row"><td colspan="6">加载失败: ${e.message}</td></tr>`; }

async function uploadVideo() {
    const file = document.getElementById('video-file').files[0];
    if (!file) { toast('请选择文件','error'); return; }
    const form = new FormData();
    form.append('file', file);
    const droneId = document.getElementById('video-drone').value;
    if (droneId) form.append('drone_id', droneId);
    try {
        const res = await fetch(`${API}/videos/`, { method:'POST', headers:{}, body:form });
        if (!res.ok) { const e = await res.json().catch(()=>({message:res.statusText})); throw new Error(e.message||e.detail||'上传失败'); }
        toast('上传成功'); document.getElementById('video-file').value=''; loadVideos();
    } catch(ex) { toast(ex.message,'error'); }
}

async function deleteVideo(id) { if (!confirm('确认删除？')) return; try { await api(`${API}/videos/${id}`,{method:'DELETE'}); toast('删除成功'); loadVideos(); } catch(ex) { toast(ex.message,'error'); } }

// ═══════════════════ INIT ═══════════════════
(async function init() {
    // 1. 尝试恢复已有登录态
    const savedToken = localStorage.getItem('drone_token');
    const savedUser = localStorage.getItem('drone_user');
    if (savedToken && savedUser) {
        TOKEN = savedToken;
        USER = JSON.parse(savedUser);
        showApp();
        return;
    }

    // 2. 尝试自动登录
    try {
        const formData = new URLSearchParams();
        formData.append('username', 'admin');
        formData.append('password', 'admin123');
        const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        });
        if (res.ok) {
            const data = await res.json();
            TOKEN = data.access_token;
            localStorage.setItem('drone_token', TOKEN);
            try {
                const me = await fetch(`${API}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                }).then(r => r.json());
                USER = me;
            } catch(e) { USER = { username: 'admin', role: 'admin' }; }
            localStorage.setItem('drone_user', JSON.stringify(USER));
            showApp();
            return;
        }
    } catch(e) { console.warn('自动登录失败:', e); }

    // 3. 尝试自动注册 + 登录
    try {
        const regRes = await fetch(`${API}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'admin', email: 'admin@yugan.com', password: 'admin123', role: 'admin' })
        });
        if (regRes.ok) {
            // 注册成功，重试登录
            const formData = new URLSearchParams();
            formData.append('username', 'admin');
            formData.append('password', 'admin123');
            const loginRes = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            if (loginRes.ok) {
                const data = await loginRes.json();
                TOKEN = data.access_token;
                USER = { username: 'admin', role: 'admin' };
                localStorage.setItem('drone_token', TOKEN);
                localStorage.setItem('drone_user', JSON.stringify(USER));
                showApp();
                return;
            }
        }
    } catch(e) { console.warn('自动注册失败:', e); }

    // 4. 调用 ensure-admin 强制修复 admin 用户 → 重试登录
    try {
        await fetch(`${API}/auth/ensure-admin`, { method: 'POST' });
        const formData = new URLSearchParams();
        formData.append('username', 'admin');
        formData.append('password', 'admin123');
        const loginRes = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        });
        if (loginRes.ok) {
            const data = await loginRes.json();
            TOKEN = data.access_token;
            USER = { username: 'admin', role: 'admin' };
            localStorage.setItem('drone_token', TOKEN);
            localStorage.setItem('drone_user', JSON.stringify(USER));
            showApp();
            return;
        }
    } catch(e) { console.warn('ensure-admin 失败:', e); }

    // 5. 全部失败 — 显示登录页
    document.getElementById('login-screen').style.display = 'flex';
})();
</script>
