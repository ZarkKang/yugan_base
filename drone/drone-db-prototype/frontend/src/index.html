function diToggleMode() {
  const mode = document.getElementById('di-verify-mode').value;
  const showIp = mode === 'active' || mode === 'passive';
  const showPort = mode === 'active';
  document.getElementById('di-verify-ip-field').style.display = showIp ? '' : 'none';
  document.getElementById('di-verify-port-field').style.display = showPort ? '' : 'none';
}
async function diVerifyDevice() {
  const btn = document.getElementById('di-btn-verify');
  btn.disabled = true; btn.textContent = '验证中...';
  const result = document.getElementById('di-verify-result');
  result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">正在验证设备身份...</div>';
  try {
    const mode = document.getElementById('di-verify-mode').value;
    const params = new URLSearchParams({ mode });
    if (mode === 'heartbeat') {
      const droneCode = document.getElementById('di-verify-drone-code').value.trim();
      if (!droneCode) { throw new Error('请填写无人机编号'); }
      params.set('drone_code', droneCode);
    } else {
      const ip = document.getElementById('di-verify-ip').value.trim();
      if (!ip) { throw new Error('请填写设备IP'); }
      params.set('ip', ip);
      if (mode === 'active') {
        params.set('port', document.getElementById('di-verify-port').value || 8080);
      }
    }
    const r = await whRequest(`/drone-integration/device/verify?${params.toString()}`, {method:'POST'});
    const d = r.data || {};
    result.innerHTML = `
      <div class="card"><div class="card-title"><span>验证结果: ${whBadge(d.verified?'通过':'未通过',{通过:'green',未通过:'red'})}</span><span style="font-size:11px;color:var(--muted);margin-left:8px;">模式: ${escapeHtml(d.mode||mode)}</span></div>
      <div class="table-wrap"><table><thead><tr><th>项目</th><th>值</th></tr></thead><tbody>
        <tr><td>设备型号</td><td>${d.device_model?escapeHtml(d.device_model):'<span style="color:var(--muted);">未知</span>'}</td></tr>
        <tr><td>制造商</td><td>${d.manufacturer?escapeHtml(d.manufacturer):'<span style="color:var(--muted);">未知</span>'}</td></tr>
        <tr><td>固件版本</td><td>${d.firmware_version?escapeHtml(d.firmware_version):'<span style="color:var(--muted);">未知</span>'}</td></tr>
        <tr><td>支持协议</td><td>${(d.supported_protocols||[]).length?escapeHtml(d.supported_protocols.join(', ')):'<span style="color:var(--muted);">无</span>'}</td></tr>
        <tr><td>协议兼容</td><td>${whBadge(d.protocol_compatible?'兼容':'不兼容',{兼容:'green',不兼容:'red'})}</td></tr>
        ${d.protocol_issues?.length?`<tr><td>协议问题</td><td style="color:var(--red);">${escapeHtml(d.protocol_issues.join('; '))}</td></tr>`:''}
        ${d.recommendations?.length?`<tr><td>建议</td><td>${d.recommendations.map(rec=>`<div style="font-size:12px;color:var(--yellow);">• ${escapeHtml(rec)}</div>`).join('')}</td></tr>`:''}
      </tbody></table></div></div>
      ${d.raw_device_info ? `<div style="margin-top:12px;padding:8px;background:var(--bg);border-radius:var(--radius);font-size:11px;color:var(--text2);"><details><summary style="cursor:pointer;">原始设备信息</summary><pre style="margin-top:8px;white-space:pre-wrap;">${escapeHtml(JSON.stringify(d.raw_device_info, null, 2))}</pre></details></div>` : ''}
      ${d.report ? `<pre style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--radius);font-family:var(--mono);font-size:11px;color:var(--text2);white-space:pre-wrap;overflow-x:auto;">${escapeHtml(d.report)}</pre>` : ''}
      <div style="margin-top:12px;text-align:right;"><button class="btn btn-primary" onclick="diNext()">下一步 →</button></div>`;
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;text-align:center;">验证失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '验证设备'; }
}

// ── Step 4: 系统整合配置 ──
async function diRegisterDevice() {
  const btn = document.getElementById('di-btn-reg');
  btn.disabled = true; btn.textContent = '注册中...';
  const result = document.getElementById('di-reg-result');
  try {
    const params = new URLSearchParams({
      drone_id: document.getElementById('di-reg-drone').value,
      device_name: document.getElementById('di-reg-name').value,
      ip_address: document.getElementById('di-reg-ip').value,
      port: document.getElementById('di-reg-port').value,
      protocol: document.getElementById('di-reg-proto').value,
      auth_type: document.getElementById('di-reg-auth').value,
      encryption_enabled: document.getElementById('di-reg-enc-type').value !== '',
      heartbeat_interval: document.getElementById('di-reg-hb').value,
    });
    const model = document.getElementById('di-reg-model').value;
    const fw = document.getElementById('di-reg-fw').value;
    const cred = document.getElementById('di-reg-cred').value;
    const encType = document.getElementById('di-reg-enc-type').value;
    const encKey = document.getElementById('di-reg-enc-key').value;
    if (model) params.append('device_model', model);
    if (fw) params.append('firmware_version', fw);
    if (cred) params.append('auth_credential', cred);
    if (encType) params.append('encryption_type', encType);
    if (encKey) params.append('encryption_key', encKey);

    const r = await whRequest(`/drone-integration/device/register?${params}`, {method:'POST'});
    const d = r.data || {};
    DI.registeredDevice = d;
    result.innerHTML = `<div style="padding:16px;background:var(--green-bg);border-radius:var(--radius);color:var(--green);">
      <strong>✅ 设备注册成功!</strong><br>
      设备ID: ${escapeHtml(String(d?.id??'-'))}<br>
      设备名称: ${escapeHtml(d?.device_name||'-')}<br>
      IP: ${escapeHtml(d?.ip_address||'-')}:${escapeHtml(String(d?.port??'-'))}<br>
      协议: ${escapeHtml(d?.protocol||'-')} | 加密: ${d?.encryption_enabled?'已启用':'未启用'}<br>
      <span style="font-size:11px;color:var(--text2);">设备已加入系统，可进行下一步测试</span></div>
      <div style="margin-top:12px;text-align:right;"><button class="btn btn-primary" onclick="diNext()">下一步 →</button></div>`;
    toast('设备注册成功');
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;">注册失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '注册设备'; }
}

// ── Step 5: 数据传输测试 ──
async function diTestConnection() {
  const deviceId = document.getElementById('di-test-device').value;
  const result = document.getElementById('di-test-result');
  result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">连接测试中...</div>';
  try {
    const r = await whRequest(`/drone-integration/device/${encodeURIComponent(deviceId)}/test-connection`, {method:'POST'});
    const d = r.data || {};
    result.innerHTML = `
      <div class="card"><div class="card-title"><span>连接测试</span></div>
      <div class="table-wrap"><table><thead><tr><th>项目</th><th>结果</th></tr></thead><tbody>
        <tr><td>状态</td><td>${whBadge(d.success?'连接成功':'连接失败',{连接成功:'green',连接失败:'red'})}</td></tr>
        <tr><td>IP</td><td class="cell-mono">${escapeHtml(d.ip||'-')}:${escapeHtml(String(d.port??'-'))}</td></tr>
        <tr><td>响应时间</td><td>${d.response_time_ms!=null?d.response_time_ms+'ms':'-'}</td></tr>
        <tr><td>设备状态</td><td>${whBadge(d.status)}</td></tr>
      </tbody></table></div></div>`;
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;">连接测试失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
}

async function diTestTransmission() {
  const btn = document.getElementById('di-btn-test');
  btn.disabled = true; btn.textContent = '测试中...';
  const result = document.getElementById('di-test-result');
  result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">数据传输测试中...</div>';
  try {
    const deviceId = document.getElementById('di-test-device').value;
    const dataType = document.getElementById('di-test-type').value;
    const r = await whRequest(`/drone-integration/transmission/test?device_id=${encodeURIComponent(deviceId)}&data_type=${encodeURIComponent(dataType)}`, {method:'POST'});
    const d = r.data || {};
    let html = `<div class="card"><div class="card-title"><span>传输测试结果</span>${whBadge(d.success?'成功':'失败',{成功:'green',失败:'red'})}</div>
    <div style="padding:12px;font-size:13px;color:var(--text2);">${escapeHtml(d.message||'')}</div>`;
    if (dataType === 'rfid_json' || dataType === 'both') {
      const rfid = d.rfid_result||d;
      html += `<div class="table-wrap"><table><thead><tr><th>项目</th><th>值</th></tr></thead><tbody>
        <tr><td>RFID数据文件</td><td class="cell-mono" style="font-size:11px;">${escapeHtml(rfid.file_path||'-')}</td></tr>
        <tr><td>文件大小</td><td>${rfid.file_size!=null?(rfid.file_size/1024).toFixed(1)+'KB':'-'}</td></tr>
        <tr><td>标签数量</td><td>${rfid.tag_count||0}</td></tr>
      </tbody></table></div>`;
    }
    if (dataType === 'video' || dataType === 'both') {
      const video = d.video_result||d;
      html += `<div class="table-wrap"><table><thead><tr><th>项目</th><th>值</th></tr></thead><tbody>
        <tr><td>视频流</td><td>${whBadge(video.success?'可用':'不可用',{可用:'green',不可用:'red'})}</td></tr>
        <tr><td>RTSP地址</td><td class="cell-mono" style="font-size:11px;">${escapeHtml(video.rtsp_url||'-')}</td></tr>
      </tbody></table></div>`;
    }
    html += '</div>';
    result.innerHTML = html;
    if (d.success) toast('数据传输测试通过', 'success');
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;">传输测试失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '开始测试'; }
}

// ── Step 6: 自动化任务 ──
async function diCreateTask() {
  const result = document.getElementById('di-task-create-result');
  try {
    const selectedShelves = diGetSelectedShelves();
    const params = new URLSearchParams({
      device_id: document.getElementById('di-task-device').value,
      task_name: document.getElementById('di-task-name').value,
      task_type: document.getElementById('di-task-type').value,
      schedule_type: document.getElementById('di-task-sched-type').value,
      schedule_value: document.getElementById('di-task-sched-val').value,
      target_storage_path: document.getElementById('di-task-path').value,
      video_duration: document.getElementById('di-task-vdur').value,
      video_resolution: document.getElementById('di-task-vres').value,
      rfid_read_duration: document.getElementById('di-task-rdur').value,
    });
    // 附带目标货架列表 (JSON字符串)
    if (selectedShelves.length > 0) {
      params.append('target_shelves', JSON.stringify(selectedShelves));
    }
    const r = await whRequest(`/drone-integration/tasks?${params}`, {method:'POST'});
    result.innerHTML = `<div style="padding:12px;background:var(--green-bg);border-radius:var(--radius);color:var(--green);">✅ 任务创建成功! ID: ${escapeHtml(String(r.data?.id??'-'))}${selectedShelves.length?` (目标货架: ${selectedShelves.length}个)`:''}</div>`;
    toast('任务创建成功');
    diRefreshTaskList();
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:12px;">创建失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
}

async function diRefreshTaskList() {
  try {
    const r = await whRequest('/drone-integration/tasks');
    const tasks = r.data?.tasks||[];
    document.getElementById('di-task-list').innerHTML = tasks.length ? tasks.map(t => {
      const shelves = Array.isArray(t.target_shelves) ? t.target_shelves : [];
      const shelvesView = shelves.length
        ? `<span class="cell-mono" style="font-size:11px;">${shelves.length}个: ${escapeHtml(shelves.slice(0,2).join(', '))}${shelves.length>2?'...':''}</span>`
        : '<span style="color:var(--muted);font-size:11px;">全部</span>';
      return `
      <tr>
        <td>${escapeHtml(t.task_name||'-')}</td><td>${t.task_type==='both'?'视频+RFID':t.task_type==='video_capture'?'视频采集':'RFID读取'}</td>
        <td>${shelvesView}</td>
        <td><span class="badge badge-blue">${escapeHtml(t.schedule_type||'-')}</span> ${escapeHtml(t.schedule_value||'-')}</td>
        <td>${whBadge(t.enabled?'启用':'禁用',{启用:'green',禁用:'gray'})}</td>
        <td>${t.last_run_at?formatDate(t.last_run_at):'-'}</td>
        <td>${t.run_count||0}</td>
        <td><div class="cell-actions">
          <button class="btn btn-secondary btn-sm" onclick="diRunTask(${t.id})">执行</button>
          <button class="btn btn-secondary btn-sm" onclick="diToggleTask(${t.id},${!t.enabled})">${t.enabled?'禁用':'启用'}</button>
          <button class="btn btn-danger btn-sm" onclick="diDeleteTask(${t.id})">删除</button>
        </div></td>
      </tr>`;
    }).join('') : '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted);">暂无自动化任务</td></tr>';
  } catch(e) { document.getElementById('di-task-list').innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--red);">加载失败: ${escapeHtml(e.message)}</td></tr>`; }
}

async function diRunTask(id) {
  try { const r = await whRequest(`/drone-integration/tasks/${id}/run`, {method:'POST'}); toast(r.message||'已执行'); diRefreshTaskList(); } catch(ex) { toast(ex.message,'error'); }
}
async function diToggleTask(id, enable) {
  try { const r = await whRequest(`/drone-integration/tasks/${id}?enabled=${enable}`, {method:'PUT'}); toast(r.message||'已更新'); diRefreshTaskList(); } catch(ex) { toast(ex.message,'error'); }
}
async function diDeleteTask(id) {
  confirmDialog({
    title:'删除任务',
    message:'确认删除该任务？此操作不可恢复。',
    confirmText:'删除',
    danger:true,
    onConfirm: async () => {
      try { await whRequest(`/drone-integration/tasks/${id}`, {method:'DELETE'}); toast('任务已删除'); diRefreshTaskList(); }
      catch(ex) { toast(ex.message,'error'); }
    }
  });
}

async function diLoadTasks() { diRefreshTaskList(); }

// ── Step 7: 监控与日志 ──
async function diLoadMonitor() {
  try {
    const r = await whRequest('/drone-integration/monitor/status');
    const d = r.data || {};
    document.getElementById('di-mon-total').textContent = d.total||0;
    document.getElementById('di-mon-online').textContent = d.online_count||0;
    document.getElementById('di-mon-offline').textContent = d.offline_count||0;
    const devices = d.devices||[];
    document.getElementById('di-mon-devices').innerHTML = devices.length ? devices.map(dv => `
      <tr>
        <td>${escapeHtml(dv.device_name||'-')}</td>
        <td class="cell-mono">${escapeHtml(dv.ip_address||'-')}:${escapeHtml(String(dv.port??'-'))}</td>
        <td><span class="badge badge-blue">${escapeHtml(dv.protocol||'-')}</span></td>
        <td>${whBadge(dv.status)}</td>
        <td>${dv.last_connected_at?formatDate(dv.last_connected_at):'从未连接'}</td>
      </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted);">暂无注册设备</td></tr>';
  } catch(e) { /* ignore */ }
}

async function diLoadLogs() {
  try {
    const filter = document.getElementById('di-log-filter').value;
    const params = new URLSearchParams({limit: '50'});
    if (filter) params.append('log_type', filter);
    const r = await whRequest(`/drone-integration/logs?${params}`);
    const logs = r.data?.logs||[];
    document.getElementById('di-mon-logs').textContent = r.data?.total||0;
    document.getElementById('di-mon-logs-list').innerHTML = logs.length ? logs.map(l => `
      <tr>
        <td style="font-size:11px;white-space:nowrap;">${l.created_at?new Date(l.created_at).toLocaleTimeString('zh-CN',{hour12:false}):'-'}</td>
        <td>${whBadge(l.log_type)}</td>
        <td>${l.direction==='send'?'↑ 发送':'↓ 接收'}</td>
        <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(l.payload_summary||'')}">${escapeHtml(l.payload_summary||'-')}</td>
        <td>${whBadge(l.status)}</td>
      </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted);">暂无通信日志</td></tr>';
  } catch(e) { /* ignore */ }
}
</script>
</body>
</html>
