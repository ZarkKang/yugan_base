<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域感智能 - 基站数据库</title>
<style>
/* ========== 全局变量与基础样式 ========== */
:root{
  --grad-start:#667eea;
  --grad-end:#764ba2;
  --primary:#667eea;
  --primary-dark:#764ba2;
  --bg:#f5f7fa;
  --surface:#ffffff;
  --text:#1a202c;
  --text2:#718096;
  --muted:#a0aec0;
  --border:#e2e8f0;
  --green:#38a169;
  --green-bg:#e6fffa;
  --yellow:#d69e2e;
  --yellow-bg:#fffbeb;
  --red:#e53e3e;
  --red-bg:#fff5f5;
  --blue:#3182ce;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.12);
  --radius:8px;
  --sidebar-w:240px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#a0aec0}

/* ========== 布局 ========== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,#2d2b55 0%,#1a1830 100%);color:#e2e8f0;
  position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;
  transition:transform .25s ease;
}
.sidebar-brand{padding:20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .logo{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,var(--grad-start),var(--grad-end));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;
}
.sidebar-brand .title{font-size:15px;font-weight:600;line-height:1.2}
.sidebar-brand .sub{font-size:11px;color:#a0aec0;letter-spacing:1px}
.sidebar-user{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:#cbd5e0}
.sidebar-user .name{color:#fff;font-weight:600;font-size:13px}
.sidebar-user .role-badge{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:10px;font-size:10px;background:rgba(102,126,234,.3);color:#c3dafe}
.sidebar-menu{flex:1;overflow-y:auto;padding:12px 0}
.menu-item{
  display:flex;align-items:center;gap:12px;padding:11px 20px;color:#cbd5e0;font-size:14px;
  cursor:pointer;border-left:3px solid transparent;transition:all .15s;
}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff}
.menu-item.active{background:rgba(102,126,234,.18);color:#fff;border-left-color:var(--grad-start)}
.menu-item svg{width:18px;height:18px;flex-shrink:0}
.menu-section{padding:14px 20px 6px;font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:1px}
.sidebar-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#718096}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40;
}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-title{font-size:16px;font-weight:600}
.btn-back{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text2);font-size:13px;transition:all .15s}
.btn-back:hover{border-color:var(--primary);color:var(--primary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:13px;color:var(--text2)}
.topbar-user .name{color:var(--text);font-weight:500}
.btn-logout{padding:6px 12px;border-radius:6px;color:var(--red);font-size:13px;border:1px solid transparent;transition:all .15s}
.btn-logout:hover{background:var(--red-bg);border-color:var(--red)}
.hamburger{display:none;width:36px;height:36px;border-radius:6px;align-items:center;justify-content:center;color:var(--text)}
.hamburger:hover{background:var(--bg)}

.content{padding:24px;flex:1;min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header h2{font-size:20px;font-weight:600}
.page-header .desc{font-size:13px;color:var(--text2);margin-top:4px}

/* ========== 卡片与统计 ========== */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:14px;transition:transform .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-info .num{font-size:24px;font-weight:700;line-height:1.1}
.stat-info .label{font-size:12px;color:var(--text2);margin-top:2px}

/* ========== 表格 ========== */
.table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f7fafc;text-align:left;padding:12px 14px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:nth-child(even){background:#fbfcfe}
tbody tr:hover{background:#f0f4ff}
.table-empty{text-align:center;padding:40px;color:var(--muted)}
.cell-mono{font-family:var(--mono);font-size:12px}
.cell-actions{display:flex;gap:6px;white-space:nowrap}

/* ========== 按钮 ========== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:linear-gradient(135deg,var(--grad-start),var(--grad-end));color:#fff}
.btn-primary:hover{opacity:.92;box-shadow:0 4px 12px rgba(102,126,234,.35)}
.btn-secondary{background:#fff;border-color:var(--primary);color:var(--primary)}
.btn-secondary:hover{background:#f0f4ff}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-ghost{background:transparent;color:var(--text2);padding:6px 10px}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-icon{padding:5px;border-radius:6px;color:var(--text2);display:inline-flex;align-items:center}
.btn-icon:hover{background:var(--bg);color:var(--primary)}
.btn-icon.danger:hover{color:var(--red);background:var(--red-bg)}

/* ========== 徽章 ========== */
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500;line-height:1.6}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-blue{background:#ebf8ff;color:var(--blue)}
.badge-gray{background:#edf2f7;color:var(--text2)}

/* ========== 表单 ========== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-label .req{color:var(--red)}
.form-input,.form-select,.form-textarea{
  width:100%;padding:9px 12px;background:#fff;border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(102,126,234,.15)}
.form-textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px}
.form-error{font-size:12px;color:var(--red);margin-top:4px}

/* ========== 工具条 ========== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}
.search-box{position:relative}
.search-box input{padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:6px;width:240px;font-size:13px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--primary)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}

/* ========== 分页 ========== */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px;flex-wrap:wrap}
.pagination-info{font-size:12px;color:var(--text2)}
.pagination-controls{display:flex;gap:6px}

/* ========== Modal ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto;animation:modalIn .18s ease}
.modal.modal-lg{max-width:860px}
.modal.modal-sm{max-width:420px}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:20px;max-height:65vh;overflow-y:auto}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ========== Toast ========== */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:#fff;border-radius:8px;box-shadow:var(--shadow-lg);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;border-left:4px solid var(--text2);animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--yellow)}
.toast.info{border-left-color:var(--blue)}
.toast .toast-msg{flex:1}
.toast .toast-close{color:var(--muted);cursor:pointer;padding:0 2px}

/* ========== 加载与骨架 ========== */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-radius:50%;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:8px}
.skeleton{background:linear-gradient(90deg,#edf2f7 25%,#f7fafc 37%,#edf2f7 63%);background-size:400% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-row{height:40px;margin:8px 0;border-radius:4px}

/* ========== 上传区 ========== */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--text2);transition:all .15s;cursor:pointer}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:#f0f4ff;color:var(--primary)}
.upload-zone svg{width:36px;height:36px;margin-bottom:8px}
.upload-progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:10px}
.upload-progress .bar{height:100%;background:linear-gradient(90deg,var(--grad-start),var(--grad-end));transition:width .2s}

/* ========== 预览 ========== */
.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.preview-wrap img,.preview-wrap video{max-width:100%;max-height:60vh;border-radius:6px}
.preview-meta{width:100%;font-size:12px;color:var(--text2);font-family:var(--mono);word-break:break-all;background:var(--bg);padding:10px;border-radius:6px}

/* ========== 监控 ========== */
.ws-status{display:flex;align-items:center;gap:8px;font-size:13px}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ws-dot.connected{background:var(--green);box-shadow:0 0 0 4px rgba(56,161,105,.2)}
.ws-dot.disconnected{background:var(--red)}
.log-box{background:#1a202c;color:#cbd5e0;border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;height:320px;overflow-y:auto;line-height:1.7}
.log-box .log-line{border-bottom:1px solid rgba(255,255,255,.04);padding:2px 0}
.log-box .log-time{color:#718096}
.log-box .log-msg{color:#e2e8f0}

/* ========== 响应式 ========== */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .sidebar-overlay.show{display:block}
  .form-row{grid-template-columns:1fr}
  .search-box input{width:160px}
}
.muted{color:var(--muted)}
.text2{color:var(--text2)}
.mono{font-family:var(--mono)}
.hide{display:none !important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{flex-wrap:wrap}
.gap-sm{gap:6px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.health-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-radius:8px;box-shadow:var(--shadow)}
.health-item .name{font-size:13px;color:var(--text2)}
.health-item .state{font-size:13px;font-weight:600}

/* ========== 巡检树状结构 ========== */
.insp-layout{display:flex;gap:20px;min-height:400px}
.insp-left{width:35%;flex-shrink:0}
.insp-right{flex:1;min-width:0}
.insp-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.insp-filter select,.insp-filter input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none}
.insp-filter select:focus,.insp-filter input:focus{border-color:var(--primary)}
.insp-sessions{max-height:520px;overflow-y:auto}
.insp-session-row{padding:10px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.insp-session-row:hover{border-color:var(--primary);background:#f0f4ff}
.insp-session-row.active{border-color:var(--primary);background:#edf2ff;box-shadow:0 0 0 1px var(--primary)}
.insp-session-row .code{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.insp-session-row .meta{font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.insp-tree{font-size:13px;line-height:1.8}
.insp-node{margin-left:0}
.insp-node .insp-node{margin-left:22px}
.insp-node-head{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;flex-wrap:wrap}
.insp-node-head:hover{background:#f0f4ff}
.insp-toggle{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);font-size:12px;flex-shrink:0;transition:transform .15s;user-select:none}
.insp-toggle.open{transform:rotate(90deg)}
.insp-toggle.leaf{visibility:hidden}
.insp-node-children{display:none}
.insp-node-children.open{display:block}
.insp-node-label{font-weight:500}
.insp-node-detail{font-size:11px;color:var(--text2)}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">域</div>
      <div>
        <div class="title">基站数据库</div>
        <div class="sub">DRONE DB</div>
      </div>
    </div>
    <div class="sidebar-user" id="sidebarUser">
      <div class="name">-</div>
      <span class="role-badge">-</span>
    </div>
    <nav class="sidebar-menu" id="sidebarMenu"></nav>
    <div class="sidebar-footer"><a href="test.html" style="color:#8b9cf7;margin-right:12px;">功能测试工具</a> v2.0.0 · 域感智能</div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">仪表盘</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">当前用户：<span class="name" id="topbarUser">-</span></div>
        <button class="btn-back" id="btnBack" title="返回系统选择页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M15 18l-6-6 6-6"/></svg>
          系统选择
        </button>
        <button class="btn-logout" id="btnLogout">退出登录</button>
      </div>
    </header>
    <main class="content" id="content">
      <div class="loading-center"><span class="spinner"></span> 加载中...</div>
    </main>
  </div>
</div>

<!-- Modal 容器 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" id="modalClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
 * 域感智能 - 基站数据库前端（单文件 SPA）
 * 模块：配置 / 工具 / 认证 / 路由 / 布局 / 各业务页面 / WebSocket 监控
 * ============================================================ */

/* ========== 配置 ========== */
const CONFIG = {
  API_BASE: `http://${window.location.hostname}:8000/api`,        // drone-db（巡检历史/数据治理）
  WAREHOUSE_API: `http://${window.location.hostname}:8001/api/v1`, // warehouse（写操作/硬件控制/业务管理）
  WS_BASE: `ws://${window.location.hostname}:8000/api/ws`,
  TOKEN_KEY: 'drone_db_token',
  USER_KEY: 'drone_db_user',
  PAGE_SIZE: 20,
};

/* ========== 图标 SVG ========== */
const ICON = {

/* ========== 工具函数 ========== */
function $(sel, root){return (root||document).querySelector(sel);}
function $$(sel, root){return Array.from((root||document).querySelectorAll(sel));}

/** HTML 转义，防 XSS */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/** 文本渲染（textContent 安全） */
function text(el, val){ if(el) el.textContent = (val===null||val===undefined)?'':String(val); }

function formatDate(val){
  if(!val) return '-';
  try{
    const d = new Date(val);
    if(isNaN(d.getTime())) return String(val);
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }catch(e){ return String(val); }
}
function formatSize(bytes){
  if(bytes===null||bytes===undefined) return '-';
  const n = Number(bytes);
  if(isNaN(n)) return '-';
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  if(n<1024*1024*1024) return (n/1024/1024).toFixed(2)+' MB';
  return (n/1024/1024/1024).toFixed(2)+' GB';
}
function debounce(fn, wait){
  let t; return function(...args){clearTimeout(t); t=setTimeout(()=>fn.apply(this,args),wait||300);};
}

/* ========== Toast ========== */
function toast(msg, type='info', duration=3000){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-msg">${escapeHtml(msg)}</span><span class="toast-close">×</span>`;
  wrap.appendChild(el);
  const remove = ()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),200); };
  el.querySelector('.toast-close').onclick = remove;
  if(duration>0) setTimeout(remove, duration);
}

/* ========== Modal ========== */
function openModal({title, body, footer, size}){
  $('#modalTitle').textContent = title||'';
  const modal = $('#modal');
  modal.classList.remove('modal-lg','modal-sm');
  if(size==='lg') modal.classList.add('modal-lg');
  if(size==='sm') modal.classList.add('modal-sm');
  const bodyEl = $('#modalBody');
  bodyEl.innerHTML = '';
  if(typeof body==='string') bodyEl.innerHTML = body;
  else if(body instanceof HTMLElement) bodyEl.appendChild(body);
  const footerEl = $('#modalFooter');
  footerEl.innerHTML = '';
  if(footer){
    if(typeof footer==='string') footerEl.innerHTML = footer;
    else if(Array.isArray(footer)) footer.forEach(b=>footerEl.appendChild(b));
    else if(footer instanceof HTMLElement) footerEl.appendChild(footer);
  }
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
$('#modalClose').onclick = closeModal;
$('#modalOverlay').onclick = (e)=>{ if(e.target===$('#modalOverlay')) closeModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/** 二次确认对话框 */
function confirmDialog({title='确认操作', message, confirmText='确认', danger=true, onConfirm}){
  const btnConfirm = document.createElement('button');
  btnConfirm.className = 'btn ' + (danger?'btn-danger':'btn-primary');
  btnConfirm.textContent = confirmText;
  const btnCancel = document.createElement('button');
  btnCancel.className = 'btn btn-ghost';
  btnCancel.textContent = '取消';
  btnConfirm.onclick = async ()=>{
    btnConfirm.disabled = true;
    btnConfirm.innerHTML = '<span class="spinner"></span> 处理中';
    try{ await onConfirm(); closeModal(); }
    catch(e){ toast(e.message||'操作失败','error'); }
    finally{ btnConfirm.disabled=false; }
  };
  btnCancel.onclick = closeModal;
  openModal({title, body:`<p style="font-size:14px;line-height:1.6">${escapeHtml(message)}</p>`, footer:[btnCancel,btnConfirm], size:'sm'});
}

/* ========== 认证与 API ========== */
/** 获取 token：URL 参数优先，其次 localStorage */
function getToken(){
  const urlParams = new URLSearchParams(window.location.search);
  const urlToken = urlParams.get('token');
  if(urlToken){
    localStorage.setItem(CONFIG.TOKEN_KEY, urlToken);
    // 清理 URL 中的 token 参数（保留 hash）
    urlParams.delete('token');
    const newSearch = urlParams.toString();
    const newUrl = window.location.pathname + (newSearch?('?'+newSearch):'') + window.location.hash;
    window.history.replaceState({}, '', newUrl);
    return urlToken;
  }
  return localStorage.getItem(CONFIG.TOKEN_KEY);
}
function setToken(t){ localStorage.setItem(CONFIG.TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(CONFIG.TOKEN_KEY); localStorage.removeItem(CONFIG.USER_KEY); }

/** 获取系统选择页 / 登录页地址（兼容 http 与 file 协议） */
function appUrl(path){
  if(window.location.protocol.startsWith('http')){
    return `/app/${path}`;
  }
  // file 协议：相对路径回到 app 目录
  // 当前文件位于 drone/drone-db-prototype/frontend/src/index.html
  const base = window.location.href.replace(/\/[^/]*$/, '/../../../../app/');
  return base + path;
}

/** 401 处理：清 token，跳登录页 */
function handleUnauthorized(){
  clearToken();
  toast('登录已失效，正在跳转登录页','warn');
  setTimeout(()=>{
    const redirect = encodeURIComponent(window.location.pathname + window.location.hash);
    window.location.href = appUrl(`login.html?redirect=${redirect}`);
  }, 800);
}

/** 统一 API 请求封装（drone-db 8000） */
async function apiRequest(path, options={}){
  const token = getToken();
  const headers = Object.assign({}, options.headers||{});
  if(token) headers['Authorization'] = `Bearer ${token}`;
  let res;
  try{
    res = await fetch(CONFIG.API_BASE + path, Object.assign({}, options, {headers}));
  }catch(e){
    throw new Error('网络连接失败，请检查后端服务（端口 8000）是否启动');
  }
  if(res.status===401){ handleUnauthorized(); throw new Error('未授权'); }
  let data;
  const ct = res.headers.get('content-type')||'';
  if(ct.includes('application/json')) data = await res.json();
  else data = await res.text();
  if(!res.ok){
    const msg = (data && (data.message||data.detail)) || `请求失败 (${res.status})`;
    throw new Error(msg);
  }
  return data;
}

/** warehouse API 请求封装（8001，写操作/硬件控制/业务管理）
 * 共享 JWT token（两系统 SECRET_KEY 一致） */
async function whRequest(path, options={}){
  const token = getToken();
  const headers = Object.assign({}, options.headers||{});
  if(token) headers['Authorization'] = `Bearer ${token}`;
  let res;
  try{
    res = await fetch(CONFIG.WAREHOUSE_API + path, Object.assign({}, options, {headers}));
  }catch(e){
    throw new Error('网络连接失败，请检查 warehouse 服务（端口 8001）是否启动');
  }
  if(res.status===401){ handleUnauthorized(); throw new Error('未授权'); }
  let data;
  const ct = res.headers.get('content-type')||'';
  if(ct.includes('application/json')) data = await res.json();
  else data = await res.text();
  if(!res.ok){
    const msg = (data && (data.message||data.detail)) || `请求失败 (${res.status})`;
    throw new Error(msg);
  }
  return data;
}

/** 开发模式：确保 token 存在（ensure-admin + 自动登录） */
async function ensureToken(){
  let token = getToken();
  if(token) return token;
  toast('未检测到 token，尝试自动登录（admin/admin）...','info', 2500);
  // 公开端点：确保 admin 就绪
  try{
    await fetch(CONFIG.API_BASE + '/auth/ensure-admin', {method:'POST'});
  }catch(e){ /* 忽略，可能服务未启动 */ }
  // 登录（form-urlencoded）
  const form = new URLSearchParams();
  form.append('username','admin');
  form.append('password','admin');
  const res = await fetch(CONFIG.API_BASE + '/auth/login', {method:'POST', body: form});
  const data = await res.json();
  if(!res.ok || !data.access_token){
    throw new Error(data.message||data.detail||'自动登录失败，请手动登录');
  }
  setToken(data.access_token);
  return data.access_token;
}

function getHash(){
  const h = window.location.hash.replace(/^#/, '');
  return routes[h] ? h : 'dashboard';
}

function navigate(hash){
  window.location.hash = hash;
}

function onHashChange(){
  const hash = getHash();
  state.currentHash = hash;
  const route = routes[hash];
  // 权限检查
  const menu = MENUS.flatMap(s=>s.items).find(i=>i.hash===hash);
  if(menu && menu.adminOnly && state.user && state.user.role!=='admin'){
    $('#content').innerHTML = `<div class="table-empty">权限不足：仅管理员可访问此页面</div>`;
    $('#topbarTitle').textContent = route.title;
    renderSidebar();
    return;
  }
  $('#topbarTitle').textContent = route.title;
  document.title = `${route.title} - 基站数据库`;
  $('#content').innerHTML = `<div class="loading-center"><span class="spinner"></span> 加载中...</div>`;
  renderSidebar();
  // 关闭移动端侧栏
  $('#sidebar').classList.remove('open');
  $('#sidebarOverlay').classList.remove('show');
  try{
    Promise.resolve(route.render()).catch(e=>{
      $('#content').innerHTML = `<div class="table-empty">加载失败：${escapeHtml(e.message||'')}</div>`;
      toast(e.message||'加载失败','error');
    });
  }catch(e){
    $('#content').innerHTML = `<div class="table-empty">加载失败：${escapeHtml(e.message||'')}</div>`;
  }
}

window.addEventListener('hashchange', onHashChange);

/* ========== 布局渲染 ========== */
function renderSidebar(){
  const menuEl = $('#sidebarMenu');
  const isAdmin = state.user && state.user.role==='admin';
  let html = '';
  MENUS.forEach(sec=>{
    const items = sec.items.filter(it=>!it.adminOnly || isAdmin);
    if(items.length===0) return;
    html += `<div class="menu-section">${escapeHtml(sec.section)}</div>`;
    items.forEach(it=>{
      const active = it.hash===state.currentHash ? 'active' : '';
      html += `<div class="menu-item ${active}" data-hash="${it.hash}">${ICON[it.icon]}<span>${escapeHtml(it.label)}</span></div>`;
    });
  });
  menuEl.innerHTML = html;
  $$('.menu-item', menuEl).forEach(el=>{
    el.onclick = ()=>navigate(el.dataset.hash);
  });
  // 用户信息
  const u = state.user;
  if(u){
    $('#sidebarUser').innerHTML = `<div class="name">${escapeHtml(u.username)}</div><span class="role-badge">${escapeHtml(u.role)}</span>`;
    $('#topbarUser').textContent = u.username;
  }
}

function makePagination(stateKey, total){
  const st = state.pages[stateKey] || {page:0};
  const start = total===0?0:(st.page*CONFIG.PAGE_SIZE+1);
  const end = st.page*CONFIG.PAGE_SIZE + total;
  const prevDisabled = st.page===0;
  const nextDisabled = total < CONFIG.PAGE_SIZE;
  return `<div class="pagination">
    <div class="pagination-info">第 ${start}-${end} 条${total>=CONFIG.PAGE_SIZE?'（可能有更多）':''}</div>
    <div class="pagination-controls">
      <button class="btn btn-secondary btn-sm" data-page="prev" ${prevDisabled?'disabled':''}>${ICON.chevronLeft}上一页</button>
      <button class="btn btn-secondary btn-sm" data-page="next" ${nextDisabled?'disabled':''}>下一页${ICON.chevronRight}</button>
    </div>
  </div>`;
}

function bindPagination(container, stateKey, reloadFn){
  $$('[data-page]', container).forEach(btn=>{
    btn.onclick = ()=>{
      const st = state.pages[stateKey] || {page:0};
      if(btn.dataset.page==='prev' && st.page>0) st.page--;
      else if(btn.dataset.page==='next') st.page++;
      state.pages[stateKey] = st;
      reloadFn();
    };
  });
}

/** 通用表格构造 */
function makeTable(columns, rows, opts={}){
  if(!rows || rows.length===0){
    return `<div class="table-wrap"><div class="table-empty">${escapeHtml(opts.empty||'暂无数据')}</div></div>`;
  }
  let html = '<div class="table-wrap"><table><thead><tr>';
  columns.forEach(c=>{ html += `<th>${escapeHtml(c.title)}</th>`; });
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>';
    columns.forEach(c=>{
      const val = c.render ? c.render(r) : escapeHtml(r[c.key]);
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/** 状态徽章 */
function statusBadge(status){
  const s = String(status||'').toLowerCase();
  let cls = 'badge-gray', label = status||'-';
  if(['online','flying','active','valid','healthy','ok'].includes(s)) cls='badge-green';
  else if(['idle','pending','warn'].includes(s)) cls='badge-yellow';
  else if(['offline','error','invalid','disabled'].includes(s)) cls='badge-red';
  return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
}

async function loadSkus(){
  const key='skus'; const st=state.pages[key]; const content=$('#content');
  content.innerHTML = makeToolbar({title:'SKU 管理', desc:'管理库存单位（SKU）主数据', buttons:[{text:'新增 SKU',icon:'add',id:'btnAddSku'},{text:'刷新',icon:'refresh',id:'btnRefSku',cls:'btn-secondary'}]});
  const wrap=document.createElement('div'); wrap.id='skuWrap'; wrap.innerHTML='<div class="loading-center"><span class="spinner"></span> 加载中</div>';
  content.appendChild(wrap);
  $('#btnAddSku').onclick=()=>showSkuForm();
  $('#btnRefSku').onclick=loadSkus;
  try{
    const list = await apiRequest(`/skus/?skip=${st.page*CONFIG.PAGE_SIZE}&limit=${CONFIG.PAGE_SIZE}`);
    let html = makeTable([
      {title:'SKU 编码',render:r=>`<span class="cell-mono">${escapeHtml(r.sku_code)}</span>`},
      {title:'名称',render:r=>escapeHtml(r.name||'-')},
      {title:'分类',render:r=>escapeHtml(r.category||'-')},
      {title:'单位',render:r=>escapeHtml(r.unit||'-')},
      {title:'描述',render:r=>escapeHtml(r.description||'-')},
      {title:'激活',render:r=>r.is_active?'<span class="badge badge-green">是</span>':'<span class="badge badge-gray">否</span>'},
      {title:'创建时间',render:r=>`<span class="text2">${formatDate(r.created_at)}</span>`},
      {title:'操作',render:r=>`<div class="cell-actions"><button class="btn-icon" data-edit="${r.id}" title="编辑">${ICON.edit}</button><button class="btn-icon danger" data-del="${r.id}" title="删除">${ICON.trash}</button></div>`},
    ], list, {empty:'暂无 SKU'});
    html += makePagination(key, list.length);
    wrap.innerHTML = html;
    bindPagination(wrap, key, loadSkus);
    $$('[data-edit]',wrap).forEach(b=>b.onclick=()=>showSkuForm(b.dataset.edit));
    $$('[data-del]',wrap).forEach(b=>b.onclick=()=>deleteSku(b.dataset.del));
  }catch(e){ wrap.innerHTML=`<div class="table-empty">加载失败：${escapeHtml(e.message)}</div>`; toast(e.message,'error'); }
}
async function showSkuForm(id){
  let sku=null;
  if(id){ try{ sku=await apiRequest(`/skus/${id}`); }catch(e){ toast(e.message,'error'); return; } }
  const body = `
    <form id="skuForm">
      <div class="form-group"><label class="form-label">SKU 编码 <span class="req">*</span></label><input class="form-input" name="sku_code" required value="${escapeHtml(sku?.sku_code||'')}" ${sku?'readonly':''}></div>
      <div class="form-group"><label class="form-label">名称 <span class="req">*</span></label><input class="form-input" name="name" required value="${escapeHtml(sku?.name||'')}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">分类</label><input class="form-input" name="category" value="${escapeHtml(sku?.category||'')}"></div>
        <div class="form-group"><label class="form-label">单位</label><input class="form-input" name="unit" value="${escapeHtml(sku?.unit||'个')}"></div>
      </div>
      <div class="form-group"><label class="form-label">描述</label><textarea class="form-textarea" name="description" style="min-height:70px">${escapeHtml(sku?.description||'')}</textarea></div>
      ${sku?`<div class="form-group"><label class="form-label">是否激活</label><select class="form-select" name="is_active"><option value="true" ${sku.is_active?'selected':''}>是</option><option value="false" ${!sku.is_active?'selected':''}>否</option></select></div>`:''}
    </form>`;
  const btnSave=document.createElement('button'); btnSave.className='btn btn-primary'; btnSave.textContent='保存';
  const btnCancel=document.createElement('button'); btnCancel.className='btn btn-ghost'; btnCancel.textContent='取消'; btnCancel.onclick=closeModal;
  btnSave.onclick=async()=>{
    const form=$('#skuForm'); if(!form.reportValidity()) return;
    const fd=new FormData(form);
    const data={sku_code:fd.get('sku_code'),name:fd.get('name')};
    ['category','unit','description'].forEach(k=>{const v=fd.get(k); if(v) data[k]=v;});
    if(sku){const ia=fd.get('is_active'); if(ia!=null) data.is_active=ia==='true';}
    btnSave.disabled=true; btnSave.innerHTML='<span class="spinner"></span> 保存中';
    try{
      if(sku){ await apiRequest(`/skus/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); toast('SKU 已更新','success'); }
      else{ await apiRequest(`/skus/`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); toast('SKU 已创建','success'); }
      closeModal(); loadSkus();
    }catch(e){ toast(e.message||'保存失败','error'); }finally{ btnSave.disabled=false; btnSave.textContent='保存'; }
  };
  openModal({title:sku?'编辑 SKU':'新增 SKU', body, footer:[btnCancel,btnSave]});
}
function deleteSku(id){
  confirmDialog({title:'删除 SKU',message:`确认删除 SKU #${id}？此操作不可恢复。`,confirmText:'删除',onConfirm:async()=>{
    await apiRequest(`/skus/${id}`,{method:'DELETE'}); toast('已删除','success'); loadSkus();
  }});
}

function showVideoUpload(){
  const body = `
    <form id="videoForm">
      <div class="form-group">
        <label class="form-label">选择视频文件 <span class="req">*</span></label>
        <div class="upload-zone" id="videoDrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><div id="videoFileName">点击选择或拖拽视频到此处</div></div>
        <input type="file" name="file" id="videoFile" accept="video/*" style="display:none" required>
      </div>
      <div class="upload-progress hide" id="videoProg"><div class="bar" style="width:0%"></div></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">纬度</label><input class="form-input" type="number" step="0.000001" name="latitude"></div>
        <div class="form-group"><label class="form-label">经度</label><input class="form-input" type="number" step="0.000001" name="longitude"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">高度</label><input class="form-input" type="number" step="0.1" name="altitude"></div>
        <div class="form-group"><label class="form-label">关联无人机ID</label><input class="form-input" type="number" name="drone_id"></div>
      </div>
      <div class="form-group"><label class="form-label">描述</label><input class="form-input" name="description"></div>
    </form>`;
  const btnSave=document.createElement('button'); btnSave.className='btn btn-primary'; btnSave.innerHTML=ICON.upload+'<span>上传</span>';
  const btnCancel=document.createElement('button'); btnCancel.className='btn btn-ghost'; btnCancel.textContent='取消'; btnCancel.onclick=closeModal;
  openModal({title:'上传视频', body, footer:[btnCancel,btnSave]});
  const fileInput=$('#videoFile'); const drop=$('#videoDrop'); const nameEl=$('#videoFileName');
  drop.onclick=()=>fileInput.click();
  drop.ondragover=e=>{e.preventDefault(); drop.classList.add('dragover');};
  drop.ondragleave=()=>drop.classList.remove('dragover');
  drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('dragover'); if(e.dataTransfer.files.length){fileInput.files=e.dataTransfer.files; nameEl.textContent=e.dataTransfer.files[0].name;}};
  fileInput.onchange=()=>{ if(fileInput.files.length) nameEl.textContent=fileInput.files[0].name; };
  btnSave.onclick=async()=>{
    const form=$('#videoForm');
    if(!fileInput.files.length){ toast('请选择视频文件','warn'); return; }
    const fd=new FormData(form);
    // 确保空数值字段不提交无效值
    ['latitude','longitude','altitude','drone_id'].forEach(k=>{ if(fd.get(k)==='') fd.delete(k); });
    btnSave.disabled=true; btnSave.innerHTML='<span class="spinner"></span> 上传中';
    const prog=$('#videoProg'); prog.classList.remove('hide');
    try{
      const xhr=new XMLHttpRequest();
      xhr.open('POST', CONFIG.API_BASE+'/videos/');
      xhr.setRequestHeader('Authorization', `Bearer ${getToken()}`);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100); prog.querySelector('.bar').style.width=pct+'%';} };
      const result = await new Promise((resolve,reject)=>{
        xhr.onload=()=>{ if(xhr.status>=200&&xhr.status<300){ try{resolve(JSON.parse(xhr.responseText));}catch(e){resolve(null);} } else { let m='上传失败'; try{const d=JSON.parse(xhr.responseText); m=d.message||d.detail||m;}catch(e){} reject(new Error(m)); } };
        xhr.onerror=()=>reject(new Error('网络错误'));
        xhr.send(fd);
      });
      toast('视频上传成功','success');
      closeModal(); loadVideos();
    }catch(e){ toast(e.message||'上传失败','error'); prog.classList.add('hide'); }
    finally{ btnSave.disabled=false; btnSave.innerHTML=ICON.upload+'<span>上传</span>'; }
  };
}
function deleteVideo(id){
  confirmDialog({title:'删除视频',message:`确认删除视频 #${id}？文件将一并删除，不可恢复。`,confirmText:'删除',onConfirm:async()=>{
    await apiRequest(`/videos/${id}`,{method:'DELETE'}); toast('已删除','success'); loadVideos();

}

/* ========== 巡检数据 ========== */
/** 巡检状态徽章 */
function inspStatusBadge(status){
  const s = String(status||'').toLowerCase();
  let cls='badge-gray', label=status||'-';
  if(s==='completed'||s==='complete'){ cls='badge-green'; label='已完成'; }
  else if(s==='in_progress'||s==='running'){ cls='badge-blue'; label='进行中'; }
  else if(s==='pending'){ cls='badge-yellow'; label='待处理'; }
  else if(s==='cancelled'||s==='canceled'){ cls='badge-red'; label='已取消'; }
  else if(s==='archived'){ cls='badge-secondary'; label='已归档'; }
  return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
}

/** QR-RFID 交叉校验徽章 */
function crossValBadge(qrRfidMatch){
  if(qrRfidMatch===true) return '<span class="badge badge-green">匹配</span>';
  if(qrRfidMatch===false) return '<span class="badge badge-red">不匹配</span>';
  return '<span class="badge badge-gray">待校验</span>';
}

/** 解析异常标签数量 */
function abnormalCount(json){
  if(!json) return 0;
  try{
    const arr = typeof json==='string'?JSON.parse(json):json;
    return Array.isArray(arr)?arr.length:0;
  }catch(e){ return 0; }
}

/** 构建树节点 HTML */
function buildTreeNode(type, data, children){
  const hasChildren = children && children.length>0;
  const toggleCls = hasChildren?'insp-toggle':'insp-toggle leaf';
  let label='', detail='', extraBadges='';

  if(type==='session'){
    label = escapeHtml(data.session_code||`Session#${data.id}`);
    detail = `${formatDate(data.start_time)} ~ ${formatDate(data.end_time)} | 任务 ${data.completed_tasks||0}/${data.total_tasks||0}`;
  }else if(type==='task'){
    label = escapeHtml(data.task_code||`Task#${data.id}`);
    const tname = data.task_name?` ${escapeHtml(data.task_name)}`:'';
    label += tname;
    detail = `航点 ${data.completed_waypoints||0}/${data.total_waypoints||0}`;
  }else if(type==='waypoint'){
    label = escapeHtml(data.waypoint_id||`WP#${data.id}`);
    const coords = [];
    if(data.x!=null) coords.push(`x=${data.x}`);
    if(data.y!=null) coords.push(`y=${data.y}`);
    if(data.z!=null) coords.push(`z=${data.z}`);
    if(coords.length) detail = coords.join(' ');
    if(data.reached_at) detail += ` | ${formatDate(data.reached_at)}`;
  }else if(type==='record'){
    label = escapeHtml(data.record_code||`Rec#${data.id}`);
    extraBadges = crossValBadge(data.qr_rfid_match);
    const ac = abnormalCount(data.abnormal_tags_json);
    if(ac>0) extraBadges += ` <span class="badge badge-yellow">异常[${ac}]</span>`;
    if(data.inspection_time) detail = formatDate(data.inspection_time);
  }else if(type==='video'){
    label = `🎬 ${escapeHtml(data.file_name||`Video#${data.id}`)}`;
    const sizeStr = data.file_size ? ` | ${(data.file_size/1024/1024).toFixed(1)}MB` : '';
    const qrStr = data.qr_recognized ? ` | QR:${(data.qr_codes||[]).length}个` : '';
    detail = `${formatDate(data.captured_at)}${sizeStr}${qrStr}`;
    if(data.qr_recognized) extraBadges = ' <span class="badge badge-green">QR已识别</span>';
  }else if(type==='inventory'){
    label = `📦 ${escapeHtml(data.sku||`Item#${data.id}`)}`;
    detail = data.source_qr_data ? `来源: QR` : '';
    const statusMap = {normal:'badge-green',misplaced:'badge-yellow',missing:'badge-red',extra:'badge-blue',duplicate:'badge-yellow'};
    if(data.status) extraBadges = ` <span class="badge ${statusMap[data.status]||'badge-gray'}">${escapeHtml(data.status)}</span>`;
  }

  let html = `<div class="insp-node" data-type="${type}">`;
  html += `<div class="insp-node-head">`;
  html += `<span class="${toggleCls}">${hasChildren?'\u25B6':''}</span>`;
  html += `<span class="insp-node-label">${label}</span>`;
  html += inspStatusBadge(data.status);
  if(detail) html += `<span class="insp-node-detail">${detail}</span>`;
  if(extraBadges) html += extraBadges;
  html += `</div>`;

  if(hasChildren){
    html += `<div class="insp-node-children">`;
    children.forEach(c=>{ html += c; });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

/** 从 tree API 数据构建完整树 HTML */
function buildTreeHtml(treeData){
  if(!treeData) return '<div class="table-empty">无树状数据</div>';
  const session = treeData.session || treeData;
  const tasks = treeData.tasks || [];

  // 记录按 task_code 分组
  const recordsByTask = {};
  (treeData.records||[]).forEach(r=>{
    const tc = r.task_code || '';
    if(!recordsByTask[tc]) recordsByTask[tc]=[];
    recordsByTask[tc].push(r);
  });

  // 视频按 task_code 分组
  const videosByTask = {};
  (treeData.videos||[]).forEach(v=>{
    const tc = v.task_code || '';
    if(!videosByTask[tc]) videosByTask[tc]=[];
    videosByTask[tc].push(v);
  });

  // 库存物品按 task_id 分组
  const invByTask = {};
  (treeData.inventory_items||[]).forEach(item=>{
    const tc = item.task_id || '';
    if(!invByTask[tc]) invByTask[tc]=[];
    invByTask[tc].push(item);
  });

  const taskNodes = tasks.map(t=>{
    const taskCode = t.task?.task_code || t.task_code;
    const waypoints = t.waypoints || [];

    // Task 下的视频叶子
    const taskVideos = (videosByTask[taskCode]||[]).map(v=> buildTreeNode('video', v, null));
    // Task 下的库存物品叶子
    const taskInv = (invByTask[taskCode]||[]).map(item=> buildTreeNode('inventory', item, null));

    const wpNodes = waypoints.map(wp=>{
      // 航点下的记录：简单匹配（按 waypoint_id）
      const wpRecords = (recordsByTask[taskCode]||[]).filter(r=>{
        return r.waypoint_id === wp.waypoint_id || r.waypoint_id === wp.id;
      });
      const recNodes = wpRecords.map(r=> buildTreeNode('record', r, null));
      return buildTreeNode('waypoint', wp, recNodes);
    });

    // 合并所有子节点：航点 + 视频 + 库存物品
    const allChildren = [...wpNodes, ...taskVideos, ...taskInv];
    return buildTreeNode('task', t.task||t, allChildren);
  });

  return buildTreeNode('session', session, taskNodes);
}

/** 绑定树节点展开/折叠 */
function bindTreeToggle(container){
  $$('.insp-node-head', container).forEach(head=>{
    head.onclick = (e)=>{
      const node = head.parentElement;
      const children = node.querySelector(':scope > .insp-node-children');
      if(!children) return;
      const toggle = head.querySelector('.insp-toggle');
      const isOpen = children.classList.toggle('open');
      if(toggle) toggle.classList.toggle('open', isOpen);
    };
  });
}

/** 巡检数据页面状态 */
const inspState = {
  sessions: [],
  selectedId: null,
  statusFilter: '',
  startDate: '',
  endDate: '',
  stats: { total:0, inProgress:0, records:0, abnormal:0 },
};

/** 加载巡检统计 */
async function loadInspStats(){
  try{
    const [sessions, records] = await Promise.all([
      apiRequest('/inspections/sessions?limit=1000'),
      apiRequest('/inspections/records?limit=1000'),
    ]);
    inspState.stats.total = sessions.length;
    inspState.stats.inProgress = sessions.filter(s=>String(s.status).toLowerCase()==='in_progress').length;
    inspState.stats.records = records.length;
    inspState.stats.abnormal = records.filter(r=>r.qr_rfid_match===false).length;
  }catch(e){
    // 静默失败，统计显示为 -
  }
}

/** 加载巡检会话列表 */
async function loadInspSessions(){
  const wrap = document.getElementById('inspSessions');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading-center"><span class="spinner"></span> 加载中</div>';
  try{
    let path = `/inspections/sessions?skip=0&limit=50`;
    if(inspState.statusFilter) path += `&status=${encodeURIComponent(inspState.statusFilter)}`;
    inspState.sessions = await apiRequest(path);
    // 日期筛选（前端过滤，API 无日期参数）
    let filtered = inspState.sessions;
    if(inspState.startDate){
      filtered = filtered.filter(s=> s.start_time && s.start_time >= inspState.startDate);
    }
    if(inspState.endDate){
      filtered = filtered.filter(s=> s.start_time && s.start_time <= inspState.endDate + 'T23:59:59');
    }
    inspState.sessions = filtered;

    if(filtered.length===0){
      wrap.innerHTML = '<div class="table-empty">暂无巡检会话</div>';
      return;
    }
    let html = '';
    filtered.forEach(s=>{
      const active = s.id===inspState.selectedId?' active':'';
      html += `<div class="insp-session-row${active}" data-id="${s.id}">`;
      html += `<div class="code">${escapeHtml(s.session_code||'--')} ${inspStatusBadge(s.status)}`;
      if(s.status==='archived'){
        html += ` <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();unarchiveSession(${s.id})" title="取消归档">恢复</button>`;
      } else {
        html += ` <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();archiveSession(${s.id})" title="归档此会话">归档</button>`;
      }
      html += `</div>`;
      html += `<div class="meta">`;
      html += `<span>${formatDate(s.start_time)}</span>`;
      html += `<span>任务 ${s.completed_tasks||0}/${s.total_tasks||0}</span>`;
      if(s.notes) html += `<span>${escapeHtml(s.notes)}</span>`;
      html += `</div></div>`;
    });
    wrap.innerHTML = html;
    // 绑定点击
    $$('.insp-session-row', wrap).forEach(row=>{
      row.onclick = ()=> loadInspTree(parseInt(row.dataset.id));
    });
  }catch(e){
    wrap.innerHTML = `<div class="table-empty">加载失败：${escapeHtml(e.message)}</div>`;
    toast(e.message,'error');
  }
}

/** 加载选中会话的树状结构 */
async function loadInspTree(sessionId){
  inspState.selectedId = sessionId;
  // 更新左侧选中态
  $$('.insp-session-row').forEach(r=>{
    r.classList.toggle('active', parseInt(r.dataset.id)===sessionId);
  });
  const treeWrap = document.getElementById('inspTree');
  if(!treeWrap) return;
  treeWrap.innerHTML = '<div class="loading-center"><span class="spinner"></span> 加载中</div>';
  try{
    const treeData = await apiRequest(`/inspections/sessions/${sessionId}/tree`);
    treeWrap.innerHTML = buildTreeHtml(treeData);
    bindTreeToggle(treeWrap);
  }catch(e){
    treeWrap.innerHTML = `<div class="table-empty">加载树状结构失败：${escapeHtml(e.message)}</div>`;
    toast(e.message,'error');
  }
}

let wsState = { ws:null, connected:false, pingTimer:null, log:[] };
async function renderMonitor(){
  const content=$('#content');
  content.innerHTML = makeToolbar({title:'实时监控', desc:'WebSocket 连接状态与实时数据流'});
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`
    <div class="card-title">WebSocket 监控
      <div class="flex gap-sm">
        <div class="ws-status"><span class="ws-dot disconnected" id="wsDot"></span><span id="wsStateText">未连接</span></div>
        <button class="btn btn-primary btn-sm" id="btnWsConnect">${ICON.refresh}连接</button>
        <button class="btn btn-secondary btn-sm" id="btnWsDisconnect">断开</button>
      </div>
    </div>
    <div class="grid-2 mb-16">
      <div><div class="form-label">Ping 延迟</div><div id="wsPing" class="mono" style="font-size:16px">-</div></div>
      <div><div class="form-label">已接收消息数</div><div id="wsMsgCount" class="mono" style="font-size:16px">0</div></div>
    </div>
    <div class="form-group">
      <label class="form-label">订阅频道</label>
      <div class="flex">
        <input class="form-input" id="wsChannel" placeholder="如：video_streams、notifications" value="video_streams">
        <button class="btn btn-secondary" id="btnSubscribe">订阅</button>
        <button class="btn btn-ghost" id="btnUnsubscribe">取消订阅</button>
      </div>
    </div>
    <div class="form-label">消息日志</div>
    <div class="log-box" id="wsLog"></div>`;
  content.appendChild(card);
  $('#btnWsConnect').onclick=wsConnect;
  $('#btnWsDisconnect').onclick=wsDisconnect;
  $('#btnSubscribe').onclick=()=>{ const ch=$('#wsChannel').value.trim(); if(ch) wsSend({type:'subscribe',channel:ch}); };
  $('#btnUnsubscribe').onclick=()=>{ const ch=$('#wsChannel').value.trim(); if(ch) wsSend({type:'unsubscribe',channel:ch}); };
  wsState.log=[]; updateWsLog();
  // 自动连接
  wsConnect();
}
function wsConnect(){
  if(wsState.ws && (wsState.ws.readyState===WebSocket.OPEN||wsState.ws.readyState===WebSocket.CONNECTING)) return;
  try{
    wsState.ws = new WebSocket(CONFIG.WS_BASE);
  }catch(e){ toast('WebSocket 连接失败：'+e.message,'error'); return; }
  wsState.ws.onopen=()=>{
    wsState.connected=true;
    $('#wsDot').className='ws-dot connected';
    $('#wsStateText').textContent='已连接';
    addWsLog('WebSocket 已连接');
    // 启动心跳
    wsState.pingTimer=setInterval(()=>{
      const t0=Date.now();
      wsSend({type:'ping'});
      // pong 在 onmessage 中匹配
      wsState._pingT0=t0;
    },5000);
  };
  wsState.ws.onmessage=(ev)=>{
    let msg=ev.data; let obj=null;
    try{ obj=JSON.parse(msg); }catch(e){}
    if(obj && obj.type==='pong' && wsState._pingT0){
      const latency=Date.now()-wsState._pingT0;
      $('#wsPing').textContent=latency+' ms';
      wsState._pingT0=null;
    }
    if(obj && obj.type==='connected' && obj.client_id){
      addWsLog(`已分配客户端ID：${obj.client_id}`);
    }
    wsState.log.push(obj?JSON.stringify(obj):String(msg));
    updateWsLog();
  };
  wsState.ws.onerror=()=>{ addWsLog('WebSocket 错误'); };
  wsState.ws.onclose=()=>{
    wsState.connected=false;
    $('#wsDot').className='ws-dot disconnected';
    $('#wsStateText').textContent='未连接';
    if(wsState.pingTimer){ clearInterval(wsState.pingTimer); wsState.pingTimer=null; }
    addWsLog('WebSocket 已断开');
  };
}
function wsDisconnect(){
  if(wsState.ws){ wsState.ws.close(); wsState.ws=null; }
  if(wsState.pingTimer){ clearInterval(wsState.pingTimer); wsState.pingTimer=null; }
}
function wsSend(obj){
  if(wsState.ws && wsState.ws.readyState===WebSocket.OPEN){
    wsState.ws.send(JSON.stringify(obj));
  }else{ toast('WebSocket 未连接','warn'); }
}
function addWsLog(msg){
  wsState.log.push(`[${formatDate(new Date().toISOString())}] ${msg}`);
  if(wsState.log.length>200) wsState.log=wsState.log.slice(-200);
  updateWsLog();
}
function updateWsLog(){
  const el=$('#wsLog'); if(!el) return;
  const count=$('#wsMsgCount'); if(count) count.textContent=wsState.log.length;
  el.innerHTML = wsState.log.slice(-100).reverse().map(l=>{
    const m=String(l);
    return `<div class="log-line"><span class="log-time">${escapeHtml(m.slice(0,23))}</span> <span class="log-msg">${escapeHtml(m.slice(23))}</span></div>`;
  }).join('');
}

/**
 * warehouse 业务状态徽章
 * 沿用 warehouse 的 status→color 语义映射，颜色适配 drone-db 的 badge 样式
 * (success→green, info→blue, muted→gray, warning→yellow, danger→red)
 * @param {string} status - 状态文本
 * @param {Object} [map] - 自定义 status→color 覆盖
 */
function whBadge(status, map){
  const m = map || {
    online:'green', flying:'blue', offline:'gray', maintenance:'yellow',
    running:'blue', finished:'green', cancelled:'gray', created:'yellow',
    completed:'green', pending:'yellow', abnormal:'red', in_progress:'blue',
    processing:'blue', processed:'green', failed:'red',
    normal:'green', misplaced:'yellow', missing:'red', extra:'red', duplicate:'yellow',
    成功:'green', 失败:'red', 已停止:'gray', 扫描中:'blue',
  };
  const c = m[status] || 'gray';
  return `<span class="badge badge-${c}">${escapeHtml(status==null?'-':status)}</span>`;
}

async function inboundLoadStatus(){
  try{
    const r = await whRequest('/inbound/status');
    const d = r.data || r;
    const running = d.running;
    const elRun = $('#ibRunning');
    if(elRun){
      elRun.textContent = running ? '扫描中...' : '已停止';
      elRun.style.color = running ? 'var(--green)' : 'var(--red)';
    }
    text($('#ibScanned'), d.tags_scanned || 0);
    text($('#ibCreated'), d.records_created || 0);
    text($('#ibErrors'), d.errors || 0);
    const btnStart = $('#ibBtnStart'), btnStop = $('#ibBtnStop');
    if(btnStart) btnStart.style.display = running ? 'none' : '';
    if(btnStop) btnStop.style.display = running ? '' : 'none';
    const elTime = $('#ibTime');
    if(elTime) elTime.textContent = running && d.started_at ? '开始于: ' + new Date(d.started_at).toLocaleTimeString() : '';
    if(running){
      if(!inboundAutoRefresh) inboundAutoRefresh = setInterval(inboundAutoRefreshAll, 2000);
    }else if(inboundAutoRefresh){
      clearInterval(inboundAutoRefresh); inboundAutoRefresh = null;
    }
  }catch(e){ /* 状态轮询失败静默，避免 toast 刷屏 */ }
}

async function inboundAutoRefreshAll(){
  await inboundLoadStatus();
  inboundLoadRecords();
  inboundLoadInventory();
}

async function testQR(){

  const result = $('#gwQrResult');
  if(!path){ toast('请输入图像路径','error'); return; }
  result.innerHTML = '<span class="spinner"></span> 识别中...';
  try{
    const res = await whRequest('/gateway/qrcode/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_path:path})});
    const codes = res.codes || res.data?.codes || [];
    const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;vertical-align:middle"><polyline points="20 6 9 17 4 12"/></svg>';
    result.innerHTML = codes.length
      ? codes.map(c=>`<div class="cell-mono" style="color:var(--green)">${checkSvg} ${escapeHtml(c)}</div>`).join('')
      : '<div>未识别到二维码</div>';
  }catch(e){
    result.innerHTML = `<div style="color:var(--red)">${escapeHtml(e.message)}</div>`;
  }
}

  const result = $('#gwRfidResult');
  result.innerHTML = '<span class="spinner"></span> 读取中...';
  try{
    const res = await whRequest(`/gateway/rfid/read?drone_code=${encodeURIComponent(drone)}`,{method:'POST'});
    result.innerHTML = `<div style="color:var(--green)">${escapeHtml(res.message||'读取完成')}</div>`;
  }catch(e){
    result.innerHTML = `<div style="color:var(--red)">${escapeHtml(e.message)}</div>`;
  }
}

async function rfidDashRefresh(){
  await Promise.all([rfidDashLoadStats(), rfidDashLoadHistory(true)]);
}

async function rfidDashPoll(){
  // 页面已切走则自动清理定时器，避免后台空转请求
  if(!$('#rfdConnected')){
    if(_rfidDashTimer){ clearInterval(_rfidDashTimer); _rfidDashTimer = null; }
    return;
  }
  await rfidDashLoadStats();
  await rfidDashLoadHistory(false);
}

async function rfidDashLoadStats(){
  try{
    const r = await whRequest('/rfid/scan/stats');
    const d = r.data || r;
    const connected = d.connected;
    const scanning = d.scanning;
    const elConn = $('#rfdConnected');
    if(elConn){
      elConn.textContent = connected ? '已连接' : '未连接';
      elConn.style.color = connected ? 'var(--green)' : 'var(--red)';
    }
    const elMode = $('#rfdMode');
    if(elMode){
      elMode.textContent = scanning ? '自动扫描中' : (connected ? '已就绪' : '未连接');
      elMode.style.color = scanning ? 'var(--green)' : '';
    }
    text($('#rfdTotal'), d.total_events || 0);
    text($('#rfdUnique'), d.unique_tags || 0);
    const elLatest = $('#rfdLatest');
    if(elLatest){
      elLatest.textContent = d.latest_event_time
        ? new Date(d.latest_event_time * 1000).toLocaleTimeString('zh-CN', {hour12:false})
        : '-';
    }
    const btnStart = $('#rfdBtnStart'), btnStop = $('#rfdBtnStop');
    if(btnStart) btnStart.style.display = scanning ? 'none' : '';
    if(btnStop) btnStop.style.display = scanning ? '' : 'none';
    const bd = $('#rfdBreakdown');
    if(bd){
      bd.innerHTML = `
        <div style="padding:10px;background:var(--bg);border-radius:6px"><div style="font-size:11px;color:var(--text2)">自动扫描</div><div style="font-size:18px;color:var(--green);font-weight:600">${d.auto_count||0}</div></div>
        <div style="padding:10px;background:var(--bg);border-radius:6px"><div style="font-size:11px;color:var(--text2)">单次扫描</div><div style="font-size:18px;color:var(--blue);font-weight:600">${d.single_count||0}</div></div>
        <div style="padding:10px;background:var(--bg);border-radius:6px"><div style="font-size:11px;color:var(--text2)">手动触发</div><div style="font-size:18px;color:var(--yellow);font-weight:600">${d.manual_count||0}</div></div>
        <div style="padding:10px;background:var(--bg);border-radius:6px"><div style="font-size:11px;color:var(--text2)">总事件数</div><div style="font-size:18px;font-weight:600">${d.total_events||0}</div></div>
        <div style="padding:10px;background:var(--bg);border-radius:6px"><div style="font-size:11px;color:var(--text2)">唯一标签</div><div style="font-size:18px;color:var(--green);font-weight:600">${d.unique_tags||0}</div></div>`;
    }
  }catch(e){ /* 状态轮询失败静默，避免 toast 刷屏 */ }
}

async function rfidDashLoadHistory(full){
  try{
    const url = `/rfid/scan/history?limit=${full?200:100}&since=${full?0:_rfidDashLastTs}`;
    const r = await whRequest(url);
    const events = r.data?.events || r.events || [];
    if(events.length===0 && !full) return;
    if(full){
      _rfidDashEvents = events;
    }else{
      // 增量合并：events 最新在顶，倒序追加到本地缓存顶部
      for(const e of events) _rfidDashEvents.unshift(e);
      if(_rfidDashEvents.length > 500) _rfidDashEvents.length = 500;
    }
    // 更新增量游标（取本地最新事件的 read_time）
    if(_rfidDashEvents.length > 0) _rfidDashLastTs = _rfidDashEvents[0].read_time || 0;
    rfidDashRenderTable();
  }catch(e){ /* ignore */ }
}

function rfidDashRenderTable(){
  const tbody = $('#rfdTbody');
  if(!tbody) return;
  const countEl = $('#rfdCount');
  if(countEl) countEl.textContent = `${_rfidDashEvents.length} 条`;
  if(_rfidDashEvents.length === 0){
    tbody.innerHTML = '<tr><td colspan="6" class="table-empty">暂无扫描事件</td></tr>';
    return;
  }
  const modeMap = {
    auto: '<span class="badge badge-green">自动</span>',
    single: '<span class="badge badge-blue">单次</span>',
    manual: '<span class="badge badge-yellow">手动</span>'
  };
  tbody.innerHTML = _rfidDashEvents.map(e=>{
    const rssiColor = e.rssi!=null && e.rssi > -60 ? 'var(--green)' : (e.rssi!=null && e.rssi > -75 ? 'var(--yellow)' : 'var(--red)');
    const pc = e.pc!=null ? '0x' + escapeHtml(Number(e.pc).toString(16).toUpperCase().padStart(4,'0')) : '-';
    const crc = e.crc!=null ? '0x' + escapeHtml(Number(e.crc).toString(16).toUpperCase().padStart(4,'0')) : '-';
    return `<tr>
      <td style="font-size:12px">${escapeHtml(formatDate(e.read_time_iso))}</td>
      <td class="cell-mono" style="font-size:12px">${escapeHtml(e.tag_id || '-')}</td>
      <td style="font-size:12px;color:${rssiColor}">${e.rssi!=null ? escapeHtml(e.rssi+' dBm') : '-'}</td>
      <td class="cell-mono" style="font-size:11px">${pc}</td>
      <td class="cell-mono" style="font-size:11px">${crc}</td>
      <td>${modeMap[e.mode] || escapeHtml(e.mode || '-')}</td>
    </tr>`;
  }).join('');
  // 自动滚动到顶部（最新事件在顶）
  const autoScroll = $('#rfdAutoscroll');
  const wrap = $('#rfdTableWrap');
  if(autoScroll && autoScroll.checked && wrap) wrap.scrollTop = 0;
}

async function rfidDashSingle(){
  const btn = $('#rfdBtnSingle');
  if(!btn) return;
  const original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 扫描中...';
  try{
    const r = await whRequest('/rfid/read', {method:'POST'});
    const d = r.data || r;
    if(d && d.tag_id){
      toast(`读取成功: EPC=${d.tag_id}, RSSI=${d.rssi} dBm`, 'success');
    }else{
      toast(r.message || '未扫描到标签', 'warn');
    }
    await rfidDashRefresh();
  }catch(ex){
    toast(ex.message, 'error');
  }finally{
    btn.disabled = false; btn.innerHTML = original;
  }
}

async function rfidDashAuto(enable){
  try{
    const r = await whRequest('/rfid/scan/auto', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enable})});
    toast(r.message || (enable?'已启动':'已停止'), 'success');
    await rfidDashLoadStats();
  }catch(ex){
    toast(ex.message, 'error');
  }
}

function rfidDashClearHistory(){
  confirmDialog({
    title:'清空扫描历史', confirmText:'清空',
    message:'确认清空扫描历史？此操作不影响已扫描标签缓存。',
    onConfirm: async ()=>{
      const r = await whRequest('/rfid/scan/clear-history', {method:'POST'});
      toast(r.message || '已清空', 'success');
      _rfidDashEvents = [];
      _rfidDashLastTs = 0;
      rfidDashRenderTable();
      await rfidDashLoadStats();
    }
  });
}

/* ---------- RFID 设置 Actions ---------- */
async function rfidRefreshStatus(){
  try{
    const res = await whRequest('/rfid/status');
    const d = res.data || res;
    const connected = d.connected;
    const elConn = $('#rfsConnected');
    if(elConn){
      elConn.textContent = connected ? '已连接' : '未连接';
      elConn.style.color = connected ? 'var(--green)' : 'var(--red)';
    }
    text($('#rfsPort'), d.port || '-');
    text($('#rfsPower'), d.power_dbm ? d.power_dbm + ' dBm' : '- dBm');
    const elScan = $('#rfsScanning');
    if(elScan){
      elScan.textContent = d.scanning ? '运行中' : '已停止';
      elScan.style.color = d.scanning ? 'var(--green)' : '';
    }
    const btnConn = $('#rfsBtnConnect'), btnDisc = $('#rfsBtnDisconnect');
    if(btnConn) btnConn.style.display = connected ? 'none' : '';
    if(btnDisc) btnDisc.style.display = connected ? '' : 'none';
    if(connected && d.port){
      const sel = $('#rfsPortSelect');
      if(sel){
        if(![...sel.options].some(o => o.value === d.port)){
          const opt = document.createElement('option');
          opt.value = d.port; opt.textContent = d.port; opt.selected = true;
          sel.appendChild(opt);
        }else{
          sel.value = d.port;
        }
      }
    }
  }catch(e){ /* ignore */ }
}

async function rfidScanPorts(){
  try{
    const res = await whRequest('/rfid/ports');
    const ports = res.data?.ports || res.ports || [];
    const sel = $('#rfsPortSelect');
    if(!sel) return;
    const current = sel.value;
    sel.innerHTML = '';
    if(ports.length === 0){
      sel.innerHTML = '<option value="">未检测到串口</option>';
      toast('未检测到可用串口，请检查硬件连接', 'warn');
    }else{
      ports.forEach(p=>{
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
      sel.value = ports.includes(current) ? current : ports[0];
      toast(`发现 ${ports.length} 个串口: ${ports.join(', ')}`, 'success');
    }
  }catch(ex){ toast(ex.message, 'error'); }
}

async function rfidConnect(){
  const sel = $('#rfsPortSelect');
  if(!sel || !sel.value){ toast('请先扫描并选择串口', 'warn'); return; }
  const port = sel.value;
  const baudrate = parseInt($('#rfsBaudrate').value);
  try{
    const r = await whRequest('/rfid/connect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({port, baudrate})});
    if(r.success === false){ toast(r.message || '连接失败', 'error'); }
    else { toast('RFID 已连接', 'success'); }
    setTimeout(rfidRefreshStatus, 500);
  }catch(ex){ toast(ex.message, 'error'); }
}

function diSetStep(n) {
  diStep = n;
  document.querySelectorAll('.di-step').forEach(el => {
    const active = el.dataset.step == n;
    el.style.color = active ? 'var(--primary)' : 'var(--text2)';
    el.style.fontWeight = active ? '600' : '400';
    const num = el.querySelector('.di-num');
    if (num) {
      num.style.background = active ? 'var(--primary)' : 'var(--border)';
      num.style.color = active ? '#fff' : 'var(--text)';
    }
  });
  document.querySelectorAll('.di-panel').forEach(el => el.style.display = el.dataset.step == n ? 'block' : 'none');
  if (n === 6) { diLoadTasks(); diRefreshTaskList(); diLoadShelves(); }
  if (n === 7) { diLoadMonitor(); diLoadLogs(); }
}

    box.innerHTML = `<span style="color:var(--red);font-size:11px;">加载失败: ${escapeHtml(e.message)}</span>`;
  }
}

// ── Step 1: 网络连接验证 ──
async function diVerifyNetwork() {
  const btn = document.getElementById('di-btn-net');
  btn.disabled = true; btn.textContent = '验证中...';
  const result = document.getElementById('di-net-result');
  result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">正在检测网络连通性...</div>';
  try {
    const src = document.getElementById('di-src-ip').value;
    const dst = document.getElementById('di-dst-ip').value;
    const ports = document.getElementById('di-ports').value;
    const r = await whRequest(`/drone-integration/network/verify?drone_ip=${encodeURIComponent(dst)}&base_station_ip=${encodeURIComponent(src)}${ports?'&ports='+encodeURIComponent(ports):''}`, {method:'POST'});
    const d = r.data || {};
    const portRows = (d.open_ports||[]).map(p => `<tr><td>${escapeHtml(p.port)}</td><td>${escapeHtml(p.service||'-')}</td><td>${whBadge(p.is_open?'开放':'关闭',{开放:'green',关闭:'red'})}</td><td>${p.response_ms!=null?p.response_ms.toFixed(1)+'ms':'-'}</td></tr>`).join('');
    result.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:${d.ping?.success?'var(--green)':'var(--red)'}">${d.ping?.success?'可达':'不可达'}</div><div class="label">Ping</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num">${d.ping?.response_time_ms!=null?d.ping.response_time_ms.toFixed(1)+'ms':'-'}</div><div class="label">响应时间</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:${d.packet_loss_percent===0?'var(--green)':d.packet_loss_percent<50?'var(--yellow)':'var(--red)'}">${d.packet_loss_percent}%</div><div class="label">丢包率</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:${d.stability==='stable'?'var(--green)':d.stability==='unstable'?'var(--yellow)':'var(--red)'}">${d.stability==='stable'?'稳定':d.stability==='unstable'?'不稳定':'差'}</div><div class="label">稳定性</div></div></div>
      </div>
      <div class="card" style="margin-top:12px;"><div class="card-title"><span>端口扫描结果</span></div>
      <div class="table-wrap"><table><thead><tr><th>端口</th><th>服务</th><th>状态</th><th>响应</th></tr></thead><tbody>${portRows||'<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--muted);">无端口数据</td></tr>'}</tbody></table></div></div>
      <div style="margin-top:12px;padding:10px;background:var(--border);border-radius:var(--radius);font-size:12px;color:var(--text2);">${escapeHtml(d.summary||'')}</div>
      ${d.ping?.success ? '<div style="margin-top:12px;text-align:right;"><button class="btn btn-primary" onclick="diNext()">下一步 →</button></div>' : ''}`;
    if (d.ping?.success) toast('网络连接验证通过', 'success');
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;text-align:center;">验证失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '开始验证'; }
}

// ── Step 2: 设备发现 ──
async function diDiscover() {
  const btn = document.getElementById('di-btn-discover');
  btn.disabled = true; btn.textContent = '扫描中...';
  const result = document.getElementById('di-discover-result');
  result.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">正在扫描 192.168.1.x 网段 (1-254)...</div>';
  try {
    const subnet = document.getElementById('di-subnet').value;
    const r = await whRequest(`/drone-integration/discover?subnet=${encodeURIComponent(subnet)}`, {method:'POST'});
    const d = r.data || {};
    const renderDevices = (list, title, color) => list.length ? `
      <div style="margin-top:12px;"><div style="font-size:12px;font-weight:600;color:var(--${color});margin-bottom:6px;">${escapeHtml(title)} (${list.length})</div>
      <div class="table-wrap"><table><thead><tr><th>IP</th><th>主机名</th><th>延迟</th><th>开放端口</th></tr></thead><tbody>
      ${list.map(dev => `<tr>
        <td class="cell-mono">${escapeHtml(dev.ip)}</td><td>${escapeHtml(dev.hostname||'-')}</td><td>${dev.ping_ms!=null?dev.ping_ms.toFixed(1)+'ms':'-'}</td>
        <td>${(dev.open_ports||[]).map(p=>`<span class="badge ${p.port===554||p.port===8554?'badge-blue':'badge-gray'}" style="margin-right:4px;">${escapeHtml(p.port)} ${escapeHtml(p.service||'')}</span>`).join('')||'无'}</td>
      </tr>`).join('')}</tbody></table></div></div>` : '';
    result.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:var(--blue)">${d.total_hosts}</div><div class="label">总主机数</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:var(--green)">${d.drone_transmitter_count}</div><div class="label">无人机设备</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num" style="color:var(--yellow)">${d.base_station_count}</div><div class="label">基站设备</div></div></div>
        <div class="stat-card"><div class="stat-info"><div class="num">${d.unknown_count}</div><div class="label">未知设备</div></div></div>
      </div>
      ${renderDevices(d.drone_transmitters,'无人机图传设备','primary')}
      ${renderDevices(d.base_stations,'基站设备','yellow')}
      ${renderDevices(d.unknown_devices,'未知设备','muted')}
      <div style="margin-top:16px;text-align:right;"><button class="btn btn-primary" onclick="diNext()">下一步 →</button></div>`;
    toast(`扫描完成: ${d.drone_transmitter_count} 台无人机, ${d.base_station_count} 台基站`);
  } catch(ex) { result.innerHTML = `<div style="color:var(--red);padding:16px;text-align:center;">扫描失败: ${escapeHtml(ex.message)}</div>`; toast(ex.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '扫描子网'; }
}
