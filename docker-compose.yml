
name: yugan-intelligence

services:
  # ─ 基础设施 ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: yugan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_inspection
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - yugan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yugan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - yugan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ─ 后端服务 ──────────────────────────────
  # 无人机数据系统后端
  drone-db:
    build:
      context: ./drone/drone-db-prototype/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/warehouse_inspection
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./drone/drone-db-prototype/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - yugan-network

  # 仓库巡检系统后端
  warehouse:
    build:
      context: ./station/warehouse-inspection-system/backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/warehouse_inspection
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./station/warehouse-inspection-system/backend:/app
      - ./station/warehouse-inspection-system/storage:/app/storage
    devices:
      # Linux 串口设备映射
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
      - "/dev/ttyACM0:/dev/ttyACM0"
      # WSL COM端口映射 (Windows COM7 → WSL /dev/ttyS6)
      - "/dev/ttyS6:/dev/ttyS6"
    privileged: true
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - yugan-network

  # API网关
  api-gateway:
    build:
      context: ./app/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - IS_DOCKER=true
      - DRONE_DB_URL=http://drone-db:8000
      - WAREHOUSE_URL=http://warehouse:8000
    depends_on:
      - drone-db
      - warehouse
    volumes:
      - ./app/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - yugan-network

networks:
  yugan-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
